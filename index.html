        // stat line reflects what's actually generating fantasy points.
        const sack    = pick('sack', 'def_sack');
        const ints    = pick('def_int', 'int');
        const fumRec  = pick('def_fum_rec', 'fum_rec');
        const defTd   = pick('def_td');
        const stTd    = (s.def_st_td || 0) + (s.def_pr_td || 0) + (s.def_kr_td || 0);
        const safety  = pick('safe', 'def_safe');
        const blocked = pick('blk_kick', 'def_blk');
        const ff      = pick('def_ff', 'ff');                  // forced fumbles
        const fourthStop = pick('def_4_and_stop');
        const ptsAllow = s.pts_allow;
        return fmtParts(
          sack       ? `${sack} SACK` : null,
          ints       ? `${ints} INT` : null,
          fumRec     ? `${fumRec} FR` : null,
          ff         ? `${ff} FF` : null,
          defTd      ? `${defTd} DEF TD` : null,
          stTd       ? `${stTd} ST TD` : null,
          safety     ? `${safety} SAF` : null,
          blocked    ? `${blocked} BLK` : null,
          fourthStop ? `${fourthStop} 4DN STOP` : null,
          ptsAllow != null ? `${ptsAllow} PA` : null
        ) || 'DNP';
      }
      default:
        return '';
    }
  }

  // Player avatar HTML. Sleeper headshot URL pattern works for most active
  // players; for team defenses we go straight to the ESPN team logo. Two-level
  // onerror fallback in case Sleeper has no headshot for a given player.
  function playerAvatarHtml(player) {
    if (!player) return '';
    const posClass = `pos-${player.position}`;
    const teamLogo = `https://a.espncdn.com/i/teamlogos/nfl/500/${(player.team || '').toLowerCase()}.png`;
    if (player.position === 'DEF') {
      return `<div class="md-player-avatar ${posClass}"><img src="${teamLogo}" onerror="this.style.display='none'" alt=""></div>`;
    }
    const headshot = `https://sleepercdn.com/content/nfl/players/thumb/${player.player_id}.jpg`;
    return `
      <div class="md-player-avatar ${posClass}">
        <img src="${headshot}"
             onerror="this.onerror=null; this.src='${teamLogo}'; this.onerror=function(){this.style.display='none'; this.parentElement.textContent='${getInitials(player.name)}';}"
             alt="${player.name}">
      </div>
    `;
  }

  // Compute a team's form GOING INTO the given week (exclusive of throughWeek).
  // Returns wins/losses/ties as of that point in time, plus current win/loss
  // streak and weekly-point standard deviation so a superlative can be picked.
  // For week 1 (no prior games), everything returns 0.
  function computeTeamForm(rosterId, throughWeek) {
    const weeklyResults = []; // 'W' / 'L' / 'T' in chronological order
    const weeklyPts = [];
    let wins = 0, losses = 0, ties = 0;
    for (let w = 1; w < throughWeek; w++) {
      const matchups = state.weeklyMatchups[w] || [];
      const matchup = matchups.find(x => x.home === rosterId || x.away === rosterId);
      if (!matchup) continue;
      const isHome = matchup.home === rosterId;
      const myPts = isHome ? matchup.homePts : matchup.awayPts;
      const oppPts = isHome ? matchup.awayPts : matchup.homePts;
      // Skip future/unplayed weeks — Sleeper returns 0 for both sides when
      // the games haven't been played yet, which would look like a tie.
      if (myPts === 0 && oppPts === 0) continue;
      weeklyPts.push(myPts);
      if (myPts > oppPts) { weeklyResults.push('W'); wins++; }
      else if (myPts < oppPts) { weeklyResults.push('L'); losses++; }
      else { weeklyResults.push('T'); ties++; }
    }
    // Count current win/loss streak (from the end backward)
    let winStreak = 0, lossStreak = 0;
    for (let i = weeklyResults.length - 1; i >= 0; i--) {
      if (weeklyResults[i] === 'W' && lossStreak === 0) winStreak++;
      else if (weeklyResults[i] === 'L' && winStreak === 0) lossStreak++;
      else break;
    }
    // Standard deviation of weekly points — high stdev = boom or bust
    const n = weeklyPts.length;
    let stdev = 0;
    if (n > 1) {
      const mean = weeklyPts.reduce((a, b) => a + b, 0) / n;
      const variance = weeklyPts.reduce((s, p) => s + (p - mean) ** 2, 0) / n;
      stdev = Math.sqrt(variance);
    }
    return { weeklyResults, weeklyPts, winStreak, lossStreak, stdev, wins, losses, ties };
  }

  // Pick the best superlative for a team based on its form going into a week.
  // Returns { className, label } or null if nothing remarkable.
  function pickTeamSuperlative(form) {
    if (form.winStreak >= 3)  return { className: 'hot',  label: `🔥 Won ${form.winStreak} straight` };
    if (form.lossStreak >= 3) return { className: 'cold', label: `❄️ Lost ${form.lossStreak} straight` };
    if (form.stdev > 30)      return { className: 'boom', label: '🎢 Boom or Bust' };
    return null;
  }

  // ----- Playoff bracket rendering -----------------------------------------
  // Sleeper's winners_bracket / losers_bracket endpoints return an array of
  // matchup nodes. Each node has {r: round, m: matchup-id, t1, t2, w, l,
  // t1_from, t2_from}. t1/t2 are roster IDs (null if not yet decided), w/l
  // are the winning/losing roster IDs (null until played), and the *_from
  // fields point at the prior matchup whose winner (or loser) feeds this slot.
  function renderBracket(bracket, title, iconEmoji, loserAdvances = false) {
    if (!bracket || bracket.length === 0) {
      return `
        <div class="bracket-section">
          <div class="bracket-section-title"><span class="icon">${iconEmoji}</span>${title}</div>
          <div class="bracket-empty">Bracket hasn't been generated yet.</div>
        </div>
      `;
    }

    const playoffStartWeek = state.league?.settings?.playoff_week_start || 15;

    // Score-lookup helper (unchanged from before)
    const getMatchupScores = (round, node) => {
      if (node.t1_points != null || node.t2_points != null) {
        return [node.t1_points || 0, node.t2_points || 0];
      }
      if (!node.t1 || !node.t2) return [null, null];
      const week = playoffStartWeek + round - 1;
      const weekMs = state.weeklyMatchups[week] || [];
      const m = weekMs.find(x =>
        (x.home === node.t1 && x.away === node.t2) ||
        (x.home === node.t2 && x.away === node.t1)
      );
      if (!m) return [null, null];
      return [
        m.home === node.t1 ? m.homePts : m.awayPts,
        m.home === node.t2 ? m.homePts : m.awayPts
      ];
    };

    const getSeed = (rosterId) => {
      if (!rosterId) return null;
      const standings = getStandings();
      const idx = standings.findIndex(s => s.rosterId === rosterId);
      return idx >= 0 ? idx + 1 : null;
    };

    const renderTeamRow = (rosterId, score, advances, eliminated, fromRef) => {
      if (!rosterId) {
        const refText = fromRef?.w ? `Winner of M${fromRef.w}` :
                        fromRef?.l ? `Loser of M${fromRef.l}` : 'TBD';
        return `
          <div class="bracket-team tbd">
            <span class="bracket-team-name">${refText}</span>
          </div>
        `;
      }
      const seed = getSeed(rosterId);
      const name = getTeamName(rosterId);
      const cls = advances ? 'winner' : (eliminated ? 'loser' : '');
      return `
        <div class="bracket-team ${cls}">
          ${seed != null ? `<span class="bracket-seed">${seed}</span>` : ''}
          <span class="bracket-team-name">${name}</span>
          ${score != null ? `<span class="bracket-team-score">${score.toFixed(1)}</span>` : ''}
        </div>
      `;
    };

    const renderMatchup = (node, round, topPx) => {
      const [s1, s2] = getMatchupScores(round, node);
      const t1Won  = node.w != null && node.w === node.t1;
      const t2Won  = node.w != null && node.w === node.t2;
      const t1Lost = node.l != null && node.l === node.t1;
      const t2Lost = node.l != null && node.l === node.t2;
      const t1Advances    = loserAdvances ? t1Lost : t1Won;
      const t2Advances    = loserAdvances ? t2Lost : t2Won;
      const t1Eliminated  = loserAdvances ? t1Won  : t1Lost;
      const t2Eliminated  = loserAdvances ? t2Won  : t2Lost;
      const style = topPx != null ? `style="position: absolute; top: ${topPx}px; left: 0; right: 0;"` : '';
      return `
        <div class="bracket-matchup" data-matchup-id="${node.m}" ${style}>
          ${renderTeamRow(node.t1, s1, t1Advances, t1Eliminated, node.t1_from)}
          ${renderTeamRow(node.t2, s2, t2Advances, t2Eliminated, node.t2_from)}
        </div>
      `;
    };

    // ---- Group by placement ----
    // Sleeper's `p` field on each node is the placement that match decides.
    // 1 = championship (the main winner-take-all sub-bracket); 3 = 3rd-place
    // game; 5 = 5th-place game; 7 = 7th-place; etc.
    // Nodes that are part of the main bracket (i.e., produce winners that
    // feed forward into the championship) DON'T have a `p` field set on them
    // — only the final games of each placement group do. So we group by:
    //   "championship sub-bracket" — every node whose downstream path leads
    //     to the p=1 game, INCLUDING the p=1 game itself
    //   one group per other unique `p` value
    const totalRounds = Math.max(...bracket.map(n => n.r));

    // Build a map from matchup-id (m) to node, plus a reverse map of which
    // nodes consume each node's output.
    const byId = {};
    bracket.forEach(n => { byId[n.m] = n; });

    // A node can feed BOTH a winner-consumer (e.g. its winner goes to the
    // championship final) and a loser-consumer (e.g. its loser goes to the
    // 3rd-place game). For the placement walk we follow the winner-path
    // since the winner-path is what the bracket's main flow is. Separate
    // maps for each so we don't overwrite.
    const winnerConsumerOf = {}; // m -> m of node whose t*_from.w points here
    const loserConsumerOf  = {}; // m -> m of node whose t*_from.l points here
    bracket.forEach(n => {
      if (n.t1_from?.w) winnerConsumerOf[n.t1_from.w] = n.m;
      if (n.t2_from?.w) winnerConsumerOf[n.t2_from.w] = n.m;
      if (n.t1_from?.l) loserConsumerOf[n.t1_from.l] = n.m;
      if (n.t2_from?.l) loserConsumerOf[n.t2_from.l] = n.m;
    });

    // Walk forward via winner-path first; if no winner-consumer exists
    // (e.g. a node is only a feeder for someone's loser), fall back to the
    // loser-consumer. This terminates at a node with a `p` field, which
    // tells us what placement this whole chain decides.
    const placementOf = (m) => {
      const visited = new Set();
      let cur = byId[m];
      while (cur && !visited.has(cur.m)) {
        if (cur.p != null) return cur.p;
        visited.add(cur.m);
        const nextM = winnerConsumerOf[cur.m] ?? loserConsumerOf[cur.m];
        if (nextM == null) return null;
        cur = byId[nextM];
      }
      return null;
    };

    // Group nodes by placement
    const groups = {}; // placement -> [nodes]
    bracket.forEach(n => {
      const p = placementOf(n.m);
      const key = p == null ? 'main' : p;
      (groups[key] = groups[key] || []).push(n);
    });
    // Sleeper sometimes omits `p` on first-round nodes whose downstream IS
    // the championship game — those land in the 'main' bucket and should be
    // merged into placement 1. If we have both a `1` group and a `main`
    // group, the main group is championship preliminaries.
    if (groups[1] && groups.main) {
      groups[1] = [...groups.main, ...groups[1]];
      delete groups.main;
    } else if (groups.main && !groups[1]) {
      groups[1] = groups.main;
      delete groups.main;
    }

    // Order: championship (p=1) first, then 3, 5, 7, ...
    const placementOrder = Object.keys(groups).map(Number).sort((a, b) => a - b);

    const placementLabel = (p) => {
      if (p === 1) return loserAdvances ? 'Toilet Bowl Championship' : 'Championship Bracket';
      if (p === 3) return loserAdvances ? '12th Place Game' : '3rd Place Game';
      // For positions 5+, label is "Nth place game"
      const ordinal = (n) => {
        const j = n % 10, k = n % 100;
        if (j === 1 && k !== 11) return `${n}st`;
        if (j === 2 && k !== 12) return `${n}nd`;
        if (j === 3 && k !== 13) return `${n}rd`;
        return `${n}th`;
      };
      return `${ordinal(p)} Place Game`;
    };

    const roundLabel = (r) => {
      if (r === totalRounds) return 'Final';
      if (r === totalRounds - 1) return 'Semifinal';
      if (r === totalRounds - 2) return 'Quarterfinal';
      return `Round ${r}`;
    };

    // Render a placement group. Computes each matchup's vertical position
    // based on its feeders so a downstream matchup always centers between
    // its two feeders — regardless of bracket size (8/10/12/14 teams etc).
    // Handles byes correctly: a matchup with only one feeder still gets
    // positioned as if it had two by inferring the missing feeder's slot.
    const renderPlacementGroup = (placement, nodes) => {
      const isChampionship = placement === 1;
      // Group nodes within this placement by round
      const nodesByRound = {};
      nodes.forEach(n => {
        (nodesByRound[n.r] = nodesByRound[n.r] || []).push(n);
      });
      const roundNumbers = Object.keys(nodesByRound).map(Number).sort((a, b) => a - b);

      // ---- Compute the vertical position (in px) of every matchup ----
      const MATCHUP_HEIGHT = 76;    // 2 rows × 37px + 2px border
      const ROUND1_GAP = 10;
      const positionOf = {}; // m -> top px (matchup's top edge)

      // Place round-1 matchups in a vertical stack
      const firstRound = roundNumbers[0];
      const firstRoundNodes = nodesByRound[firstRound].slice().sort((a, b) => a.m - b.m);
      firstRoundNodes.forEach((n, i) => {
        positionOf[n.m] = i * (MATCHUP_HEIGHT + ROUND1_GAP);
      });

      // Round 2+ positioning. Instead of computing each matchup from its
      // own feeder refs (which breaks with byes), we place matchups
      // sequentially between consecutive matchups of the prior round.
      // For 3 prior matchups at positions P1, P2, P3, this round's matchups
      // sit at midpoint(P1,P2) and midpoint(P2,P3) — i.e., a downstream
      // matchup is nested between two upstream ones. This works cleanly
      // for any bracket topology including byes.
      const centerOf = (m) => positionOf[m] + MATCHUP_HEIGHT / 2;

      for (let ri = 1; ri < roundNumbers.length; ri++) {
        const r = roundNumbers[ri];
        const sortedNodes = nodesByRound[r].slice().sort((a, b) => a.m - b.m);
        const priorRoundNodes = (nodesByRound[roundNumbers[ri - 1]] || [])
          .slice()
          .sort((a, b) => centerOf(a.m) - centerOf(b.m));
        const priorCenters = priorRoundNodes.map(p => centerOf(p.m));

        sortedNodes.forEach((n, idx) => {
          let targetCenter;
          // Standard case: this matchup sits between prior[idx] and prior[idx+1]
          if (idx < priorCenters.length - 1) {
            targetCenter = (priorCenters[idx] + priorCenters[idx + 1]) / 2;
          } else if (idx === priorCenters.length - 1 && priorCenters.length >= 2) {
            // Final matchup of a round with N downstream and N+1 upstream:
            // mirror the spacing — sits one gap below the last prior matchup
            const priorGap = priorCenters[1] - priorCenters[0];
            targetCenter = priorCenters[priorCenters.length - 1] + priorGap / 2;
          } else if (priorCenters.length === 1) {
            // Only one prior matchup — anchor directly below it
            targetCenter = priorCenters[0] + (MATCHUP_HEIGHT + ROUND1_GAP);
          } else {
            // No prior matchups at all — fallback to stacking
            const maxBottom = Math.max(0,
              ...Object.values(positionOf).map(p => p + MATCHUP_HEIGHT));
            targetCenter = maxBottom + ROUND1_GAP + MATCHUP_HEIGHT / 2;
          }
          positionOf[n.m] = targetCenter - MATCHUP_HEIGHT / 2;
        });
      }

      // After all positions are computed, shift the whole column down if
      // any position went negative (happens when a matchup's bye-fallback
      // anchored it above the first round-1 matchup).
      const minTop = Math.min(0, ...Object.values(positionOf));
      if (minTop < 0) {
        Object.keys(positionOf).forEach(k => {
          positionOf[k] -= minTop;
        });
      }

      // Total column height = bottom of lowest matchup
      const columnHeight = Math.max(MATCHUP_HEIGHT,
        ...Object.values(positionOf).map(p => p + MATCHUP_HEIGHT));

      const roundsHtml = roundNumbers.map(r => {
        const matchups = nodesByRound[r].slice().sort((a, b) => a.m - b.m);
        return `
          <div class="bracket-round">
            <div class="bracket-round-title">${roundLabel(r)}</div>
            <div class="bracket-round-matchups" style="position: relative; height: ${columnHeight}px;">
              ${matchups.map(node => renderMatchup(node, r, positionOf[node.m])).join('')}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="bracket-placement-group ${isChampionship ? 'championship' : ''}">
          <div class="bracket-rounds">${roundsHtml}</div>
        </div>
      `;
    };

    // Only render the main championship bracket (p=1). Side-game placements
    // (3rd place, 5th place, etc.) are real fantasy games but adding them
    // clutters the layout — they live in the regular Matchups grid above.
    const groupsHtml = groups[1]
      ? renderPlacementGroup(1, groups[1])
      : '<div class="bracket-empty">Championship bracket hasn\'t been generated yet.</div>';

    return `
      <div class="bracket-section">
        <div class="bracket-section-title"><span class="icon">${iconEmoji}</span>${title}</div>
        ${groupsHtml}
      </div>
    `;
  }

  // Get player score for a specific week (using the weeks array).
  // NOTE: this is a legacy helper from demo mode — real player data (state.players)
  // doesn't have a per-week scores array, so this gracefully returns 0/seasonAvg.
  function getPlayerWeekScore(player, week) {
    if (!player) return 0;
    if (!player.weeks) return player.seasonAvg || 0;
    const idx = (state.availableWeeks || []).indexOf(week);
    return idx >= 0 ? player.weeks[idx] : (player.seasonAvg || 0);
  }


  let state = {
    selectedSeason: null,    // which SEASON_OPTIONS entry is active -- set by init()/switchSeason()
    league: { name: '', season: '', settings: {} }, users: [], rosters: [],
    weeklyMatchups: {}, activityByWeek: {}, nflGames: [],
    liveNflGames: [],       // stable snapshot of the live season's ACTUAL current-week ESPN games --
                             // unlike nflGames, never reassigned by the sidebar's own week-browsing
                             // dropdown, so the matchup detail's per-player game-status indicator
                             // always reflects "right now," not whatever week the sidebar is browsing.
    winnersBracket: [], losersBracket: [],
    draft: null, draftPicks: [], draftTradedPicks: [],
    blowout: null, champions: [], players: [],
    selectedWeek: null, currentView: 'dashboard',
    currentWeek: null,       // set from real data once league loads
    availableWeeks: null,    // set from real data — array of weeks 1..currentWeek
    nflWeekInfo: null,       // { label, year, seasontype, week, isHistorical }
    nflFetchInFlight: false, // throttle the sidebar week dropdown
    statsByWeek: {},         // cache: week → { player_id: stat object } from Sleeper stats API
    statsFetching: new Set(),// in-flight stat fetches (set of weeks) to dedupe
    projectionsByWeek: {},   // cache: week → { player_id: projection object } from Sleeper projections API
    projectionsFetching: new Set(),// in-flight projection fetches (set of weeks) to dedupe
    activeMatchupId: null, activeTeamId: null, activePlayerId: null,
    activeNflGameId: null, activeGcTab: 'stats',
    showBench: false,
    compareIds: [],
    draftView: 'grid',
    draftFilter: { team: 'ALL', round: 'ALL', position: 'ALL' },
    draftTab: null,          // 'board' | 'prep' -- defaulted in renderDraftView based on whether a draft board exists
    draftPrepSeason: null,   // which ARCHIVED season Draft Prep shows -- independent of the main season selector
    draftPrepFilters: { search: '', position: 'ALL', sortBy: 'seasonPts', sortDir: 'desc' },
    injuryFilter: { status: 'ALL', position: 'ALL', owner: 'ALL' },
    injuryRiskWeek: null,   // which week the lineup-risk panel displays; null = current week
    practiceReportWeek: null, // which week the Practice Report tab shows; null = latest available
    practiceReportFilters: { search: '', position: 'ALL', team: 'ALL', rostered: 'ALL', sortBy: 'relevance', sortDir: 'desc' },
    compareFilters: { search: '', position: 'ALL', team: 'ALL', owner: 'ALL', injury: 'ALL', sortBy: 'sleeperProj', sortDir: 'desc' },
    compareWeek: null,    // null = current week; otherwise a specific week to compare projections/stats for
    playerFilters: { search: '', position: 'ALL', team: 'ALL', owner: 'ALL', injury: 'ALL', sortBy: 'sleeperProj', sortDir: 'desc' },
    playerWeek: null,        // null = current week; otherwise the projection week the Players list shows
    matchupPanelPosition: 'WR', // which position tab the Dashboard's Matchup Ratings panel shows
    tendenciesSelectedTeam: null, // null = league-wide Team Tendencies view; a team code = that team's detail view
    tendenciesSortMetric: 'proe', // which column the Team Tendencies league table is sorted by
  };

  let chartInstances = {};

  // Cache of already-loaded ARCHIVED (non-live) seasons' full
  // fetchAllRealData() bundles, keyed by season number. An archive is a
  // frozen, immutable snapshot -- the real Sleeper standings/matchups AND
  // the archived export both describe a season that's already over and
  // can never change -- so caching one permanently for the rest of this
  // page session is always correct, not just an optimization with a
  // staleness risk. The LIVE season is deliberately NEVER cached here:
  // its Sleeper data and its own export can both change while this page
  // is open, so switching back to it always re-fetches fresh.
  //
  // Keyed by the season number itself -- deliberately not the
  // statsByWeek/projectionsByWeek mistake this same round fixed (keyed by
  // week number ALONE, so one season's data could silently answer for
  // another's). A Map keyed by season can't collide across seasons by
  // construction: switching 2023 -> 2024 -> 2023 always reads the entry
  // stored under the key 2023, never anything cached under 2024.
  const seasonDataCache = new Map();

  // Draft Prep (below, renderDraftPrepSection) needs only an archived
  // season's export + the Sleeper player DB for name/position/team -- not
  // the full fetchAllRealData() bundle (matchups, transactions, draft,
  // brackets), which it never reads. archivedExportCache is a lightweight,
  // season-keyed fallback for when seasonDataCache doesn't already have
  // that season's bundle cached (checked first -- free reuse whenever the
  // main season selector already loaded that archive). draftPrepFetching
  // dedupes concurrent fetch triggers the same way statsFetching/
  // projectionsFetching already do for their own caches.
  const archivedExportCache = new Map();
  const draftPrepFetching = new Set();

  // ============================================
  // TOAST + COMPARE HELPERS
  // ============================================
  const MAX_COMPARE = 4;

  function showToast(message, action) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<span>${message}</span>${action ? `<button class="toast-action">${action.label}</button>` : ''}`;
    if (action) {
      toast.querySelector('.toast-action').addEventListener('click', () => {
        action.onClick();
        toast.classList.add('exiting');
        setTimeout(() => toast.remove(), 250);
      });
    }
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('exiting');
      setTimeout(() => toast.remove(), 250);
    }, 4000);
  }

  function isCompared(playerId) { return state.compareIds.includes(playerId); }

  function addToCompare(playerId) {
    if (state.compareIds.length >= MAX_COMPARE) {
      showToast(`<strong>Max ${MAX_COMPARE} players.</strong> Remove one to add more.`);
      return false;
    }
    if (!isCompared(playerId)) {
      state.compareIds.push(playerId);
      const p = state.players.find(x => x.player_id === playerId);
      showToast(
        `Added <strong>${p.name}</strong> to comparison (${state.compareIds.length}/${MAX_COMPARE})`,
        { label: 'View', onClick: () => {
          state.activePlayerId = null;
          state.currentView = 'comparison';
          document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
          document.querySelector('.nav-link[data-view="comparison"]')?.classList.add('active');
          renderView();
        }}
      );
      return true;
    }
    return false;
  }

  function removeFromCompare(playerId) {
    state.compareIds = state.compareIds.filter(id => id !== playerId);
  }

  function clearCompare() {
    state.compareIds = [];
  }

  function destroyCharts() {
    Object.values(chartInstances).forEach(c => c?.destroy());
    chartInstances = {};
  }

  // Whichever season has real data, checked explicitly rather than assumed
  // -- this is the ONE place "does the live season have real data yet"
  // still gets checked, now to pick an honest DEFAULT selection rather
  // than to silently swap which league's data loads. Falls back to the
  // most recent archive (SEASON_OPTIONS' first non-live entry) when the
  // live league hasn't started yet; falls back to the live season itself
  // if even the league fetch fails, so init() always has SOME season to
  // try next rather than never starting.
  //
  // Checks the league's own `status` field (pre_draft/drafting/in_season/
  // complete), not roster win/loss totals -- those only populate once a
  // week is fully scored, which used to mean a genuinely in-progress live
  // season (real draft, real rosters, real games kicked off) still lost
  // the default to last year's archive for the entire first week, simply
  // because no matchup had been settled yet.
  async function determineDefaultSeason() {
    const live = SEASON_OPTIONS.find(s => s.live);
    try {
      const league = await fetchJSON(`${API}/league/${live.leagueId}`);
      if (league.status && league.status !== 'pre_draft' && league.status !== 'drafting') {
        return live.season;
      }
    } catch (e) {
      console.warn('Could not check live season status, defaulting to the most recent archive:', e);
    }
    const mostRecentArchive = SEASON_OPTIONS.find(s => !s.live);
    return mostRecentArchive ? mostRecentArchive.season : live.season;
  }

  function renderSeasonSelector() {
    const sel = document.getElementById('season-selector');
    if (!sel) return;
    sel.innerHTML = SEASON_OPTIONS.map(opt =>
      `<option value="${opt.season}"${opt.season === state.selectedSeason ? ' selected' : ''}>
        ${opt.season}${opt.live ? '' : ' (archive)'}
      </option>`
    ).join('');
    sel.disabled = false;
    sel.onchange = () => switchSeason(Number(sel.value));
  }

  // Honest context for whichever season is selected -- an archived season
  // says plainly that it's a completed-season snapshot; the live season
  // only gets a note when there's genuinely nothing live yet (no "hasn't
  // drafted yet" framing anymore -- the selector itself already makes
  // clear which season you're looking at, so there's nothing left to
  // explain a silent switch away from).
  function updateSeasonBanner() {
    const banner = document.getElementById('season-banner');
    const opt = SEASON_OPTIONS.find(s => s.season === state.selectedSeason);
    if (!opt) { banner.style.display = 'none'; return; }
    if (!opt.live) {
      banner.innerHTML =
        `📁 <span>Viewing the <strong>${opt.season}</strong> season — a completed-season archive. ` +
        `Final standings and real season stats; nothing here is live.</span>`;
      banner.style.display = 'flex';
    } else {
      const hasGames = state.rosters.some(r =>
        (r.settings?.wins || 0) + (r.settings?.losses || 0) + (r.settings?.ties || 0) > 0
      );
      if (!hasGames) {
        banner.innerHTML = `🕐 <span><strong>${opt.season}</strong> season — nothing live yet.</span>`;
        banner.style.display = 'flex';
      } else {
        banner.style.display = 'none';
      }
    }
  }

  // Load one season's data end to end and swap the whole page over to it.
  // Shared by init() (first load) and the season selector's onchange
  // (switchSeason below) so there's exactly one place that knows how to
  // bring the dashboard into a fully-consistent state for a given season.
  async function loadSeason(season) {
    state.selectedSeason = season;
    // statsByWeek/projectionsByWeek are keyed by WEEK NUMBER ONLY, not
    // (season, week) -- safe as long as only one season is ever loaded
    // per page load, which is no longer true once a season switch is
    // possible. Without this reset, switching from a 17-week 2025 archive
    // back to 2026 would let 2025's week-1 stats silently answer for
    // 2026's week 1 (both cached under the same key "1"). Cleared here,
    // not re-keyed by season, since nothing needs a completed season's
    // stats cache to survive a switch away from it -- switching back just
    // re-fetches, cheap for real per-week data that never changes once final.
    state.statsByWeek = {};
    state.statsFetching = new Set();
    state.projectionsByWeek = {};
    state.projectionsFetching = new Set();

    const seasonOption = SEASON_OPTIONS.find(s => s.season === season);
    let realData;
    if (seasonOption && !seasonOption.live && seasonDataCache.has(season)) {
      realData = seasonDataCache.get(season); // archived + already visited this session -- instant, no fetch
    } else {
      realData = await fetchAllRealData(season);
      if (seasonOption && !seasonOption.live) seasonDataCache.set(season, realData);
    }
    Object.assign(state, realData);
    document.getElementById('league-info-text').innerHTML = `<strong>${state.league.name}</strong>`;
    renderSeasonSelector();
    updateSeasonBanner();
    renderSidebar();
    renderView();
  }

  // Season selector's onchange handler. Resets every detail-view/active-ID
  // piece of state first -- a season switch must never leave a player/
  // team/matchup/gamecast detail view open referencing an ID from the OLD
  // season's roster_ids or player set, which could silently resolve to a
  // different real entity (or nothing) under the new season's data. "No
  // mixed-season pages" applies to navigation state, not just the data.
  async function switchSeason(newSeason) {
    if (newSeason === state.selectedSeason) return;
    const sel = document.getElementById('season-selector');
    if (sel) sel.disabled = true;
    state.activeMatchupId = null;
    state.activeTeamId = null;
    state.activePlayerId = null;
    state.activeNflGameId = null;
    document.getElementById('main-content').innerHTML =
      `<div class="loading"><div class="spinner"></div>Loading ${newSeason} season...</div>`;
    try {
      await loadSeason(newSeason);
    } catch (err) {
      console.error(`Season switch to ${newSeason} failed:`, err);
      showToast(`Couldn't load the ${newSeason} season. ${err.message}`);
      // Revert to whatever season is actually still loaded in state, both
      // on screen and in the dropdown, rather than leaving the page on a
      // half-updated season.
      if (sel) sel.value = state.selectedSeason;
      renderSidebar();
      renderView();
    } finally {
      if (sel) sel.disabled = false;
    }
  }

  async function init() {
    document.getElementById('main-content').innerHTML =
      `<div class="loading"><div class="spinner"></div>Loading league data...</div>`;
    try {
      const defaultSeason = await determineDefaultSeason();
      await loadSeason(defaultSeason);
    } catch (err) {
      console.error('Real data fetch failed:', err);
      document.getElementById('main-content').innerHTML = `
        <div class="error" style="background: #fef2f2; border: 1px solid #fecaca; border-left: 4px solid var(--danger); padding: 20px; border-radius: 8px;">
          <h3 style="color: var(--danger); margin-bottom: 8px;">⚠️ Failed to load league data</h3>
          <p style="margin-bottom: 8px;">${err.message}</p>
          <p style="font-size: 12px; color: var(--text-muted);">Open the browser console (F12) for details.</p>
          <button id="retry-load-btn" style="margin-top: 12px; padding: 6px 14px; border: 1px solid var(--danger); background: white; color: var(--danger); border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">Retry</button>
        </div>`;
      document.getElementById('retry-load-btn')?.addEventListener('click', () => {
        location.reload();
      });
    }
  }

  // ============================================
  // REAL DATA FETCHERS (Sleeper + ESPN)
  // ============================================
  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status} on ${url.split('/').slice(-2).join('/')}`);
    return res.json();
  }

  async function fetchAllRealData(season) {
    const seasonOption = SEASON_OPTIONS.find(s => s.season === season);
    if (!seasonOption) {
      throw new Error(`Unknown season ${season} -- not in SEASON_OPTIONS.`);
    }
    const leagueId = seasonOption.leagueId;

    // Step 1: Fetch league, users, rosters for the SELECTED season. No
    // previous_league_id fallback here anymore -- the season selector is
    // the explicit, user-visible version of that same idea (see
    // PROJECT_CONTEXT.md's Phase 9 findings for why it replaces the
    // fallback rather than sitting alongside it).
    const [league, users, rosters] = await Promise.all([
      fetchJSON(`${API}/league/${leagueId}`),
      fetchJSON(`${API}/league/${leagueId}/users`),
      fetchJSON(`${API}/league/${leagueId}/rosters`)
    ]);

    // ---- League-size compatibility check ----
    // The bracket layout, KPI cards, and several views were designed around
    // standard fantasy league sizes (8 / 10 / 12 / 14 teams). Other sizes
    // would render with broken alignment. Reject gracefully here so the
    // user knows what's wrong rather than seeing a half-broken dashboard.
    const SUPPORTED_LEAGUE_SIZES = [8, 10, 12, 14];
    const teamCount = rosters.length;
    if (!SUPPORTED_LEAGUE_SIZES.includes(teamCount)) {
      const err = new Error(
        `League size not compatible. This dashboard supports ${SUPPORTED_LEAGUE_SIZES.join('/')}-team leagues; ` +
        `the league you entered has ${teamCount} teams.`
      );
      err.code = 'UNSUPPORTED_SIZE';
      throw err;
    }

    const currentWeek = league.settings?.leg || 1;
    const availableWeeks = [];
    for (let w = 1; w <= currentWeek; w++) availableWeeks.push(w);

    // Step 2: Fetch matchups for the visible weeks
    const matchupsByWeek = {};
    await Promise.all(availableWeeks.map(async w => {
      try {
        const raw = await fetchJSON(`${API}/league/${league.league_id}/matchups/${w}`);
        // Sleeper returns one entry per roster; pair them up by matchup_id
        const grouped = {};
        raw.forEach(m => {
          if (!grouped[m.matchup_id]) grouped[m.matchup_id] = [];
          grouped[m.matchup_id].push(m);
        });
        matchupsByWeek[w] = Object.values(grouped).map(pair => {
          if (pair.length < 2) return null;
          // pair[0] and pair[1] are two rosters that played each other.
          // We label them home/away arbitrarily (Sleeper doesn't distinguish).
          const homeData = pair[0];
          const awayData = pair[1];
          return {
            matchup_id: homeData.matchup_id,
            home: homeData.roster_id,
            away: awayData.roster_id,
            homePts: homeData.points || 0,
            awayPts: awayData.points || 0,
            // Per-side lineup data needed to render the matchup detail view.
            // `starters` is in roster-slot order; `players` includes bench.
            // `starters_points` is aligned with `starters`. `players_points`
            // is an object keyed by player_id.
            homeStarters: homeData.starters || [],
            awayStarters: awayData.starters || [],
            homePlayers: homeData.players || [],
            awayPlayers: awayData.players || [],
            homeStartersPoints: homeData.starters_points || [],
            awayStartersPoints: awayData.starters_points || [],
            homePlayerPts: homeData.players_points || {},
            awayPlayerPts: awayData.players_points || {}
          };
        }).filter(Boolean);
      } catch (e) {
        console.warn(`Matchups week ${w} failed:`, e);
        matchupsByWeek[w] = [];
      }
    }));

    // Step 3: Fetch player database (LARGE — ~5MB, cache aggressively)
    const playerDb = await fetchPlayerDatabase();

    // Step 4: Fetch transactions for activity feed (current week)
    let activityByWeek = {};
    await Promise.all(availableWeeks.map(async w => {
      try {
        const txns = await fetchJSON(`${API}/league/${league.league_id}/transactions/${w}`);
        activityByWeek[w] = mapSleeperTransactions(txns, users, rosters, playerDb);
      } catch (e) { activityByWeek[w] = []; }
    }));

    // Step 5: Fetch NFL games from ESPN -- LIVE season only. ESPN's
    // scoreboard endpoint always returns TODAY's games regardless of what
    // season is asked for, so there's no honest way to scope it to an
    // archived season; showing it there would be exactly the
    // mixed-season problem the season selector exists to fix (real 2026
    // scores next to a 2025 archive). renderSidebar() shows an explicit
    // "not available for archives" message when nflGames stays empty here.
    let nflGames = [];
    let nflWeekInfo = { label: 'NFL', isHistorical: false };
    if (seasonOption.live) {
      try {
        const nflResult = await fetchNFLGames();
        nflGames = nflResult.games || [];
        nflWeekInfo = nflResult.weekInfo || nflWeekInfo;
      } catch (e) { console.warn('ESPN fetch failed, using empty:', e); }
    }

    // Step 5b: Fetch playoff brackets — winners and losers (toilet bowl).
    // Sleeper returns these arrays of {r, m, t1, t2, w, l, t1_from, t2_from}.
    // They may be empty arrays if the brackets haven't been generated yet
    // (e.g. before the playoff_week_start), in which case we render a
    // "playoffs haven't started" message in the matchups view.
    const [winnersBracket, losersBracket] = await Promise.all([
      fetchJSON(`${API}/league/${league.league_id}/winners_bracket`).catch(() => []),
      fetchJSON(`${API}/league/${league.league_id}/losers_bracket`).catch(() => [])
    ]);

    // Step 5c: Fetch the real draft and its picks. A league may have multiple
    // drafts across its lifetime (rookie, supplemental, etc.); we use the
    // most recent one. Pulls picks (with player metadata) and traded picks
    // in parallel — both are needed for the Draft view to render correctly.
    let draft = null;
    let draftPicks = [];
    let draftTradedPicks = [];
    try {
      const drafts = await fetchJSON(`${API}/league/${league.league_id}/drafts`);
      if (drafts && drafts.length > 0) {
        // Sleeper returns drafts newest-first; pick the most recent completed one.
        draft = drafts[0];
        [draftPicks, draftTradedPicks] = await Promise.all([
          fetchJSON(`${API}/draft/${draft.draft_id}/picks`).catch(() => []),
          fetchJSON(`${API}/draft/${draft.draft_id}/traded_picks`).catch(() => [])
        ]);
      }
    } catch (e) { console.warn('Draft fetch failed:', e); }

    // Step 6: Map players to our internal format
    const players = mapSleeperPlayers(playerDb, rosters);

    // Compute biggest blowout (across all matchups of the season)
    const blowout = computeBiggestBlowout(matchupsByWeek);

    // Step 7: This project's own model output -- the export matching the
    // SELECTED season: the always-current live export, or a frozen
    // archive (scripts/archive_season.py), per seasonOption.exportPath.
    // Not critical -- a missing/failed fetch leaves advancedStats null and
    // "My Proj"/radar/heatmap correctly show as unavailable, same honesty
    // as any other placeholder in this dashboard, rather than breaking
    // the whole load.
    const advancedStats = await fetchJSON(seasonOption.exportPath).catch(() => null);

    return {
      league,
      users,
      rosters,
      players,
      // Player lookup index keyed by player_id. Lets the matchup detail
      // resolve starter/bench IDs to full player objects in O(1).
      playersById: Object.fromEntries(players.map(p => [p.player_id, p])),
      weeklyMatchups: matchupsByWeek,
      activityByWeek,
      winnersBracket: winnersBracket || [],
      losersBracket: losersBracket || [],
      draft: draft || null,
      draftPicks: draftPicks || [],
      draftTradedPicks: draftTradedPicks || [],
      nflGames,
      // A stable copy of the same fetch, kept separate from nflGames so the
      // matchup detail's per-player game-status indicator (below) always
      // reflects the real current week even after the sidebar's own week-
      // browsing dropdown (renderSidebar) reassigns state.nflGames to some
      // other week the user is idly looking at.
      liveNflGames: nflGames,
      nflWeekInfo,
      blowout: blowout || null,
      champions: [],
      currentWeek,
      availableWeeks,
      selectedWeek: currentWeek,
      advancedStats,
      selectedSeason: season
    };
  }

  // Looks up this project's own model output (Phase 7 export) for one
  // player at one (season, week). Returns null unless the export's own
  // meta.season/meta.week actually match what's being viewed -- the export
  // only ever holds ONE week's projection at a time, so a stale number
  // shown under a different, currently-selected week would be worse than
  // showing nothing.
  function getMyProj(playerId, season, week) {
    const advanced = state.advancedStats;
    if (!advanced || Number(advanced.meta?.season) !== Number(season) || Number(advanced.meta?.week) !== Number(week)) {
      return null;
    }
    return advanced.players?.[playerId]?.projection || null;
  }

  // Monte Carlo block (boom/bust/thresholds/quantiles/game_id) is a
  // WEEK-SPECIFIC forward prediction, same as getMyProj's `projection` --
  // gated the same way (season+week must match the currently-loaded
  // export) so a stale cached bundle for a different week never gets
  // shown as if it described the week on screen. Archives never carry
  // this block (scripts/archive_season.py never passes player_sim_metrics
  // -- see src/export.py's own comment for why), so this returns null for
  // every archived season, same as the top-level `simulation` block does.
  function getMonteCarlo(playerId, season, week) {
    const advanced = state.advancedStats;
    if (!advanced || Number(advanced.meta?.season) !== Number(season) || Number(advanced.meta?.week) !== Number(week)) {
      return null;
    }
    return advanced.players?.[playerId]?.monte_carlo || null;
  }

  // Family 5B's per-player matchup block is a WEEK-SPECIFIC read. Two
  // sources, checked in order:
  //   1. `matchup` -- the single UPCOMING-week block, gated on
  //      meta.season/meta.week matching (same pattern as getMyProj/
  //      getMonteCarlo) so a stale opponent never shows for a week that
  //      isn't the one the loaded export actually describes.
  //   2. `weekly_matchup[week]` -- a REAL, already-played week's matchup
  //      (src/export.py::build_weekly_matchup), which exists for any
  //      season/week this player actually played, live or archived. This
  //      is what lets a SEASON ARCHIVE show a real matchup at all -- an
  //      archive's own `matchup` is always null (there's no "upcoming
  //      week" for a season that's already over -- see
  //      build_matchup_snapshot's own docstring), and it's also what lets
  //      a live, in-progress season show a real matchup for an
  //      already-played week, not just the next one.
  // Nothing here needs a season check for #2 -- weekly_matchup is keyed
  // by week number within whichever season's export is currently loaded,
  // the same implicit scoping every other per-week field in this payload
  // (weekly_xfp, the game log) already relies on.
  function getMatchup(playerId, season, week) {
    const advanced = state.advancedStats;
    if (!advanced) return null;
    const player = advanced.players?.[playerId];
    if (!player) return null;
    if (Number(advanced.meta?.season) === Number(season) && Number(advanced.meta?.week) === Number(week)) {
      if (player.matchup) return player.matchup;
    }
    return player.weekly_matchup?.[String(week)] || null;
  }

  function monteCarloCaveatText() {
    return state.advancedStats?.meta?.monte_carlo_caveat
      || "These are Monte Carlo estimates from the model's calibrated quantiles; ceilings run conservative, so boom rates read a bit low.";
  }

  // ---- Client-side start-over-replacement -----------------------------
  // Reimplements src/simulate.py's one-factor Gaussian copula in JS --
  // see build_player_simulation_metrics's docstring (src/export.py) for
  // why the export carries each player's 5 quantiles + game_id instead of
  // 10,000 raw draws: at ~465 exported players that's millions of numbers
  // for one week, versus a few floats and a string per player here. The
  // client draws its OWN fresh Monte Carlo sample from those ingredients
  // -- a valid estimate of the same well-defined probability doesn't need
  // to replay Python's specific random draws, only the same model (same
  // quantile-implied marginal per player, same shared-game-factor
  // correlation for two players who share a real game_id).
  //
  // GAME_ENVIRONMENT_RHO mirrors src/simulate.py's constant of the same
  // name exactly -- keep in lockstep if that ever changes.
  const GAME_ENVIRONMENT_RHO = 0.35;
  const SOR_N_SIMS = 10000; // matches meta.monte_carlo_n_sims (SIMULATION_N_SIMS_MATCHUP)

  // Abramowitz & Stegun 7.1.26 -- ~1e-7 max error, plenty for a Monte
  // Carlo estimate that already carries its own sampling noise.
  function erf(x) {
    const sign = x < 0 ? -1 : 1;
    x = Math.abs(x);
    const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
    const t = 1 / (1 + p * x);
    const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
    return sign * y;
  }
  function normalCdf(x) { return 0.5 * (1 + erf(x / Math.SQRT2)); }

  // Box-Muller standard normal sampler.
  function sampleStandardNormal(n) {
    const out = new Float64Array(n);
    for (let i = 0; i < n; i += 2) {
      let u1 = 0;
      while (u1 === 0) u1 = Math.random(); // avoid log(0)
      const u2 = Math.random();
      const r = Math.sqrt(-2 * Math.log(u1));
      out[i] = r * Math.cos(2 * Math.PI * u2);
      if (i + 1 < n) out[i + 1] = r * Math.sin(2 * Math.PI * u2);
    }
    return out;
  }

  // Piecewise-linear inverse-CDF from 5 known (percentile, value) points,
  // mirroring src/simulate.py::_inverse_quantile_row exactly -- including
  // linear extrapolation beyond [0.10, 0.90] (a plain interpolation would
  // silently flatten the tails, understating variance exactly where a
  // Monte Carlo estimate needs it most).
  const QUANTILE_POINTS = [0.10, 0.25, 0.50, 0.75, 0.90];
  function inverseQuantileRow(u, q) {
    const values = [q.q10, q.q25, q.q50, q.q75, q.q90];
    if (u <= QUANTILE_POINTS[0]) {
      const slope = (values[1] - values[0]) / (QUANTILE_POINTS[1] - QUANTILE_POINTS[0]);
      return values[0] + slope * (u - QUANTILE_POINTS[0]);
    }
    if (u >= QUANTILE_POINTS[4]) {
      const slope = (values[4] - values[3]) / (QUANTILE_POINTS[4] - QUANTILE_POINTS[3]);
      return values[4] + slope * (u - QUANTILE_POINTS[4]);
    }
    for (let i = 0; i < 4; i++) {
      if (u >= QUANTILE_POINTS[i] && u <= QUANTILE_POINTS[i + 1]) {
        const frac = (u - QUANTILE_POINTS[i]) / (QUANTILE_POINTS[i + 1] - QUANTILE_POINTS[i]);
        return values[i] + frac * (values[i + 1] - values[i]);
      }
    }
    return q.q50; // unreachable -- QUANTILE_POINTS spans [0,1] inclusive at both ends checked above
  }

  // One player's simulated draws: z_game is SHARED across every player
  // passed the same zGameByGameId Map with the same game_id (the whole
  // correlation mechanism), drawn once per game and reused -- a player
  // with a null game_id (no real game this week) gets a private z_game
  // nothing else shares, which is mathematically identical to pure
  // idiosyncratic noise (see build_player_simulation_metrics's docstring).
  function samplePlayerDraws(monteCarlo, nSims, zGameByGameId) {
    const zIdio = sampleStandardNormal(nSims);
    let zGame;
    const gameId = monteCarlo.game_id;
    if (gameId != null) {
      if (!zGameByGameId.has(gameId)) zGameByGameId.set(gameId, sampleStandardNormal(nSims));
      zGame = zGameByGameId.get(gameId);
    } else {
      zGame = sampleStandardNormal(nSims);
    }
    const a = Math.sqrt(GAME_ENVIRONMENT_RHO), b = Math.sqrt(1 - GAME_ENVIRONMENT_RHO);
    const draws = new Float64Array(nSims);
    for (let i = 0; i < nSims; i++) {
      const u = normalCdf(a * zGame[i] + b * zIdio[i]);
      draws[i] = inverseQuantileRow(u, monteCarlo.quantiles);
    }
    return draws;
  }

  // How often player A outscores player B across the SAME simulated week
  // -- the direct reason this needs simulation rather than comparing two
  // point estimates: if A and B share a real game_id, their draws are
  // correlated (drawn from a shared zGameByGameId Map), so a shootout or
  // a slog moves both together, exactly like src/simulate.py's Python-side
  // simulator. Mirrors src/simulate.py::start_over_replacement_prob's
  // return shape.
  function startOverReplacementProb(monteCarloA, monteCarloB, nSims = SOR_N_SIMS) {
    if (!monteCarloA || !monteCarloB) return null;
    const zGameByGameId = new Map();
    const drawsA = samplePlayerDraws(monteCarloA, nSims, zGameByGameId);
    const drawsB = samplePlayerDraws(monteCarloB, nSims, zGameByGameId);
    let aOverB = 0, bOverA = 0;
    for (let i = 0; i < nSims; i++) {
      if (drawsA[i] > drawsB[i]) aOverB++;
      else if (drawsB[i] > drawsA[i]) bOverA++;
    }
    return {
      a_over_b_prob: aOverB / nSims,
      b_over_a_prob: bOverA / nSims,
      tie_prob: (nSims - aOverB - bOverA) / nSims,
    };
  }

  // Memoized per (season, week, playerA, playerB) -- a fresh Monte Carlo
  // re-run on every keystroke/re-render would both waste work and make
  // the displayed percentage visibly jitter between renders for no
  // reason (renderView() fires on every filter/sort/search change, not
  // just when the compared players actually change). Cleared implicitly
  // by the season/week prefix in the key, not by any explicit eviction --
  // at most a few dozen entries accumulate in a session, negligible.
  const sorCache = new Map();
  function cachedStartOverReplacement(playerAId, monteCarloA, playerBId, monteCarloB, season, week) {
    const key = `${season}:${week}:${playerAId}:${playerBId}`;
    if (!sorCache.has(key)) {
      sorCache.set(key, startOverReplacementProb(monteCarloA, monteCarloB));
    }
    return sorCache.get(key);
  }

  // Honest caveat for "My Proj" labels, pulled from the export's own
  // meta.caveats when loaded (e.g. "Sleeper's projections are more
  // accurate than this model at every position") so the UI never implies
  // more than the model itself reports.
  function myProjTooltip() {
    const caveats = state.advancedStats?.meta?.caveats;
    return caveats?.length
      ? caveats.join(' ')
      : "Sleeper's own projection is more accurate than this model at every position.";
  }

  // ---- Phase 8 round 1: usage trends, xFP regression, opportunity shares.
  // All three panels below read from state.advancedStats.players[id], the
  // same object getMyProj() already reads. Every helper here returns an
  // honest empty result (null/[]) rather than a fake number when the export
  // hasn't loaded or doesn't cover a player -- the panels render an
  // "Awaiting model output" placeholder in that case, same pattern already
  // used for the Position Profile / Heatmap cards below.
  function getAdvancedPlayer(playerId) {
    return state.advancedStats?.players?.[playerId] || null;
  }

  const TREND_FEATURE_LABELS = { target_share: 'Target Share', carry_share: 'Carry Share', snap_share: 'Snap Share' };

  // One player's single biggest non-red-zone usage-trend signal, or null
  // if every feature is stable/unsigalled -- red_zone_share is
  // deliberately excluded here -- PROJECT_CONTEXT.md's Phase 3' findings
  // measured its hold-rate under 50% even at the validated window/
  // threshold (a "rise" reverts more often than it holds), too noisy to
  // headline either a leaderboard entry or a single player's trend badge.
  // Shared by getUsageTrendLeaders (Round 1's Dashboard leaderboard) and
  // the compact trend indicator on the Opportunity Shares panel (Round 3)
  // so the two can never define "biggest signal" differently.
  function getPlayerTrendHeadline(trend) {
    if (!trend) return null;
    let best = null;
    ['target_share', 'carry_share', 'snap_share'].forEach(feat => {
      const t = trend[feat];
      if (!t || t.signal == null || !t.direction || t.direction === 'stable') return;
      if (!best || Math.abs(t.signal) > Math.abs(best.signal)) {
        best = { feature: feat, current: t.current, signal: t.signal, direction: t.direction };
      }
    });
    return best;
  }

  // Combined usage-trend leaderboard across every player the export
  // covers, one row per player (its single biggest signal, not one row
  // per feature) -- this is meant to answer "who's trending right now",
  // not "rank every feature separately".
  function getUsageTrendLeaders(limit) {
    const players = state.advancedStats?.players;
    if (!players) return { risers: [], fallers: [] };
    const rows = [];
    Object.entries(players).forEach(([playerId, data]) => {
      const best = getPlayerTrendHeadline(data.trend);
      if (best) rows.push({ playerId, ...best });
    });
    const risers = rows.filter(r => r.direction === 'rising').sort((a, b) => b.signal - a.signal).slice(0, limit);
    const fallers = rows.filter(r => r.direction === 'falling').sort((a, b) => a.signal - b.signal).slice(0, limit);
    return { risers, fallers };
  }

  // Season-long xFP luck leaderboard. Covers QB now too (src/usage.py's
  // add_xfp_features gained a dropback + designed-rush bucket model for
  // QB -- see PROJECT_CONTEXT.md's QB xFP findings), not just RB/WR/TE.
  // Still no explicit position filter needed here -- a player only drops
  // out of `rows` if fp_over_expected itself is null (an early-history
  // bucket-coverage gap, not a position gap). fp_over_expected > 0 means
  // scoring ABOVE what opportunity alone implies -- a luck indicator, not
  // a prediction.
  function getXfpLeaders(limit) {
    const players = state.advancedStats?.players;
    if (!players) return { positive: [], negative: [] };
    const rows = [];
    Object.entries(players).forEach(([playerId, data]) => {
      const xfp = data.xfp;
      if (!xfp || xfp.fp_over_expected == null) return;
      rows.push({ playerId, ...xfp });
    });
    const positive = rows.filter(r => r.fp_over_expected > 0).sort((a, b) => b.fp_over_expected - a.fp_over_expected).slice(0, limit);
    const negative = rows.filter(r => r.fp_over_expected < 0).sort((a, b) => a.fp_over_expected - b.fp_over_expected).slice(0, limit);
    return { positive, negative };
  }

  function trendRowHtml(r) {
    const player = state.playersById[r.playerId];
    if (!player) return '';
    const rising = r.direction === 'rising';
    const pct = r.current != null ? (r.current * 100).toFixed(1) + '%' : '—';
    return `
      <div class="kpi-card" data-player-id="${r.playerId}" style="cursor: pointer;">
        <div class="kpi-icon ${rising ? 'trend' : 'target'}">${rising ? '↑' : '↓'}</div>
        <div class="kpi-content">
          <div class="kpi-label">${player.name} <span class="pos-badge ${player.position}" style="font-size: 9px; padding: 1px 4px;">${player.position}</span></div>
          <div class="kpi-value">${pct}</div>
          <div class="kpi-sub">${TREND_FEATURE_LABELS[r.feature]} · ${player.team || 'FA'}</div>
        </div>
      </div>
    `;
  }

  function renderUsageTrendingPanel() {
    const advanced = state.advancedStats;
    const { risers, fallers } = advanced ? getUsageTrendLeaders(5) : { risers: [], fallers: [] };
    const hasAny = risers.length || fallers.length;

    let body;
    if (!advanced) {
      body = `
        <div class="pd-placeholder">
          <div class="pd-placeholder-icon">📈</div>
          <div class="pd-placeholder-title">Awaiting model output</div>
          <div class="pd-placeholder-text">
            Once <code>player_advanced_stats.json</code> loads, this panel will show players whose target, carry,
            or snap share is running meaningfully above or below their own season baseline.
          </div>
        </div>
      `;
    } else if (!hasAny) {
      body = `
        <div class="pd-placeholder">
          <div class="pd-placeholder-icon">📈</div>
          <div class="pd-placeholder-title">No trend signal yet</div>
          <div class="pd-placeholder-text">
            Usage trends need at least 5 games played this season and populate from Week 6 onward.
            Nothing to show until then.
          </div>
        </div>
      `;
    } else {
      body = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div>
            <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--success); margin-bottom: 8px;">🔺 Risers</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${risers.length ? risers.map(trendRowHtml).join('') : '<div class="pd-placeholder-text">None right now</div>'}
            </div>
          </div>
          <div>
            <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--danger); margin-bottom: 8px;">🔻 Fallers</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${fallers.length ? fallers.map(trendRowHtml).join('') : '<div class="pd-placeholder-text">None right now</div>'}
            </div>
          </div>
        </div>
      `;
    }

    return `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Usage Trending</div>
          <div class="panel-note">Target/carry/snap share vs. own baseline</div>
        </div>
        ${body}
      </div>
    `;
  }

  function xfpRowHtml(r) {
    const player = state.playersById[r.playerId];
    if (!player) return '';
    const positive = r.fp_over_expected > 0;
    const sign = positive ? '+' : '';
    const color = positive ? 'var(--success)' : 'var(--danger)';
    // QB's fp_over_expected strips out meaningfully less luck than RB/WR/TE's
    // does (split-half reliability check: QB residual correlation 0.37 vs.
    // 0.19 for RB/WR/TE -- see PROJECT_CONTEXT.md's QB xFP findings) -- a
    // real passer's own accuracy/decision-making persists across weeks more
    // than a receiver's catch variance does, so a chunk of a QB's number
    // here is real, repeatable skill, not just bounce. Said inline, not
    // buried, so a big QB number doesn't read with the same confidence as
    // the same number for a receiver.
    const qbCaveat = player.position === 'QB'
      ? `<div class="kpi-sub" style="color: var(--text-muted);">QB: partly real accuracy, not purely luck</div>`
      : '';
    return `
      <div class="kpi-card" data-player-id="${r.playerId}" style="cursor: pointer;">
        <div class="kpi-icon ${positive ? 'trend' : 'target'}">🎲</div>
        <div class="kpi-content">
          <div class="kpi-label">${player.name} <span class="pos-badge ${player.position}" style="font-size: 9px; padding: 1px 4px;">${player.position}</span></div>
          <div class="kpi-value" style="color: ${color};">${sign}${r.fp_over_expected.toFixed(1)} pts</div>
          <div class="kpi-sub">${r.season_actual.toFixed(1)} actual vs. ${r.season_xfp.toFixed(1)} expected</div>
          ${qbCaveat}
        </div>
      </div>
    `;
  }

  function renderXfpPanel() {
    const advanced = state.advancedStats;
    const { positive, negative } = advanced ? getXfpLeaders(5) : { positive: [], negative: [] };
    const hasAny = positive.length || negative.length;

    let body;
    if (!advanced) {
      body = `
        <div class="pd-placeholder">
          <div class="pd-placeholder-icon">🎲</div>
          <div class="pd-placeholder-title">Awaiting model output</div>
          <div class="pd-placeholder-text">
            Once <code>player_advanced_stats.json</code> loads, this panel will show RB/WR/TE running furthest
            above or below what their opportunities alone would predict.
          </div>
        </div>
      `;
    } else if (!hasAny) {
      body = `
        <div class="pd-placeholder">
          <div class="pd-placeholder-icon">🎲</div>
          <div class="pd-placeholder-title">No games played yet</div>
          <div class="pd-placeholder-text">
            xFP compares actual production to opportunity across the completed season.
            Nothing to show until real games are on the board.
          </div>
        </div>
      `;
    } else {
      body = `
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--success);">Over Expected (lucky)</div>
          ${positive.length ? positive.map(xfpRowHtml).join('') : '<div class="pd-placeholder-text">None</div>'}
          <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--danger); margin-top: 8px;">Under Expected (unlucky)</div>
          ${negative.length ? negative.map(xfpRowHtml).join('') : '<div class="pd-placeholder-text">None</div>'}
        </div>
      `;
    }

    return `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">xFP Regression</div>
          <div class="panel-note">Luck indicator, not a prediction · weaker signal for QB</div>
        </div>
        ${body}
      </div>
    `;
  }

  // ---- Family 5B: opponent defensive strength -- how many xFP a defense
  // has trailingly allowed to a position, opponent-adjusted. Reads
  // state.advancedStats.defense_rankings (league-wide, one list per
  // position, most-favorable-to-face first) for the standalone panel, and
  // state.advancedStats.players[id].matchup (this week's own opponent +
  // that opponent's rank) for the per-player indicator. QB is honestly
  // absent from defense_rankings entirely and null in every player's own
  // matchup.rank -- there's no expected-passing-points model to rate a
  // defense against opposing QBs (see src/usage.py's own scope-gap note),
  // not a rendering bug.
  function getDefenseRankings(position) {
    return state.advancedStats?.defense_rankings?.[position] || [];
  }

  // Tercile split of a rank within its pool -- "favorable" (top third,
  // allows the most, best matchup for an offensive player at this
  // position), "tough" (bottom third), "neutral" (the middle). A simple,
  // explainable cut rather than a model-derived threshold -- this is a
  // display tier, not a feature.
  function matchupFavorability(rank, poolSize) {
    if (rank == null || !poolSize) return null;
    const pct = (rank - 1) / poolSize; // 0 = most favorable, ~1 = toughest
    if (pct < 1 / 3) return { tier: 'favorable', label: 'Favorable', color: 'var(--success)', icon: '🟢' };
    if (pct > 2 / 3) return { tier: 'tough', label: 'Tough', color: 'var(--danger)', icon: '🔴' };
    return { tier: 'neutral', label: 'Neutral', color: 'var(--text-muted)', icon: '⚪' };
  }

  // Compact badge for a player row / opportunity shares panel -- honest
  // "—" when this week's opponent isn't known yet, the position is QB (no
  // rating exists to show), or the displayed week isn't the export's own
  // week (see getMatchup's gating), not a fabricated neutral reading.
  function matchupIndicatorHtml(playerId, season, week) {
    const m = getMatchup(playerId, season, week);
    if (!m || !m.opponent) return '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
    const fav = matchupFavorability(m.rank, m.pool_size);
    if (!fav) {
      return `<span style="color: var(--text-muted); font-size: 11px;" title="No matchup rating for this position/week">vs ${m.opponent}</span>`;
    }
    return `
      <span style="font-size: 12px; white-space: nowrap;" title="${fav.label} matchup vs ${m.opponent} — ranked ${m.rank} of ${m.pool_size} defenses allowed to this position (most-favorable-first)">
        ${fav.icon} <span style="color: ${fav.color}; font-weight: 600;">vs ${m.opponent}</span>
      </span>
    `;
  }

  function defenseRankRowHtml(entry, poolSize) {
    const fav = matchupFavorability(entry.rank, poolSize);
    return `
      <div class="kpi-card">
        <div class="kpi-icon ${fav?.tier === 'favorable' ? 'trend' : 'target'}">${fav ? fav.icon : '⚪'}</div>
        <div class="kpi-content">
          <div class="kpi-label">${entry.team} <span style="color: var(--text-muted); font-weight: 400;">#${entry.rank} of ${poolSize}</span></div>
          <div class="kpi-value">${entry.adj_s2d.toFixed(1)} xFP/gm</div>
          <div class="kpi-sub">opponent-adjusted, season-to-date</div>
        </div>
      </div>
    `;
  }

  const MATCHUP_PANEL_POSITIONS = ['RB', 'WR', 'TE'];

  function renderMatchupPanel() {
    const advanced = state.advancedStats;
    const pos = MATCHUP_PANEL_POSITIONS.includes(state.matchupPanelPosition) ? state.matchupPanelPosition : 'WR';
    const rankings = advanced ? getDefenseRankings(pos) : [];
    const poolSize = rankings.length;

    const tabsHtml = `
      <div style="display: flex; gap: 6px; margin-bottom: 12px;">
        ${MATCHUP_PANEL_POSITIONS.map(p => `
          <button class="filter-select" data-matchup-pos="${p}" style="padding: 4px 14px; cursor: pointer; ${p === pos ? 'background: var(--accent); color: #fff; border-color: var(--accent);' : ''}">${p}</button>
        `).join('')}
      </div>
    `;

    let body;
    if (!advanced) {
      body = `
        <div class="pd-placeholder">
          <div class="pd-placeholder-icon">🛡️</div>
          <div class="pd-placeholder-title">Awaiting model output</div>
          <div class="pd-placeholder-text">
            Once <code>player_advanced_stats.json</code> loads, this panel will show which defenses are
            allowing the most/least expected fantasy points per position this week.
          </div>
        </div>
      `;
    } else if (poolSize === 0) {
      body = `
        <div class="pd-placeholder">
          <div class="pd-placeholder-icon">🛡️</div>
          <div class="pd-placeholder-title">No matchup ratings yet for ${pos}</div>
          <div class="pd-placeholder-text">
            Every defense needs a handful of its own games played this season before a rating exists —
            this populates from around Week 6 onward, the same floor every other trailing signal in this
            dashboard uses.
          </div>
        </div>
      `;
    } else {
      const favorable = rankings.slice(0, 5);
      const tough = rankings.slice(-5).reverse();
      body = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div>
            <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--success); margin-bottom: 8px;">🟢 Favorable matchups</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${favorable.map(e => defenseRankRowHtml(e, poolSize)).join('')}
            </div>
          </div>
          <div>
            <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--danger); margin-bottom: 8px;">🔴 Tough matchups</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${tough.map(e => defenseRankRowHtml(e, poolSize)).join('')}
            </div>
          </div>
        </div>
      `;
    }

    return `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Matchup Ratings</div>
          <div class="panel-note">xFP allowed by position, opponent-adjusted · RB/WR/TE only</div>
        </div>
        ${tabsHtml}
        ${body}
      </div>
    `;
  }

  // QB Context: replaces Opportunity Shares for QB. Snap %/target share/
  // carry share/red-zone share are meaningless for a position that takes
  // every offensive snap and never has a target or carry share -- this
  // panel leads with Rushing Share of Points instead, because this league
  // pays 0.1/rush yard and 6/rush TD against 0.04/pass yard and 4/pass TD,
  // so a rushing QB banks real points before he ever throws. That's the
  // single most decision-relevant QB number this dashboard had nowhere to
  // show before src/usage.py::add_qb_rushing_share_feature existed.
  // Same three-state honesty pattern as renderPositionProfilePanel: no
  // `usage` block at all reads as "awaiting model output"; a real block
  // with a null field (week 1, before shift(1) has a prior game to read)
  // reads as "no games yet" per stat, same null branch as shareCard below.
  function renderQBContextPanel(p) {
    const advanced = getAdvancedPlayer(p.player_id);
    if (!advanced) {
      return `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">QB Context</div>
            <div class="panel-note">Dropback &amp; rushing profile, season to date</div>
          </div>
          <div class="pd-placeholder">
            <div class="pd-placeholder-icon">📋</div>
            <div class="pd-placeholder-title">Awaiting model output</div>
            <div class="pd-placeholder-text">
              Once <code>player_advanced_stats.json</code> covers this player, rushing share of points,
              dropback volume, and passing efficiency will appear here.
            </div>
          </div>
        </div>
      `;
    }
    const usage = advanced.usage || {};
    const rushShare = usage.rushing_share_of_points_s2d;
    const statCard = (icon, iconClass, label, formatted, sub) => `
      <div class="injury-stat-card">
        <div class="injury-stat-icon ${iconClass}">${icon}</div>
        <div class="injury-stat-content">
          <div class="injury-stat-label">${label}</div>
          ${formatted != null
            ? `<div class="injury-stat-value">${formatted}</div><div class="injury-stat-sub">${sub}</div>`
            : `<div class="injury-stat-value" style="color: var(--text-muted);">—</div><div class="injury-stat-sub">No games yet</div>`}
        </div>
      </div>
    `;
    return `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">QB Context</div>
          <div class="panel-note">Dropback &amp; rushing profile, season to date</div>
        </div>
        <div class="injury-stat-grid" style="grid-template-columns: 1fr;">
          ${statCard('🏃', 'orange', 'Rushing Share of Points', rushShare != null ? `${(rushShare * 100).toFixed(1)}%` : null,
            'Share of this player\'s own custom points that came from rushing -- this league pays 0.1/yd + 6/TD on the ground vs. 0.04/yd + 4/TD through the air')}
        </div>
        <div class="injury-stat-grid" style="margin-top: 10px;">
          ${statCard('🏈', 'blue', 'Dropbacks', usage.dropbacks_s2d != null ? usage.dropbacks_s2d.toFixed(1) : null, 'Per game')}
          ${statCard('🔄', 'orange', 'Designed Rush Att', usage.designed_rush_attempts_s2d != null ? usage.designed_rush_attempts_s2d.toFixed(1) : null, 'Per game')}
          ${statCard('🎯', 'purple', 'CPOE', usage.cpoe_s2d != null ? `${usage.cpoe_s2d >= 0 ? '+' : ''}${usage.cpoe_s2d.toFixed(1)}%` : null, 'Completion % over expected')}
          ${statCard('⚡', 'red', 'EPA / Dropback', usage.epa_per_dropback_s2d != null ? usage.epa_per_dropback_s2d.toFixed(2) : null, 'Real per-play value, pass + sack')}
        </div>
      </div>
    `;
  }

  // Kicker Stats: replaces Opportunity Shares for K. A kicker has no
  // snaps, targets, or carries -- what matters is accuracy, and accuracy
  // varies enormously by distance, so this shows PAT rate plus FG rate
  // broken out by band rather than one blended FG% that would hide a
  // 50+ specialist behind a mediocre inside-30 sample (or vice versa).
  // Built by src/kicker_defense.py::build_kicker_season_stats from
  // nflverse's weekly stats, which ship FG makes pre-binned by distance --
  // no play-by-play parsing needed. Season-to-date real totals, not a
  // point-in-time feature (see that module's docstring) -- no leakage
  // concern, so no shift(1) here, unlike every stat above.
  function renderKickerStatsPanel(p) {
    const advanced = getAdvancedPlayer(p.player_id);
    const stats = advanced?.kicker_stats;
    if (!stats) {
      return `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Kicker Stats</div>
            <div class="panel-note">Season to date</div>
          </div>
          <div class="pd-placeholder">
            <div class="pd-placeholder-icon">📋</div>
            <div class="pd-placeholder-title">Awaiting model output</div>
            <div class="pd-placeholder-text">
              Once <code>player_advanced_stats.json</code> covers this player, PAT rate, FG rate by distance
              band, and attempts per game will appear here.
            </div>
          </div>
        </div>
      `;
    }
    const statCard = (icon, iconClass, label, value, sub, isPct) => `
      <div class="injury-stat-card">
        <div class="injury-stat-icon ${iconClass}">${icon}</div>
        <div class="injury-stat-content">
          <div class="injury-stat-label">${label}</div>
          ${value != null
            ? `<div class="injury-stat-value">${isPct ? (value * 100).toFixed(1) + '%' : value}</div><div class="injury-stat-sub">${sub}</div>`
            : `<div class="injury-stat-value" style="color: var(--text-muted);">—</div><div class="injury-stat-sub">No attempts in this band</div>`}
        </div>
      </div>
    `;
    return `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Kicker Stats</div>
          <div class="panel-note">${stats.games_played} games this season</div>
        </div>
        <div class="injury-stat-grid">
          ${statCard('🥅', 'blue', 'PAT Rate', stats.pat_rate, `${stats.pat_made}/${stats.pat_att}`, true)}
          ${statCard('🎯', 'orange', 'FG Under 30', stats.fg_rate_under_30, 'Make rate', true)}
          ${statCard('🎯', 'purple', 'FG 30-39', stats.fg_rate_30_39, 'Make rate', true)}
          ${statCard('🎯', 'red', 'FG 40-49', stats.fg_rate_40_49, 'Make rate', true)}
        </div>
        <div class="injury-stat-grid" style="margin-top: 10px;">
          ${statCard('🎯', 'blue', 'FG 50+', stats.fg_rate_50_plus, 'Make rate', true)}
          ${statCard('🔢', 'orange', 'Attempts', stats.attempts_per_game.toFixed(1), 'FG attempts per game', false)}
        </div>
      </div>
    `;
  }

  // Defense Stats: replaces Opportunity Shares for DEF (a team unit has
  // no individual snaps/targets/carries at all). Built by
  // src/kicker_defense.py::build_defense_season_stats from real pbp +
  // schedule aggregation -- sacks/interceptions/yards allowed from pbp,
  // points allowed and games_played from the schedule's own real scores
  // (not pbp play-counts), so a team with zero sacks this season still
  // shows 0, not a dropped row. Season-to-date real totals, same no-
  // leakage reasoning as the kicker panel above.
  function renderDefenseStatsPanel(p) {
    const advanced = getAdvancedPlayer(p.player_id);
    const stats = advanced?.defense_stats;
    if (!stats) {
      return `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Defense Stats</div>
            <div class="panel-note">Season to date</div>
          </div>
          <div class="pd-placeholder">
            <div class="pd-placeholder-icon">📋</div>
            <div class="pd-placeholder-title">Awaiting model output</div>
            <div class="pd-placeholder-text">
              Once <code>player_advanced_stats.json</code> covers this team, sacks, interceptions, yards
              allowed, and points allowed will appear here.
            </div>
          </div>
        </div>
      `;
    }
    const statCard = (icon, iconClass, label, value, sub) => `
      <div class="injury-stat-card">
        <div class="injury-stat-icon ${iconClass}">${icon}</div>
        <div class="injury-stat-content">
          <div class="injury-stat-label">${label}</div>
          <div class="injury-stat-value">${value}</div>
          <div class="injury-stat-sub">${sub}</div>
        </div>
      </div>
    `;
    return `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Defense Stats</div>
          <div class="panel-note">${stats.games_played} games this season</div>
        </div>
        <div class="injury-stat-grid">
          ${statCard('🛡️', 'red', 'Sacks', stats.sacks, 'This season')}
          ${statCard('🙌', 'blue', 'Interceptions', stats.interceptions, 'This season')}
          ${statCard('✈️', 'orange', 'Pass Yds Allowed', stats.pass_yards_allowed_per_game.toFixed(1), 'Per game')}
          ${statCard('🏃', 'purple', 'Rush Yds Allowed', stats.rush_yards_allowed_per_game.toFixed(1), 'Per game')}
        </div>
        <div class="injury-stat-grid" style="margin-top: 10px;">
          ${statCard('🔥', 'red', 'Points Allowed', stats.points_allowed_per_game.toFixed(1), 'Per game')}
        </div>
      </div>
    `;
  }

  // Player Detail's plain opportunity-share readout -- no radar, no
  // percentile, no interpretation, just the trailing numbers themselves.
  // Snap %/Target Share come from the export's `usage` block; Carry Share
  // and Red-Zone Share have no `usage.*` counterpart (the export only
  // curated a subset of rolling columns there) so they're read from
  // `trend.<feature>.current` instead -- the SAME underlying _ewm3 value,
  // just exposed under a different key. Red-Zone Share specifically uses
  // trend.red_zone_share (the properly combined rz_opportunity_share
  // metric), not usage.rz_target_share_ewm3/rz_carry_share_ewm3 separately
  // -- those two have different denominators and can't be added together,
  // see PROJECT_CONTEXT.md's design decisions.
  //
  // QB/K/DEF dispatch to their own panels above -- snap %/target share/
