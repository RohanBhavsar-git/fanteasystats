  // Open-Meteo WMO weather code → emoji + readable condition
  // Reference: https://open-meteo.com/en/docs (Weather variable documentation)
  function decodeWeatherCode(code) {
    if (code === 0) return { icon: '☀️', condition: 'Clear' };
    if (code === 1) return { icon: '🌤️', condition: 'Mostly Clear' };
    if (code === 2) return { icon: '⛅', condition: 'Partly Cloudy' };
    if (code === 3) return { icon: '☁️', condition: 'Cloudy' };
    if (code >= 45 && code <= 48) return { icon: '🌫️', condition: 'Fog' };
    if (code >= 51 && code <= 55) return { icon: '🌦️', condition: 'Drizzle' };
    if (code >= 56 && code <= 57) return { icon: '🌨️', condition: 'Freezing Drizzle' };
    if (code >= 61 && code <= 63) return { icon: '🌧️', condition: 'Rain' };
    if (code >= 65 && code <= 67) return { icon: '🌧️', condition: 'Heavy Rain' };
    if (code >= 71 && code <= 75) return { icon: '🌨️', condition: 'Snow' };
    if (code >= 77 && code <= 77) return { icon: '🌨️', condition: 'Snow Grains' };
    if (code >= 80 && code <= 82) return { icon: '🌧️', condition: 'Rain Showers' };
    if (code >= 85 && code <= 86) return { icon: '❄️', condition: 'Snow Showers' };
    if (code >= 95 && code <= 99) return { icon: '⛈️', condition: 'Thunderstorm' };
    return { icon: '🌡️', condition: 'Unknown' };
  }

  // Wind direction degrees → compass abbreviation
  function degToCompass(deg) {
    const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(deg / 22.5) % 16];
  }

  async function fetchStadiumWeather(homeTeamAbbr, gameDate) {
    const stadium = NFL_STADIUMS[homeTeamAbbr];
    if (!stadium) {
      return { icon: '🌡️', temp: 60, condition: 'Unknown', wind: 0, windDir: '–', humidity: 50, precip: 0, isDome: false };
    }
    if (stadium.dome) {
      return { icon: '🏟️', temp: 70, condition: 'Indoor', wind: 0, windDir: '–', humidity: 50, precip: 0, isDome: true };
    }

    try {
      // Request hourly forecast and we'll pick the hour closest to game time
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${stadium.lat}&longitude=${stadium.lon}` +
        `&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m` +
        `&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=7&timezone=America%2FNew_York`;
      const data = await fetchJSON(url);
      const hourly = data.hourly;
      if (!hourly || !hourly.time) throw new Error('No hourly data');

      // Find the hour closest to the game time
      const gameTime = new Date(gameDate).getTime();
      let bestIdx = 0;
      let bestDelta = Infinity;
      hourly.time.forEach((t, i) => {
        const delta = Math.abs(new Date(t).getTime() - gameTime);
        if (delta < bestDelta) { bestDelta = delta; bestIdx = i; }
      });

      const temp = Math.round(hourly.temperature_2m[bestIdx]);
      const humidity = Math.round(hourly.relative_humidity_2m[bestIdx]);
      const precip = Math.round(hourly.precipitation_probability[bestIdx] || 0);
      const code = hourly.weather_code[bestIdx];
      const wind = Math.round(hourly.wind_speed_10m[bestIdx]);
      const windDeg = hourly.wind_direction_10m[bestIdx];
      const decoded = decodeWeatherCode(code);

      return {
        icon: decoded.icon,
        temp,
        condition: decoded.condition,
        wind,
        windDir: degToCompass(windDeg),
        humidity,
        precip,
        isDome: false,
        // Trigger orange "alert" styling for severe weather
        alert: wind >= 15 || precip >= 50 || temp <= 25 || temp >= 95 || code >= 71
      };
    } catch (err) {
      console.warn(`Weather fetch failed for ${homeTeamAbbr}:`, err);
      return { icon: '🌡️', temp: 60, condition: 'See game', wind: 0, windDir: '–', humidity: 50, precip: 0, isDome: false };
    }
  }

  // Historical weather for past games via Open-Meteo's archive API.
  // Open-Meteo archive has data going back decades but has a ~5-day publishing
  // lag, so this won't work for games that ended within the last few days.
  async function fetchHistoricalWeather(homeTeamAbbr, gameDate) {
    const stadium = NFL_STADIUMS[homeTeamAbbr];
    if (!stadium) {
      return { icon: '🌡️', temp: 60, condition: 'Unknown', wind: 0, windDir: '–', humidity: 50, precip: 0, isDome: false };
    }
    if (stadium.dome) {
      return { icon: '🏟️', temp: 70, condition: 'Indoor', wind: 0, windDir: '–', humidity: 50, precip: 0, isDome: true };
    }

    try {
      // Request a 3-day window centered on game date to be robust against
      // timezone differences (game in late local evening vs UTC date rollover).
      const date = new Date(gameDate);
      const yesterday = new Date(date.getTime() - 24 * 60 * 60 * 1000);
      const tomorrow = new Date(date.getTime() + 24 * 60 * 60 * 1000);
      const startStr = yesterday.toISOString().slice(0, 10);
      const endStr = tomorrow.toISOString().slice(0, 10);

      const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${stadium.lat}&longitude=${stadium.lon}` +
        `&start_date=${startStr}&end_date=${endStr}` +
        `&hourly=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m` +
        `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York`;
      const data = await fetchJSON(url);
      const hourly = data.hourly;
      if (!hourly || !hourly.time || hourly.time.length === 0) throw new Error('No hourly data');

      // Pick the hour closest to kickoff
      const gameTime = date.getTime();
      let bestIdx = 0;
      let bestDelta = Infinity;
      hourly.time.forEach((t, i) => {
        const delta = Math.abs(new Date(t).getTime() - gameTime);
        if (delta < bestDelta) { bestDelta = delta; bestIdx = i; }
      });

      const temp = Math.round(hourly.temperature_2m[bestIdx]);
      const humidity = Math.round(hourly.relative_humidity_2m[bestIdx]);
      // Archive returns actual precipitation in mm. Convert to a 0/50/100
      // "chance-like" value so it slots into the existing UI (which expects %).
      const precipMm = hourly.precipitation[bestIdx] || 0;
      const precip = precipMm > 0.5 ? 100 : (precipMm > 0 ? 50 : 0);
      const code = hourly.weather_code[bestIdx];
      const wind = Math.round(hourly.wind_speed_10m[bestIdx]);
      const windDeg = hourly.wind_direction_10m[bestIdx];
      const decoded = decodeWeatherCode(code);

      return {
        icon: decoded.icon,
        temp,
        condition: decoded.condition,
        wind,
        windDir: degToCompass(windDeg),
        humidity,
        precip,
        isDome: false,
        alert: wind >= 15 || precip >= 50 || temp <= 25 || temp >= 95 || code >= 71
      };
    } catch (err) {
      console.warn(`Historical weather fetch failed for ${homeTeamAbbr}:`, err);
      return { icon: '🌡️', temp: 60, condition: 'Unavailable', wind: 0, windDir: '–', humidity: 50, precip: 0, isDome: false };
    }
  }

  // Pull team box stats and scoring plays from ESPN's per-game summary endpoint.
  // Called in parallel with weather for every game in the sidebar. Failures
  // degrade gracefully — the gamecast tabs handle null stats / empty scoring.
  async function fetchGameDetail(gameId, awayAbbr, homeAbbr) {
    try {
      const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${gameId}`;
      const data = await fetchJSON(url);

      // ----- Team box stats from boxscore.teams[] -----
      const teams = data.boxscore?.teams || [];
      const findTeam = abbr => teams.find(t => t.team?.abbreviation === abbr);
      const awayTeam = findTeam(awayAbbr);
      const homeTeam = findTeam(homeAbbr);

      const buildStatMap = team => {
        const m = {};
        (team?.statistics || []).forEach(s => { m[s.name] = s.displayValue; });
        return m;
      };
      const aStatMap = buildStatMap(awayTeam);
      const hStatMap = buildStatMap(homeTeam);

      // ESPN stat names — map to the fields the gamecast UI expects.
      // ESPN.com uses these exact field names in boxscore.teams[].statistics[].
      const extract = sm => ({
        // Match overview
        totalYards: parseInt(sm.totalYards) || 0,
        yardsPerPlay: parseFloat(sm.yardsPerPlay) || 0,
        possession: sm.possessionTime || '0:00',
        firstDowns: parseInt(sm.firstDowns) || 0,
        turnovers: parseInt(sm.turnovers) || 0,
        // Passing
        passYards: parseInt(sm.netPassingYards) || parseInt(sm.totalPassingYards) || 0,
        completionAttempts: sm.completionAttempts || '0-0',
        yardsPerPass: parseFloat(sm.yardsPerPass) || 0,
        intsThrown: parseInt(sm.interceptions) || 0,
        sacksYardsLost: sm.sacksYardsLost || '0-0',
        // Rushing
        rushYards: parseInt(sm.rushingYards) || 0,
        rushAttempts: parseInt(sm.rushingAttempts) || 0,
        yardsPerRushAttempt: parseFloat(sm.yardsPerRushAttempt) || 0,
        // Efficiency
        thirdDownEff: sm.thirdDownEff || '0-0',
        fourthDownEff: sm.fourthDownEff || '0-0',
        redZoneAttempts: sm.redZoneAttempts || '0-0',
        // Discipline
        totalPenaltiesYards: sm.totalPenaltiesYards || '0-0',
        fumblesLost: parseInt(sm.fumblesLost) || 0
      });

      const stats = (awayTeam && homeTeam)
        ? { away: extract(aStatMap), home: extract(hStatMap) }
        : null;

      // ----- Scoring plays. ESPN's scoringPlays[].team is sometimes just an
      // {id} reference, so build a team-id → abbreviation map from the header
      // and resolve through that as a fallback. -----
      const idToAbbr = {};
      const competitors = data.header?.competitions?.[0]?.competitors || [];
      competitors.forEach(c => {
        if (c.team?.id) idToAbbr[c.team.id] = c.team.abbreviation;
      });

      // ----- Box score: per-quarter line scores. ESPN typically nests these
      // in each competitor's `linescores` array, but for many completed games
      // the field is empty in the summary endpoint. As a robust fallback we
      // rebuild quarter scores by walking the scoring plays we already have
      // and adding each play's score delta to the appropriate quarter. -----
      const competitorByAbbr = abbr => {
        const c = competitors.find(c => c.team?.abbreviation === abbr);
        return c || null;
      };
      const awayCompetitor = competitorByAbbr(awayAbbr);
      const homeCompetitor = competitorByAbbr(homeAbbr);
      const extractLinescores = comp => {
        const lines = comp?.linescores || [];
        return lines.map(ls => {
          if (typeof ls === 'number') return ls;
          if (ls.value != null) return parseInt(ls.value) || 0;
          if (ls.displayValue != null) return parseInt(ls.displayValue) || 0;
          return 0;
        });
      };
      let awayLines = extractLinescores(awayCompetitor);
      let homeLines = extractLinescores(homeCompetitor);

      // If ESPN didn't return linescores (or all zeros), rebuild from scoring
      // plays. Each play has cumulative awayScore/homeScore after the play,
      // so the delta from the previous play is what was scored on that play.
      const hasZeroLinescores = (lines, total) =>
        lines.length === 0 || (lines.reduce((a, b) => a + b, 0) === 0 && total > 0);
      const totalAway = parseInt(awayCompetitor?.score) || 0;
      const totalHome = parseInt(homeCompetitor?.score) || 0;
      if (hasZeroLinescores(awayLines, totalAway) || hasZeroLinescores(homeLines, totalHome)) {
        const rebuilt = { away: [0, 0, 0, 0], home: [0, 0, 0, 0] };
        let prevAway = 0, prevHome = 0;
        const plays = data.scoringPlays || [];
        plays.forEach(p => {
          const periodIdx = (p.period?.number || 1) - 1;
          while (rebuilt.away.length <= periodIdx) rebuilt.away.push(0);
          while (rebuilt.home.length <= periodIdx) rebuilt.home.push(0);
          const currAway = p.awayScore != null ? p.awayScore : prevAway;
          const currHome = p.homeScore != null ? p.homeScore : prevHome;
          rebuilt.away[periodIdx] += Math.max(0, currAway - prevAway);
          rebuilt.home[periodIdx] += Math.max(0, currHome - prevHome);
          prevAway = currAway;
          prevHome = currHome;
        });
        awayLines = rebuilt.away;
        homeLines = rebuilt.home;
      }

      // Pad both to at least 4 quarters; only include OT columns if either
      // team has scoring in a period beyond Q4.
      const maxLen = Math.max(awayLines.length, homeLines.length, 4);
      while (awayLines.length < maxLen) awayLines.push(0);
      while (homeLines.length < maxLen) homeLines.push(0);
      const finalAway = totalAway || awayLines.reduce((a, b) => a + b, 0);
      const finalHome = totalHome || homeLines.reduce((a, b) => a + b, 0);
      const boxScore = (awayCompetitor && homeCompetitor)
        ? { away: awayLines, home: homeLines, awayTotal: finalAway, homeTotal: finalHome }
        : null;

      // ----- Player box stats. ESPN nests these under boxscore.players[] with
      // one entry per team. Each team has a statistics[] of categories
      // ("passing", "rushing", "receiving", "defensive", etc.), each carrying
      // an aligned (labels[], athletes[]) pair where athlete.stats[i] matches
      // labels[i]. We pull the three offensive categories and zip each row
      // into a label-keyed object so the renderer can pick what to show.
      const playerGroups = data.boxscore?.players || [];
      const findPlayerGroup = abbr => playerGroups.find(p => p.team?.abbreviation === abbr);
      const extractPlayerCategories = group => {
        const result = {
          passing: [], rushing: [], receiving: [],
          defensive: [], interceptions: [], fumbles: [],
          kicking: [], punting: [], kickReturns: [], puntReturns: []
        };
        (group?.statistics || []).forEach(cat => {
          if (!(cat.name in result)) return; // skip defensive/kicking/etc.
          const labels = cat.labels || [];
          result[cat.name] = (cat.athletes || []).map(a => {
            const obj = {
              name: a.athlete?.shortName || a.athlete?.displayName || '',
              position: a.athlete?.position?.abbreviation || ''
            };
            labels.forEach((label, i) => { obj[label] = a.stats?.[i] || '—'; });
            return obj;
          });
        });
        return result;
      };
      const playerStats = {
        away: extractPlayerCategories(findPlayerGroup(awayAbbr)),
        home: extractPlayerCategories(findPlayerGroup(homeAbbr))
      };

      const scoring = (data.scoringPlays || []).map(p => {
        const periodNum = p.period?.number || 1;
        const teamAbbr = p.team?.abbreviation || idToAbbr[p.team?.id] || '';
        return {
          qtr: periodNum > 4 ? 'OT' : `Q${periodNum}`,
          team: teamAbbr,
          desc: p.text || '',
          score: `${p.awayScore != null ? p.awayScore : 0}-${p.homeScore != null ? p.homeScore : 0}`
        };
      });

      return { stats, scoring, boxScore, playerStats };
    } catch (err) {
      console.warn(`Game detail fetch failed for ${gameId}:`, err);
      return { stats: null, scoring: [], boxScore: null, playerStats: null };
    }
  }

  // Returns the matchup with the largest margin of victory across the season.
  // Format mirrors what the dashboard KPI card expects (winning team is the
  // "target", losing team is the "opponent" — diff is always positive).
  function computeBiggestBlowout(matchupsByWeek) {
    let worst = null;
    Object.entries(matchupsByWeek).forEach(([week, matchups]) => {
      matchups.forEach(m => {
        const homeWon = m.homePts > m.awayPts;
        const winnerRoster = homeWon ? m.home : m.away;
        const loserRoster = homeWon ? m.away : m.home;
        const winnerPts = homeWon ? m.homePts : m.awayPts;
        const loserPts = homeWon ? m.awayPts : m.homePts;
        const diff = winnerPts - loserPts;
        if (diff > 0 && (!worst || diff > worst.diff)) {
          worst = {
            week: parseInt(week),
            target_roster: winnerRoster,
            opponent_roster: loserRoster,
            targetScore: winnerPts,
            opponentScore: loserPts,
            diff
          };
        }
      });
    });
    return worst;
  }

  function getHeatmapTitle(position) {
    return {
      QB: 'Pass Distribution',
      RB: 'Rushing Direction & Receiving',
      WR: 'Route Tree',
      TE: 'Route Tree',
      K: 'FG Attempts by Distance',
      DEF: 'Coverage & Pressure'
    }[position] || 'Field Tendencies';
  }
  // Helpers — read week info from live state
  function getAvailableWeeks() {
    return (state.availableWeeks && state.availableWeeks.length) ? state.availableWeeks : [];
  }
  function getCurrentWeek() {
    return state.currentWeek || 0;
  }

  // Real per-player game status for one fantasy week: 'upcoming' (kickoff
  // hasn't happened, score can only go up from here), 'live' (game is
  // being played right now, score can still change), or 'final' (game is
  // over, score is locked). This is what the matchup detail's score
  // indicator reads -- replacing a blinking dot that only ever meant
  // "this week is the current week and this slot has scored something,"
  // which couldn't tell a player whose game just ended apart from one who
  // hasn't kicked off yet, and read as an alert/error rather than status.
  //
  // A week strictly before/after the league's current leg is unambiguous
  // without needing any live data (history is locked, the future hasn't
  // happened). Only the current week needs state.liveNflGames -- which
  // stays empty for an archived season (see fetchAllRealData's Step 5), so
  // an archive's own final week correctly falls through to 'final' rather
  // than claiming to be live. A team with no matching game this week (bye,
  // or a fetch failure) also falls through to 'final': there's nothing left
  // to happen for that slot, so "locked" is the honest, safe default.
  function getPlayerGameStatus(player, week) {
    if (!player) return null;
    const cw = getCurrentWeek();
    if (week > cw) return 'upcoming';
    if (week < cw) return 'final';
    const game = state.liveNflGames?.find(g => g.home?.abbr === player.team || g.away?.abbr === player.team);
    if (!game) return 'final';
    if (game.status === 'pre') return 'upcoming';
    if (game.status === 'final') return 'final';
    return 'live';
  }

  function getRoster(id) { return state.rosters.find(r => r.roster_id === id); }
  function getOwner(rosterId) {
    const r = getRoster(rosterId);
    return r ? state.users.find(u => u.user_id === r.owner_id) : null;
  }
  function getTeamName(rosterId) {
    const u = getOwner(rosterId);
    return u?.metadata?.team_name || u?.display_name || `Team ${rosterId}`;
  }
  function getOwnerHandle(rosterId) { return getOwner(rosterId)?.display_name || 'unknown'; }
  function getInitials(name) {
    return name.split(' ').slice(0, 2).map(s => s[0]).join('').toUpperCase();
  }
  function getStandings() {
    return [...state.rosters]
      .map(r => {
        const wins = r.settings?.wins || 0;
        const losses = r.settings?.losses || 0;
        const ties = r.settings?.ties || 0;
        const pf = (r.settings?.fpts || 0) + (r.settings?.fpts_decimal || 0) / 100;
        const pa = (r.settings?.fpts_against || 0) + (r.settings?.fpts_against_decimal || 0) / 100;
        return {
          rosterId: r.roster_id, teamName: getTeamName(r.roster_id), owner: getOwnerHandle(r.roster_id),
          wins, losses, ties, pf, pa,
          streak: r.settings?.streak || 0, streakType: r.settings?.streakType || 'win'
        };
      })
      .sort((a, b) => b.wins - a.wins || b.pf - a.pf);
  }

  function getKpis(week) {
    const standings = getStandings();
    const totalPF = standings.reduce((s, t) => s + t.pf, 0);
    const leagueAvgPF = totalPF / standings.length;
    const seasonTopScorer = [...standings].sort((a, b) => b.pf - a.pf)[0];
    const matchups = state.weeklyMatchups[week] || [];
    const allWeekScores = matchups.flatMap(m => [{ rosterId: m.home, pts: m.homePts }, { rosterId: m.away, pts: m.awayPts }]);
    const wkTopScorer = [...allWeekScores].sort((a, b) => b.pts - a.pts)[0] || { rosterId: 1, pts: 0 };
    const wkAvg = allWeekScores.length ? allWeekScores.reduce((s, x) => s + x.pts, 0) / allWeekScores.length : 0;
    const wkMatchupsWithDiff = matchups.map(m => ({ ...m, diff: Math.abs(m.homePts - m.awayPts) }));
    const closest = [...wkMatchupsWithDiff].sort((a, b) => a.diff - b.diff)[0] || { home: 1, away: 2, diff: 0 };
    return { leagueAvgPF, seasonTopScorer, wkTopScorer, wkAvg, closest };
  }

  // ----- Sidebar -----
  function renderSidebar() {
    const container = document.getElementById('nfl-games');
    const weekTag = document.getElementById('sidebar-week-tag');
    const seasonOption = SEASON_OPTIONS.find(s => s.season === state.selectedSeason);

    // Archived season: no live NFL sidebar at all -- ESPN's scoreboard
    // endpoint always returns TODAY's games, so there's no honest way to
    // scope it to a past season (see fetchAllRealData's own comment on
    // this). Say so plainly rather than showing an empty "no games" state
    // that would read as a fetch failure instead of a deliberate scope
    // decision.
    if (seasonOption && !seasonOption.live) {
      if (weekTag) weekTag.textContent = 'N/A';
      const weekSel = document.getElementById('nfl-week-selector');
      if (weekSel) { weekSel.innerHTML = '<option>Not available</option>'; weekSel.disabled = true; }
      container.innerHTML = `
        <div class="sidebar-placeholder" style="padding: 20px 12px; text-align: center;">
          <div style="font-size: 24px; margin-bottom: 6px;">📁</div>
          <div style="font-weight: 600; color: var(--text-secondary); margin-bottom: 4px;">Archived season</div>
          <div style="font-size: 11px; color: var(--text-muted);">Live NFL scores aren't shown while viewing a completed-season archive.</div>
        </div>
      `;
      return;
    }

    // Live season, but its regular season hasn't started yet (still
    // preseason, or a real gap with no scheduled games at all) --
    // fetchNFLGames() used to silently substitute the most recently
    // COMPLETED season's playoffs here, which the season selector's own
    // header would then contradict (a real bug: "2026" header showing
    // "2025 Super Bowl"). Say so plainly instead, the same pattern as the
    // archived-season branch just above.
    if (state.nflWeekInfo?.noRegularSeasonYet) {
      if (weekTag) weekTag.textContent = 'Preseason';
      const weekSel = document.getElementById('nfl-week-selector');
      if (weekSel) { weekSel.innerHTML = '<option>Not available</option>'; weekSel.disabled = true; }
      container.innerHTML = `
        <div class="sidebar-placeholder" style="padding: 20px 12px; text-align: center;">
          <div style="font-size: 24px; margin-bottom: 6px;">🏈</div>
          <div style="font-weight: 600; color: var(--text-secondary); margin-bottom: 4px;">${state.selectedSeason} regular season hasn't started</div>
          <div style="font-size: 11px; color: var(--text-muted);">Preseason games aren't shown here — check back once real regular-season games kick off.</div>
        </div>
      `;
      return;
    }

    if (weekTag) {
      const label = state.nflWeekInfo?.label || `Wk ${getCurrentWeek()}`;
      weekTag.textContent = label;
    }

    // ----- Build the NFL week-filter dropdown -----
    // Anchored on the year ESPN reported back for the games we just loaded
    // (state.nflWeekInfo.year). If we don't have one yet (a total fetch
    // failure, not the noRegularSeasonYet case above -- that returns
    // early), fall back to the currently SELECTED season -- not an
    // independently-recomputed "most recent completed season," which
    // would silently reintroduce the same mixed-season problem the
    // selector exists to prevent.
    const sel = document.getElementById('nfl-week-selector');
    if (sel) {
      const wi = state.nflWeekInfo || {};
      let year = wi.year;
      if (!year) {
        if (state.selectedSeason) {
          year = state.selectedSeason;
        } else {
          const now = new Date();
          const seasonYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
          year = seasonYear - (now.getMonth() < 2 ? 1 : 0);
        }
      }
      // Regular season (weeks 1–18) + four postseason rounds.
      // ESPN postseason weeks: 1=WC, 2=Div, 3=Conf, 5=SB (week 4 is unused).
      const options = [];
      for (let w = 1; w <= 18; w++) {
        options.push({ st: 2, w, label: `${year} Week ${w}` });
      }
      options.push({ st: 3, w: 1, label: `${year} Wild Card` });
      options.push({ st: 3, w: 2, label: `${year} Divisional` });
      options.push({ st: 3, w: 3, label: `${year} Conf Champ` });
      options.push({ st: 3, w: 5, label: `${year} Super Bowl` });

      const currentKey = `${wi.seasontype || 2}-${wi.week || 1}`;
      sel.innerHTML = options.map(o => {
        const key = `${o.st}-${o.w}`;
        const isSel = key === currentKey ? ' selected' : '';
        return `<option value="${o.st}|${o.w}|${year}"${isSel}>${o.label}</option>`;
      }).join('');
      sel.disabled = !!state.nflFetchInFlight;

      // Re-bind to avoid stacking listeners across re-renders
      sel.onchange = async () => {
        const [st, w, y] = sel.value.split('|').map(Number);
        state.nflFetchInFlight = true;
        sel.disabled = true;
        try {
          const result = await fetchNFLGames({ seasontype: st, week: w, year: y });
          state.nflGames = result.games || [];
          state.nflWeekInfo = result.weekInfo || state.nflWeekInfo;
        } catch (e) {
          console.warn('NFL week switch failed:', e);
        } finally {
          state.nflFetchInFlight = false;
          renderSidebar();
        }
      };
    }

    if (!state.nflGames || state.nflGames.length === 0) {
      container.innerHTML = `
        <div class="sidebar-placeholder" style="padding: 20px 12px; text-align: center;">
          <div style="font-size: 24px; margin-bottom: 6px;">🏈</div>
          <div style="font-weight: 600; color: var(--text-secondary); margin-bottom: 4px;">No games for this week</div>
          <div style="font-size: 11px; color: var(--text-muted);">Try a different week from the dropdown above</div>
        </div>
      `;
      return;
    }

    container.innerHTML = state.nflGames.map(g => {
      const awayWinning = g.awayScore > g.homeScore;
      const homeWinning = g.homeScore > g.awayScore;
      const isFinal = g.status === 'final';
      const isPre = g.status === 'pre';
      const w = g.weather || { icon: '🌡️', temp: 60, condition: '—', wind: 0, windDir: '–', humidity: 50, precip: 0, isDome: false };
      return `
        <div class="nfl-game" data-game-id="${g.id}">
          <div class="nfl-game-time">
            <span>${g.time}</span>
            <span class="game-status-pill ${g.status}">${isPre ? 'Pre' : (isFinal ? 'Final' : g.clock)}</span>
          </div>
          <div class="nfl-team-row">
            <span class="nfl-team-name ${!isPre && homeWinning ? 'loser' : ''}">${g.away.abbr}</span>
            <span class="nfl-team-score ${!isPre && homeWinning ? 'loser' : ''}">${isPre ? '–' : g.awayScore}</span>
          </div>
          <div class="nfl-team-row">
            <span class="nfl-team-name ${!isPre && awayWinning ? 'loser' : ''}">${g.home.abbr}</span>
            <span class="nfl-team-score ${!isPre && awayWinning ? 'loser' : ''}">${isPre ? '–' : g.homeScore}</span>
          </div>
          <div class="nfl-weather-strip">
            <span>${w.icon} ${w.isDome ? 'Indoor' : `${w.temp}° · ${w.condition}`}</span>${!w.isDome && w.wind > 0 ? `<span class="${w.alert ? 'alert' : ''}">💨 ${w.wind}mph</span>` : ''}
          </div>
        </div>
      `;
    }).join('');
    container.querySelectorAll('.nfl-game').forEach(el => {
      el.addEventListener('click', () => {
        state.activeNflGameId = el.dataset.gameId;
        state.activeGcTab = 'stats';
        renderView();
      });
    });
  }

  // ----- Main render router -----
  function renderView() {
    // Preserve focus + cursor/selection position across the rebuild below.
    // The search boxes (Players/Comparison/Draft Prep) already avoid
    // calling this on every keystroke -- see renderTbody/
    // renderAddPlayersTable/renderPrepRows -- but a few lazy background
    // fetches (e.g. Player Comparison's per-week stats, which feed its
    // shelf cards and charts, not just its search table) still trigger a
    // full renderView() when they resolve. Without this, one of those
    // resolving mid-keystroke would recreate the focused <input> and drop
    // focus outright -- or, if refocused naively, land the caret back at
    // index 0, the exact bug those search boxes used to have.
    const main = document.getElementById('main-content');
    const active = document.activeElement;
    const isRestorableInput = active && main.contains(active) && active.id &&
      (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
    const focusId = isRestorableInput ? active.id : null;
    const selStart = isRestorableInput ? active.selectionStart : null;
    const selEnd = isRestorableInput ? active.selectionEnd : null;

    destroyCharts();
    if (state.activeNflGameId) renderGamecast(main);
    else if (state.activeMatchupId !== null) renderMatchupDetail(main);
    else if (state.activeTeamId !== null) renderTeamDetail(main);
    else if (state.activePlayerId !== null) renderPlayerDetail(main);
    else if (state.currentView === 'dashboard') renderDashboard(main);
    else if (state.currentView === 'matchups') renderMatchupsView(main);
    else if (state.currentView === 'teams') renderTeamsView(main);
    else if (state.currentView === 'players') renderPlayersView(main);
    else if (state.currentView === 'comparison') renderComparisonView(main);
    else if (state.currentView === 'draft') renderDraftView(main);
    else if (state.currentView === 'tendencies') renderTendenciesView(main);
    else if (state.currentView === 'injuries') renderInjuryView(main);
    else if (state.currentView === 'practice') renderPracticeReportView(main);

    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) {
        el.focus();
        if (typeof el.setSelectionRange === 'function') el.setSelectionRange(selStart, selEnd);
      }
    }
  }

    requestAnimationFrame(() => {

  }

      if (i < weeks.length - 1) { state.selectedWeek = weeks[i + 1]; renderView(); }
    });
    main.querySelectorAll('.matchup-overview').forEach(el => {

      });

  // ----- MATCHUP DETAIL -----
  function renderMatchupDetail(main) {
    const m = state.weeklyMatchups[state.selectedWeek].find(x => x.matchup_id === state.activeMatchupId);
    if (!m) { state.activeMatchupId = null; return renderView(); }

    // Kick off player stats fetch if we don't have this week cached yet.
    // The render below uses whatever's in the cache (possibly empty on first
    // load), and re-renders once the fetch completes.
    const season = state.league?.season;
    const week = state.selectedWeek;
    const weekStats = state.statsByWeek[week] || null;
    if (season && !weekStats && !state.statsFetching.has(week)) {
      fetchWeekStats(season, week).then(() => renderView());
    }

    // Each lineup is { starters: [{slot, player, weekPts}], bench: [{...player, weekPts}] }
    // with real per-player points from Sleeper — no estimation.
    const awayLineup = buildLineupForRoster(m.away, m);
    const homeLineup = buildLineupForRoster(m.home, m);
    const homeRoster = getRoster(m.home);
    const awayRoster = getRoster(m.away);
    const homeWin = m.homePts > m.awayPts;
    const awayWin = m.awayPts > m.homePts;
    const slots = getStartingSlots();
    const margin = Math.abs(m.homePts - m.awayPts);

    // Compute each team's recent form so we can show a superlative pill.
    const awayForm = computeTeamForm(m.away, week);
    const homeForm = computeTeamForm(m.home, week);
    const awaySup = pickTeamSuperlative(awayForm);
    const homeSup = pickTeamSuperlative(homeForm);

    // Margin label: blowout / nail biter / regular
    let marginSub = '', marginClass = '';
    if (margin >= 50)      { marginSub = '💥 Blowout';   marginClass = 'alert'; }
    else if (margin < 5)   { marginSub = '😬 Nail Biter'; marginClass = 'tight'; }
    else if (margin < 15)  { marginSub = 'Close game'; }
    else                   { marginSub = 'Comfortable win'; }

    // Headline performers across this matchup.
    const allStarters = [...awayLineup.starters, ...homeLineup.starters].filter(s => s.player);
    const topPerformer = allStarters.length
      ? [...allStarters].sort((a, b) => b.weekPts - a.weekPts)[0]
      : null;
    const allBench = [...awayLineup.bench, ...homeLineup.bench];
    const benchHigh = allBench.length
      ? [...allBench].sort((a, b) => b.weekPts - a.weekPts)[0]
      : null;

    // Maps getPlayerGameStatus's semantic status to the existing
    // game-status-pill classes/copy the sidebar's NFL scoreboard already
    // uses (see renderSidebar's nfl-game cards) -- same visual language,
    // not a new one, just applied per-player instead of per-game.
    const GAME_STATUS_PILL = {
      upcoming: { cls: 'pre', label: 'Not Started' },
      live: { cls: 'live', label: 'Live' },
      final: { cls: 'final', label: 'Final' },
    };
    function renderPlayerCell(slot, isRight) {
      const p = slot.player;
      if (!p) return `<div class="md-player ${isRight ? 'right' : ''}"><div class="md-player-info"><div class="md-player-name">--</div></div></div>`;
      const injHtml = p.injuryStatus ? `<span class="md-player-injury ${p.injuryStatus}">${p.injuryStatus}</span>` : '';
      const statLine = getStatLine(p, weekStats);
      const isDnp = statLine === 'DNP';
      const gameStatus = GAME_STATUS_PILL[getPlayerGameStatus(p, state.selectedWeek)];
      const gameStatusPill = gameStatus ? `<span class="game-status-pill ${gameStatus.cls}">${gameStatus.label}</span>` : '';
      return `
        <div class="md-player ${isRight ? 'right' : ''}" data-player-id="${p.player_id}">
          ${playerAvatarHtml(p)}
          <div class="md-player-info">
            <div class="md-player-name">${p.name}${injHtml}</div>
            <div class="md-player-meta"><span class="pos-pill pos-${p.position}">${p.position}</span>${p.team || ''}</div>
            ${statLine ? `<div class="md-player-statline ${isDnp ? 'dnp' : ''}">${statLine}</div>` : ''}
          </div>
          <div class="md-player-score">
            <div class="md-player-pts">${slot.weekPts.toFixed(1)}</div>
            ${gameStatusPill}
          </div>
        </div>
      `;
    }

    let benchHtml = '';
    if (state.showBench) {
      const maxBench = Math.max(awayLineup.bench.length, homeLineup.bench.length);
      const benchSlots = Array.from({ length: maxBench }, (_, i) => ({
        a: awayLineup.bench[i], h: homeLineup.bench[i]
      }));
      const renderBenchCell = (p, isRight) => {
        if (!p) return `<div class="md-player ${isRight ? 'right' : ''}"></div>`;
        const inj = p.injuryStatus ? `<span class="md-player-injury ${p.injuryStatus}">${p.injuryStatus}</span>` : '';
        const statLine = getStatLine(p, weekStats);

        return `<div class="md-player ${isRight ? 'right' : ''}" data-player-id="${p.player_id}">

    main.innerHTML = `

            <div class="md-team-score ${homeWin ? 'losing' : ''}">${m.awayPts.toFixed(1)}</div>
            ${awaySup ? `<div class="md-team-superlative ${awaySup.className}">${awaySup.label}</div>` : ''}

          <div class="md-team-block">

              ${homeWin ? '<span class="winner-badge" title="Winner">🏆</span>' : ''}
              <span class="md-team-name ${awayWin ? 'losing' : ''}">${getTeamName(m.home)}</span>
            </div>
            <div class="md-team-owner">@${getOwnerHandle(m.home)} · ${homeForm.wins}-${homeForm.losses}${homeForm.ties ? '-' + homeForm.ties : ''}</div>
            <div class="md-team-score ${awayWin ? 'losing' : ''}">${m.homePts.toFixed(1)}</div>

  // ----- PLAYERS VIEW -----
  function renderPlayersView(main) {
    const f = state.playerFilters;
    const currentWeek = state.currentWeek || 0;
    const playerWeek = state.playerWeek || currentWeek;
    const season = state.league?.season;
    const availableWeeks = getAvailableWeeks();

    // Lazy-fetch projections for the selected week. Repaints only the table
    // body (renderTbody, defined below) rather than the whole view once
    // data arrives -- a full renderView() here would recreate the search
    // input out from under anyone typing into it the moment this resolves,
    // the same destroy-the-focused-input problem renderTbody exists to
    // avoid. Guarded so a slow, late-resolving fetch for a week/view the
    // user has since navigated away from doesn't paint stale data over
    // whatever's now on screen -- state.playerWeek may have changed, or
    // main-content may not even be the Players view anymore.
    if (season && playerWeek) {
      if (!state.projectionsByWeek?.[playerWeek] && !state.projectionsFetching?.has(playerWeek)) {
        fetchWeekProjections(season, playerWeek).then(() => {
          if (state.currentView === 'players' && (state.playerWeek || state.currentWeek || 0) === playerWeek) {
            renderTbody();
          }
        });
      }
    }

    // FP Over Exp reads xfp.fp_over_expected, which describes meta.xfp_season
    // -- not necessarily the displayed season. A pre-draft/off-season weekly
    // export falls back to the prior completed season (same reason the
    // Dashboard's xFP Regression panel shows real numbers before this
    // season's games exist; see assemble_player_advanced_stats's docstring
    // in src/export.py). Disambiguate the header/tooltip rather than let it
    // silently read as "this season" when it isn't; archived seasons always
    // match (xfp_season == season there), so this is a no-op for them.
    const xfpSeason = state.advancedStats?.meta?.xfp_season;
    const xfpSeasonMismatch = xfpSeason != null && season != null && Number(xfpSeason) !== Number(season);
    const fpOverExpLabel = xfpSeasonMismatch ? `FP Over Exp (${xfpSeason})` : 'FP Over Exp';
    const fpOverExpTooltip = xfpSeasonMismatch
      ? `${xfpSeason} season points scored above what this player's opportunities alone implied (xFP) — a luck indicator, not a projection. Showing ${xfpSeason} because ${season} has no games played yet. Weaker luck signal for QB than for RB/WR/TE (hover a QB's own value for why).`
      : `Season points scored above what this player's opportunities alone implied (xFP) — a luck indicator, not a projection. Weaker luck signal for QB than for RB/WR/TE (hover a QB's own value for why).`;

    const teamOptions = ['ALL', ...NFL_TEAMS].sort();
    const totalRostered = state.players.filter(p => p.ownerRosterId).length;
    const totalFA = state.players.filter(p => !p.ownerRosterId).length;
    const totalInjured = state.players.filter(p => p.injuryStatus).length;
    const posCounts = {};
    state.players.forEach(p => { if (p.position) posCounts[p.position] = (posCounts[p.position] || 0) + 1; });
    const topPos = Object.entries(posCounts).sort((a, b) => b[1] - a[1])[0];

    // Helper for the inline avatar in each table row
    function rowAvatar(p) {

      const teamLogo = `https://a.espncdn.com/i/teamlogos/nfl/500/${(p.team || '').toLowerCase()}.png`;
      if (p.position === 'DEF') {
        return `<div class="player-row-avatar"><img src="${teamLogo}" onerror="this.style.display='none'" alt=""></div>`;

        <img src="${headshot}"
          onerror="this.onerror=null; this.src='${teamLogo}'; this.onerror=function(){this.style.display='none'; this.parentElement.textContent='${initials}';}"
          alt="${p.name}">
      </div>`;
    }

    main.innerHTML = `
      <div class="page-header-row">

      <div class="panel" style="padding: 0; overflow: hidden;">

    // Recomputes the filtered/sorted list and repaints only the table body,
    // subtitle count, and footer -- never the search input or filter
    // controls. This is what the search box's debounced 'input' listener
    // calls instead of a full renderView(): rebuilding the whole view (and
    // therefore recreating the <input> element) on every keystroke was the
    // cause of a real bug where typing came out reversed -- the freshly
    // created input got focus() restored but not cursor position, so the
    // caret always landed back at index 0.
    function renderTbody() {
      // Read fresh every call (not captured once at the top of
      // renderPlayersView) so that when the lazy projections fetch above
      // resolves and calls renderTbody() directly instead of a full
      // renderView(), the newly-cached data actually shows up.
      const projData = state.projectionsByWeek?.[playerWeek] || {};

      // Filter list — built off real Sleeper data only
      let filtered = [...state.players];
      if (f.search) filtered = filtered.filter(p => p.name.toLowerCase().includes(f.search.toLowerCase()));
      if (f.position !== 'ALL') filtered = filtered.filter(p => p.position === f.position);
      if (f.team !== 'ALL') filtered = filtered.filter(p => p.team === f.team);
      if (f.owner === 'FA') filtered = filtered.filter(p => p.ownerRosterId === null);
      else if (f.owner === 'ROSTERED') filtered = filtered.filter(p => p.ownerRosterId !== null);
      else if (f.owner !== 'ALL') filtered = filtered.filter(p => p.ownerRosterId === parseInt(f.owner));
      if (f.injury !== 'ALL') {
        if (f.injury === 'Healthy') filtered = filtered.filter(p => !p.injuryStatus);
        else filtered = filtered.filter(p => p.injuryStatus === f.injury);
      }

      // Attach projected points to each filtered player for sorting/display.
      // resolvePts applies the league's custom scoring rules to the raw stat
      // line embedded in Sleeper's projection, so this respects bonuses, TE
      // premium, 4-vs-6 pt pass TDs, etc.
      filtered.forEach(p => {
        const proj = projData[p.player_id];
        p.sleeperProj = resolvePts(proj, state.league, p.position);
        const myProj = getMyProj(p.player_id, season, playerWeek);
        p.myProj = myProj?.point ?? null;
        p.myProjFloor = myProj?.floor ?? null;
        p.myProjCeiling = myProj?.ceiling ?? null;

        // Trend/FP Over Exp/Volatility are SEASON-level signals from the
        // export, not tied to the selected proj week -- read unconditionally,
        // same as the Dashboard's Usage Trending/xFP Regression panels
        // (see their own comments for why no getMyProj-style week gate
        // applies here). fp_over_expected/xfp_vol now populate for QB too
        // (src/usage.py::add_xfp_features gained a QB dropback + designed-
        // rush bucket model -- see PROJECT_CONTEXT.md's QB xFP findings);
        // no position check is needed here either way -- null only means
        // "not enough bucket history yet", not "wrong position".
        const advanced = getAdvancedPlayer(p.player_id);
        const trendHeadline = getPlayerTrendHeadline(advanced?.trend);
        p.trendSignal = trendHeadline?.signal ?? null;
        p.trendDirection = trendHeadline?.direction ?? null;
        p.trendFeature = trendHeadline?.feature ?? null;
        p.fpOverExp = advanced?.xfp?.fp_over_expected ?? null;
        p.volatility = advanced?.usage?.xfp_vol ?? null;

        // Matchup IS tied to the selected proj week (opponent changes every
        // week), unlike the season-level signals just above -- getMatchup
        // returns null outright unless playerWeek matches the export's own
        // meta.week, same gating getMyProj already applies for p.myProj.
        const matchup = getMatchup(p.player_id, season, playerWeek);
        p.matchupRank = matchup?.rank ?? null;
        p.matchupPoolSize = matchup?.pool_size ?? null;
      });

      // Sort
      filtered.sort((a, b) => {
        let valA = a[f.sortBy], valB = b[f.sortBy];
        // Nulls sort to the bottom regardless of direction
        if (valA == null && valB == null) return 0;
        if (valA == null) return 1;
        if (valB == null) return -1;
        if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
        if (f.sortDir === 'desc') return valA > valB ? -1 : valA < valB ? 1 : 0;
        return valA < valB ? -1 : valA > valB ? 1 : 0;
      });

      document.getElementById('players-subtitle').textContent =
        `${filtered.length} of ${state.players.length} players · Click any row for details`;

      document.getElementById('players-tbody').innerHTML = filtered.slice(0, 100).map(p => {
        const isFA = !p.ownerRosterId;
        const sleeperProjCell = p.sleeperProj != null
          ? `<span style="font-weight: 700;">${p.sleeperProj.toFixed(1)}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
        const myProjCell = p.myProj != null
          ? `<span style="font-weight: 700; color: var(--accent);">${p.myProj.toFixed(1)}</span>` +
            (p.myProjFloor != null && p.myProjCeiling != null
              ? `<div style="font-size: 10px; color: var(--text-muted);">${p.myProjFloor.toFixed(1)}–${p.myProjCeiling.toFixed(1)}</div>`
              : '')
          : '<span style="color: var(--text-muted); font-size: 11px;" title="Custom model not loaded">—</span>';
        const trendCell = p.trendDirection
          ? `<span style="color: ${p.trendDirection === 'rising' ? 'var(--success)' : 'var(--danger)'}; font-weight: 600; font-size: 12px; white-space: nowrap;">${p.trendDirection === 'rising' ? '↑' : '↓'} ${TREND_FEATURE_LABELS[p.trendFeature]}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
        // QB's fp_over_expected strips out meaningfully less luck than

        // correlation -- see PROJECT_CONTEXT.md's QB xFP findings), so
        // a QB cell gets its own title rather than sharing the column
        // header's tooltip -- a big QB number shouldn't read with the
        // same "this is mostly luck" confidence as the same number
        // for a receiver.
        const fpOverExpCellTitle = p.position === 'QB'
          ? 'For QB, this reflects real accuracy/decision-making more than luck -- a large number here is less certainly luck than the same number for RB/WR/TE.'
          : '';
        const fpOverExpCell = p.fpOverExp != null
          ? `<span style="font-weight: 700; color: ${p.fpOverExp > 0 ? 'var(--success)' : 'var(--danger)'};"${fpOverExpCellTitle ? ` title="${fpOverExpCellTitle}"` : ''}>${p.fpOverExp > 0 ? '+' : ''}${p.fpOverExp.toFixed(1)}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
        const volatilityCell = p.volatility != null
          ? `<span style="font-weight: 700;">${p.volatility.toFixed(1)}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
        return `
          <tr data-player-id="${p.player_id}">

              <div class="player-row-name">

            <td><span class="pos-badge ${p.position}">${p.position}</span></td>
            <td>${p.team || 'FA'}</td>
            <td>${matchupIndicatorHtml(p.player_id, season, playerWeek)}</td>
            <td style="font-size: 12px;">${isFA ? '<span class="free-agent-pill">Free Agent</span>' : getTeamName(p.ownerRosterId)}</td>
            <td class="right">${sleeperProjCell}</td>
            <td class="right">${myProjCell}</td>

            <td>${p.injuryStatus ? `<span class="injury-badge ${p.injuryStatus}">${p.injuryStatus}</span>` : '<span style="color: var(--success); font-size: 11px; font-weight: 600;">●  Healthy</span>'}</td>
          </tr>

      }).join('');

      document.getElementById('players-table-footer').innerHTML = filtered.length > 100
        ? `<div style="padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border);">Showing first 100 of ${filtered.length} players · refine filters to see more</div>`
        : '';

      main.querySelectorAll('tr[data-player-id]').forEach(el => {
        el.addEventListener('click', () => {
          state.activePlayerId = el.dataset.playerId;

    }

    renderTbody();

    let searchDebounce = null;
    document.getElementById('search-input').addEventListener('input', (e) => {
      state.playerFilters.search = e.target.value;
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(renderTbody, 150);
    });
    document.getElementById('players-week-select')?.addEventListener('change', (e) => {
      state.playerWeek = parseInt(e.target.value);
      renderView();
    });
    document.getElementById('filter-position').addEventListener('change', (e) => { state.playerFilters.position = e.target.value; renderTbody(); });
    document.getElementById('filter-team').addEventListener('change', (e) => { state.playerFilters.team = e.target.value; renderTbody(); });
    document.getElementById('filter-owner').addEventListener('change', (e) => { state.playerFilters.owner = e.target.value; renderTbody(); });
    document.getElementById('filter-injury').addEventListener('change', (e) => { state.playerFilters.injury = e.target.value; renderTbody(); });
    main.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.sort;
        if (state.playerFilters.sortBy === col) {
          state.playerFilters.sortDir = state.playerFilters.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.playerFilters.sortBy = col;
          state.playerFilters.sortDir = 'desc';
        }
        renderView();
      });
    });
  }

  // ----- PLAYER DETAIL -----
  function renderPlayerDetail(main) {
    const p = state.players.find(x => x.player_id === state.activePlayerId);
    if (!p) { state.activePlayerId = null; return renderView(); }

    const owner = p.ownerRosterId ? getTeamName(p.ownerRosterId) : 'Free Agent';
    const ownerHandle = p.ownerRosterId ? getOwnerHandle(p.ownerRosterId) : '';
    const isFA = !p.ownerRosterId;
    const currentWeek = state.currentWeek || 0;
    const season = state.league?.season;
    const availableWeeks = getAvailableWeeks();

    // ---- Lazy fetch: stats AND projections for every available week.
    // The view re-renders once each fetch resolves so the game log and
    // chart populate incrementally as data arrives.
    if (season) {
      availableWeeks.forEach(w => {
        if (!state.statsByWeek[w] && !state.statsFetching.has(w)) {
          fetchWeekStats(season, w).then(() => renderView());
        }
        if (!state.projectionsByWeek?.[w] && !state.projectionsFetching?.has(w)) {
          fetchWeekProjections(season, w).then(() => renderView());
        }
      });
    }

    // ---- Compute real per-week fantasy points + Sleeper proj + position avg
    // All scoring uses resolvePts which applies the league's custom scoring
    // rules to each raw stat line.
    // Compute how many "fantasy-startable" slots exist at each position
    // across the entire league. We use this to define what "positional
    // average" means below: rather than averaging every player who scored
    // anything (which is noisy — backups with garbage-time touches drag
    // the avg down), we average only the top-N scorers at the position
    // for that week, where N matches what gets started league-wide.
    //
    // Example: in a 14-team league starting 1 QB each, "QB1 average" =
    // mean of the top 14 QB scores for the week. WR/RB also account for
    // FLEX slots since most FLEX usage goes to WR/RB.
    function positionStarterCount(position) {
      const teams = state.rosters?.length || 12;
      const slots = state.league?.roster_positions || [];
      let directSlots = 0;
      let flexShare = 0;
      let superFlexShare = 0;
      slots.forEach(slot => {
        if (slot === position) directSlots++;
        // FLEX slots typically rotate RB/WR/TE — split the FLEX count by
        // historical usage: most FLEX starts are WR (~50%), then RB (~35%),
        // then TE (~15%). This is an approximation but reasonable.
        if (slot === 'FLEX' || slot === 'WRRB_FLEX' || slot === 'REC_FLEX') {
          if (position === 'WR') flexShare += 0.5;
          else if (position === 'RB') flexShare += 0.35;
          else if (position === 'TE') flexShare += 0.15;
        }
        if (slot === 'SUPER_FLEX' && position === 'QB') superFlexShare += 1;
      });
      const raw = directSlots + flexShare + superFlexShare;

      // If we couldn't derive from roster_positions, fall back to standard
      // fantasy defaults scaled to team count.
      if (raw === 0) {
        const defaults = { QB: 1, RB: 2.5, WR: 3, TE: 1.2, K: 1, DEF: 1 };
        const fallback = defaults[position] || 1;
        return {
          count: Math.max(1, Math.round(fallback * teams)),
          breakdown: `${fallback} × ${teams} teams (default — no roster_positions)`,
        };
      }

      const count = Math.max(1, Math.round(raw * teams));
      // Build a readable breakdown like "(2 + 0.5 flex) × 14 teams = 35"
      const parts = [];
      if (directSlots > 0) parts.push(`${directSlots} ${position}`);
      if (flexShare > 0) parts.push(`${flexShare} flex share`);
      if (superFlexShare > 0) parts.push(`${superFlexShare} super-flex`);
      const breakdown = `(${parts.join(' + ')}) × ${teams} teams ≈ ${count}`;
      return { count, breakdown };
    }
    const posStarterInfo = positionStarterCount(p.position);
    const posStartersN = posStarterInfo.count;
    const posStartersBreakdown = posStarterInfo.breakdown;
    const weeklyXfp = getWeeklyXfp(p.player_id, season);

    const weeklyData = availableWeeks.map(w => {
      const weekStats = state.statsByWeek[w];
      const weekProj = state.projectionsByWeek?.[w] || {};
      const sleeperProj = resolvePts(weekProj[p.player_id], state.league, p.position);
      const xfp = weeklyXfp[String(w)] ?? null;

      // Positional average for week w — mean of the top-N scorers at this
      // position, where N = league-wide starter count for the position.
      // This gives a "QB1 average" / "RB1 average" baseline that fantasy
      // managers naturally think in terms of.
      let posAvg = null;
      if (weekStats) {
        const posPts = [];
        Object.keys(weekStats).forEach(pid => {
          const player = state.playersById?.[pid];
          if (!player || player.position !== p.position) return;
          const pts = resolvePts(weekStats[pid], state.league, player.position);
          if (pts != null) posPts.push(pts);
        });
        if (posPts.length > 0) {
          // Sort descending and take top-N
          posPts.sort((a, b) => b - a);
          const topN = posPts.slice(0, posStartersN);
          posAvg = topN.reduce((s, v) => s + v, 0) / topN.length;
        }
      }

      if (!weekStats) return { week: w, pts: null, line: '', sleeperProj, posAvg, xfp, loaded: false };
      const ps = weekStats[p.player_id];
      if (!ps) return { week: w, pts: 0, line: 'DNP', sleeperProj, posAvg, xfp, loaded: true };
      const pts = resolvePts(ps, state.league, p.position) ?? 0;
      const line = getStatLine(p, weekStats);
      return { week: w, pts, line, sleeperProj, posAvg, xfp, loaded: true };
    });
    const weeksWithPts = weeklyData.filter(w => w.loaded && w.pts != null);
    const totalPts = weeksWithPts.reduce((s, w) => s + w.pts, 0);
    const gamesPlayed = weeksWithPts.filter(w => w.line !== 'DNP').length;
    const avgPts = gamesPlayed > 0 ? totalPts / gamesPlayed : 0;
    const bestWeek = weeksWithPts.reduce((b, w) => (b == null || w.pts > b.pts) ? w : b, null);
    const sleeperProjThisWeek = resolvePts(
      state.projectionsByWeek?.[currentWeek]?.[p.player_id],
      state.league, p.position
    );

    // Position rank by total points (for players we've computed)
    const sortedByPos = state.players
      .filter(x => x.position === p.position)
      .map(x => {
        const xPts = availableWeeks.reduce((s, w) => {
          const ws = state.statsByWeek[w];
          return s + (resolvePts(ws?.[x.player_id], state.league, x.position) ?? 0);
        }, 0);
        return { player_id: x.player_id, pts: xPts };
      })
      .sort((a, b) => b.pts - a.pts);
    const posRank = sortedByPos.findIndex(x => x.player_id === p.player_id) + 1;

    // Headshot
    const headshot = `https://sleepercdn.com/content/nfl/players/thumb/${p.player_id}.jpg`;
    const teamLogo = `https://a.espncdn.com/i/teamlogos/nfl/500/${(p.team || '').toLowerCase()}.png`;
    const heroAvatar = p.position === 'DEF'
      ? `<div class="pd-avatar"><img src="${teamLogo}" onerror="this.style.display='none'" alt=""></div>`
      : `<div class="pd-avatar">
          <img src="${headshot}"

    // Position Profile radar (Phase 4) -- only present when this player's

  // ----- PLAYER COMPARISON VIEW -----
  function renderComparisonView(main) {
    const f = state.compareFilters;
    const compared = state.compareIds.map(id => state.players.find(p => p.player_id === id)).filter(Boolean);
    const currentWeek = state.currentWeek || 0;
    const compareWeek = state.compareWeek || currentWeek;
    const season = state.league?.season;
    const availableWeeks = getAvailableWeeks();

    // ---- Lazy fetch: stats for every available week and projection for the
    // chosen comparison week. View re-renders when each fetch resolves.
    if (season) {
      availableWeeks.forEach(w => {
        if (!state.statsByWeek[w] && !state.statsFetching.has(w)) {
          fetchWeekStats(season, w).then(() => renderView());
        }
      });
      if (compareWeek && !state.projectionsByWeek?.[compareWeek] && !state.projectionsFetching?.has(compareWeek)) {
        fetchWeekProjections(season, compareWeek).then(() => renderView());
      }
    }

    // ---- Per-player computed stats from the real cache ----
    // resolvePts applies the league's full custom scoring rules to every
    // stat line, so totals/avg/best/worst all reflect the actual league.
    function computePlayerStats(p) {
      const weekly = availableWeeks.map(w => {
        const ws = state.statsByWeek[w];
        if (!ws) return { week: w, pts: null, loaded: false };
        const ps = ws[p.player_id];
        if (!ps) return { week: w, pts: 0, loaded: true, dnp: true };
        return { week: w, pts: resolvePts(ps, state.league, p.position) ?? 0, loaded: true, dnp: false };
      });
      const played = weekly.filter(w => w.loaded && !w.dnp);
      const total = played.reduce((s, w) => s + w.pts, 0);
      const avg = played.length ? total / played.length : 0;
      const best = played.reduce((b, w) => (b == null || w.pts > b.pts) ? w : b, null);
      const worst = played.reduce((b, w) => (b == null || w.pts < b.pts) ? w : b, null);
      const sleeperProj = resolvePts(
        state.projectionsByWeek?.[compareWeek]?.[p.player_id],
        state.league, p.position
      );
      const myProjData = getMyProj(p.player_id, season, compareWeek);
      const myProj = myProjData?.point ?? null;
      const myProjFloor = myProjData?.floor ?? null;
      const myProjCeiling = myProjData?.ceiling ?? null;
      return { weekly, total, avg, best, worst, sleeperProj, myProj, myProjFloor, myProjCeiling, gamesPlayed: played.length };
    }
    const playerStats = {};
    compared.forEach(p => { playerStats[p.player_id] = computePlayerStats(p); });

    const teamOptions = ['ALL', ...NFL_TEAMS].sort();
    const positions = [...new Set(compared.map(p => p.position))];
    const mixedPositions = positions.length > 1;
    const colors = ['#0891b2', '#dc2626', '#059669', '#7c3aed'];

    // ---- Radar overlay groups: one radar PER POSITION, never merged
    // across positions. RADAR_METRICS (src/export.py) defines a completely
    // different 6-axis set per position -- a QB's axes are Pass Volume/Rush
    // Volume/Yards per Carry/Scramble Rate/EPA per Dropback/CPOE, nothing
    // like a WR's Target Share/Air Yards Share/aDOT/Catch Rate/YAC/RZ Target
    // Share. Overlaying two positions on one radar would plot two unrelated
    // metrics at the same vertex under one shared label -- not an
    // approximation, just wrong. Same-position players share the identical
    // axis set (by construction: RADAR_METRICS is keyed by position, and
    // every compared player's radar comes from the one currently-loaded
    // export), so within a group the overlay is real and comparable.
    // Each player keeps the SAME color index used by the shelf cards and
    // the weekly line chart below (colors[i], not re-indexed per group).
    const comparedWithRadar = compared.map((p, i) => ({ p, color: colors[i], radar: getAdvancedPlayer(p.player_id)?.radar }));
    const radarGroups = positions.map(position => {
      const members = comparedWithRadar.filter(m => m.p.position === position);
      return {
        position,
        eligible: members.filter(m => m.radar?.eligible),
        ineligible: members.filter(m => !m.radar?.eligible),
      };
    });

    function radarGroupHtml(group) {
      const { position, eligible, ineligible } = group;
      const ineligibleNote = ineligible.length ? `
        <div class="pd-placeholder-text" style="text-align: left; max-width: none; margin-top: 4px;">
          ${ineligible.map(({ p, radar }) => radar
            ? `${p.name}: only ${radar.games_played} of ${radar.min_games} games played this season -- excluded, not enough of a sample yet.`
            : `${p.name}: no advanced data available for this season -- excluded.`
          ).join(' ')}
        </div>
      ` : '';

      if (eligible.length === 0) {
        return `
          <div style="margin-bottom: 16px;">
            <div class="panel-note" style="margin-bottom: 6px; font-weight: 600;">${position}</div>
            <div class="pd-placeholder" style="padding: 14px;">
              <div class="pd-placeholder-icon">📈</div>
              <div class="pd-placeholder-title">No eligible ${position} to profile</div>
              ${ineligibleNote}
            </div>
          </div>
        `;
      }

      const poolSize = eligible[0].radar.pool_size;
      return `
        <div style="margin-bottom: 18px;">
          <div class="panel-note" style="margin-bottom: 6px; font-weight: 600;">
            ${position} · pool: ${poolSize} startable ${position}s
          </div>
          <div class="radar-wrapper" style="height: 280px;">
            <canvas id="cmp-radar-${position}"></canvas>
          </div>
          ${ineligibleNote}
        </div>
      `;
    }

    // ---- Start-over-replacement: the one comparison that genuinely needs
    // simulation, not just point estimates -- if two players share a real
    // game this week their outcomes are correlated (see
    // startOverReplacementProb above), which a naive "whose projection is
    // higher" comparison misses entirely. Computed HERE, on demand, for
    // every pair among the compared players (not precomputed export-side:
    // see build_player_simulation_metrics's docstring in src/export.py for
    // why that's infeasible for every possible pair among ~465 exported
    // players -- this view already has "two-or-more players selected,"
    // which is exactly the natural place to ask "who do I actually start."
    function sorPairHtml(a, b, colorA, colorB) {
      const mcA = getMonteCarlo(a.player_id, season, compareWeek);
      const mcB = getMonteCarlo(b.player_id, season, compareWeek);
      if (!mcA || !mcB) {
        const missingNames = [!mcA ? a.name : null, !mcB ? b.name : null].filter(Boolean).join(' and ');
        return `
          <div style="padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-muted);">
            <strong>${a.name}</strong> vs <strong>${b.name}</strong>: no Monte Carlo data for ${missingNames} for Wk ${compareWeek}
            (archived seasons, or a position outside this model's QB/RB/WR/TE coverage, don't carry it).
          </div>
        `;
      }
      const result = cachedStartOverReplacement(a.player_id, mcA, b.player_id, mcB, season, compareWeek);
      const sameGame = mcA.game_id != null && mcA.game_id === mcB.game_id;
      const pct = (result.a_over_b_prob * 100).toFixed(0);
      return `
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border);">
          <div style="font-size: 13px;">
            <span style="font-weight: 700; color: ${colorA};">${a.name}</span> over
            <span style="font-weight: 700; color: ${colorB};">${b.name}</span>
            ${sameGame ? '<div style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">Same real game -- correlated, not independent</div>' : ''}
          </div>
          <div style="font-weight: 800; font-size: 16px;">${pct}%</div>
        </div>
      `;
    }

    const sorPairs = [];
    for (let i = 0; i < compared.length; i++) {
      for (let j = i + 1; j < compared.length; j++) {
        sorPairs.push(sorPairHtml(compared[i], compared[j], colors[i], colors[j]));
      }
    }
    const startOverReplacementHtml = compared.length >= 2 ? `
      <div class="panel" style="margin-top: 16px;">
        <div class="panel-header">
          <div class="panel-title">Start Over Replacement</div>
          <div class="panel-note">Wk ${compareWeek} · % of simulated weeks the first player outscores the second</div>
        </div>
        ${sorPairs.join('')}
        <div class="pd-placeholder-text" style="text-align: left; max-width: none; margin-top: 10px;">
          ${monteCarloCaveatText()}
        </div>
      </div>
    ` : '';

    // ---- Helper: best/worst class for a stat row ----
    function cellClass(values, currentVal, lowerIsBetter = false) {
      const nums = values.filter(v => v != null && !isNaN(v));
      if (nums.length < 2 || currentVal == null) return '';
      const max = Math.max(...nums);
      const min = Math.min(...nums);
      if (max === min) return '';
      const best = lowerIsBetter ? min : max;
      const worst = lowerIsBetter ? max : min;
      if (currentVal === best) return 'best';
      if (currentVal === worst) return 'worst';
      return '';
    }

    // ---- Avatar helper ----
    function compareAvatar(p, size = 48) {
      const headshot = `https://sleepercdn.com/content/nfl/players/thumb/${p.player_id}.jpg`;
      const teamLogo = `https://a.espncdn.com/i/teamlogos/nfl/500/${(p.team || '').toLowerCase()}.png`;
      if (p.position === 'DEF') {
        return `<div class="compare-card-avatar" style="width:${size}px;height:${size}px;"><img src="${teamLogo}" onerror="this.style.display='none'" alt=""></div>`;
      }
      const initials = getInitials(p.name);
