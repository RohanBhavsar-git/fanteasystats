  // ----- DRAFT PREP -----
  // Explicitly NOT a season-long forecast: the model (Phase 6/8) projects
  // one week ahead, and there's no season-long value model in this
  // pipeline -- that would be a materially different model this project
  // doesn't have. This view answers a narrower, honest question instead:
  // what did this player's REAL usage and luck look like last season?
  // Every number here describes a season that already happened, meant to
  // inform a draft, not predict one.
  //
  // Reads directly from an archived season's export (SEASON_OPTIONS'
  // exportPath) plus the live Sleeper player DB for name/position/team --
  // deliberately NOT the full fetchAllRealData() bundle (matchups,
  // transactions, draft picks, brackets), none of which this view needs.
  // Kept independent of the main season selector on purpose: draft prep
  // is always about "last completed season" regardless of which season
  // the rest of the dashboard happens to be showing -- which, once the
  // live season has real games, will usually be the CURRENT season,
  // exactly when pointing this view there would be least useful.

  // Condensed radar: each position's own 6-axis RADAR_METRICS
  // (src/export.py) reduced to one "volume" axis (how much opportunity)
  // and one "efficiency" axis (how good with it), by INDEX into
  // radar.axes -- build_radar_snapshot emits axes in RADAR_METRICS'
  // declared order, so this must stay in lockstep with that dict if it
  // ever changes. Chosen consistently across positions: volume = the
  // single most direct opportunity measure (attempts/touches/targets),
  // efficiency = the single best "how good per opportunity" summary stat.
  const RADAR_CONDENSED_AXES = {
    QB: { volume: 0, efficiency: 4 }, // Pass Volume, EPA / Dropback
    RB: { volume: 0, efficiency: 3 }, // Touch Volume, Yards / Carry
    WR: { volume: 0, efficiency: 4 }, // Target Share, YAC / Reception
    TE: { volume: 0, efficiency: 5 }, // Target Share, YAC / Reception
  };

  // Mirrors src/export.py's SLEEPER_TO_NFLVERSE_TEAM exactly -- an
  // archive's players[id].team comes from weekly_features (nflverse
  // codes, via get_season_team_map), while the live player DB's team
  // comes straight from Sleeper. Only known divergence is the Rams; keep
  // this in lockstep with the Python constant if that ever changes.
  const SLEEPER_TO_NFLVERSE_TEAM = { LAR: 'LA' };
  function normalizeTeamCode(team) { return SLEEPER_TO_NFLVERSE_TEAM[team] || team; }

  // Returns the export JSON for an archived season, preferring
  // seasonDataCache (free if the main season selector already loaded that
  // archive) and falling back to a direct, lightweight fetch of just the
  // export file otherwise -- never the full fetchAllRealData() bundle,
  // which this view has no use for. Returns null while a fetch is in
  // flight or hasn't been triggered yet; callers re-render once it
  // resolves (same fetch-then-rerender pattern as fetchWeekProjections).
  function getArchivedExport(season) {
    const cached = seasonDataCache.get(season)?.advancedStats || archivedExportCache.get(season);
    if (cached) return cached;
    if (!draftPrepFetching.has(season)) {
      draftPrepFetching.add(season);
      const seasonOption = SEASON_OPTIONS.find(s => s.season === season);
      fetchJSON(seasonOption.exportPath)
        .then(data => { archivedExportCache.set(season, data); state.draftPrepError = null; })
        .catch(err => {
          console.error(`Draft Prep: failed to load the ${season} archive:`, err);
          state.draftPrepError = err.message;
        })
        .finally(() => { draftPrepFetching.delete(season); renderView(); });
    }
    return null;
  }

  function renderDraftPrepSection(main, tabToggleHtml) {
    const archivedOptions = SEASON_OPTIONS.filter(s => !s.live).slice().sort((a, b) => b.season - a.season);

    if (archivedOptions.length === 0) {
      main.innerHTML = tabToggleHtml + `
        <div class="page-header-row"><div><div class="page-title">Draft Prep</div></div></div>
        <div class="panel"><div class="placeholder-content">
          <h3>📁 No completed seasons archived yet</h3>
          <p>Draft Prep needs at least one finished season's real usage data. Check back once a season archive exists.</p>
        </div></div>
      `;
      return;
    }

    // Default to the most recently COMPLETED season, independent of
    // whatever the main season selector currently shows.
    if (state.draftPrepSeason == null || !archivedOptions.some(o => o.season === state.draftPrepSeason)) {
      state.draftPrepSeason = archivedOptions[0].season;
    }
    const season = state.draftPrepSeason;
    const f = state.draftPrepFilters;

    const advanced = getArchivedExport(season);
    if (!advanced) {
      main.innerHTML = tabToggleHtml + `
        <div class="page-header-row"><div><div class="page-title">Draft Prep</div></div></div>
        ${state.draftPrepError
          ? `<div class="panel"><div class="placeholder-content">
               <h3 style="color: var(--danger);">⚠️ Couldn't load the ${season} archive</h3>
               <p>${state.draftPrepError}</p>
             </div></div>`
          : `<div class="loading"><div class="spinner"></div>Loading ${season} season data...</div>`}
      `;
      return;
    }

    if (!_playerDbCache) {
      fetchPlayerDatabase().then(() => renderView());
      main.innerHTML = tabToggleHtml + `
        <div class="page-header-row"><div><div class="page-title">Draft Prep</div></div></div>
        <div class="loading"><div class="spinner"></div>Loading player data...</div>
      `;
      return;
    }
    const playerDb = _playerDbCache;

    // Every real candidate the export covers, joined to Sleeper for
    // identity. Rookies never appear here structurally, not via a filter:
    // get_archive_candidates() (src/export.py) only includes players with
    // a real historical row for THIS season, so a player who entered the
    // league afterward simply isn't a key in advanced.players at all.
    // `pd.team` is this player's REAL season team (get_season_team_map,
    // resolved from their own last weekly_features row within THIS
    // season) -- season-scoped, unlike the live player DB's `raw.team`
    // (Sleeper's current snapshot, unrelated to which season is on
    // screen). The two are compared below so a real trade since shows up
    // as a per-player flag instead of the old blanket disclaimer.
    const totalCandidates = Object.keys(advanced.players || {}).length;
    const baseRows = Object.entries(advanced.players || {}).map(([playerId, pd]) => {
      const raw = playerDb[playerId];
      if (!raw || !RADAR_CONDENSED_AXES[raw.position]) return null; // K/DEF/unresolved -- not modeled
      const condensed = RADAR_CONDENSED_AXES[raw.position];
      const axes = pd.radar?.eligible ? pd.radar.axes : null;
      const volumeAxis = axes ? axes[condensed.volume] : null;
      const efficiencyAxis = axes ? axes[condensed.efficiency] : null;
      const trendHeadline = getPlayerTrendHeadline(pd.trend);
      const currentTeam = raw.team || null;
      const seasonTeam = pd.team || currentTeam || 'FA'; // pd.team missing only for a real crosswalk gap
      const teamChanged = !!(pd.team && currentTeam && pd.team !== normalizeTeamCode(currentTeam));
      return {
        playerId,
        name: raw.full_name || `${raw.first_name || ''} ${raw.last_name || ''}`.trim() || 'Unknown',
        position: raw.position,
        team: seasonTeam,
        currentTeam: currentTeam || 'FA',
        teamChanged,
        seasonPts: pd.xfp?.season_actual ?? null,
        gamesPlayed: pd.radar?.games_played ?? pd.heatmap?.games_played ?? null,
        fpOverExp: pd.xfp?.fp_over_expected ?? null,
        volatility: pd.usage?.xfp_vol ?? null,
        volumePct: volumeAxis?.percentile ?? null,
        volumeLabel: volumeAxis?.label ?? null,
        volumeRaw: volumeAxis?.raw ?? null,
        volumeUnit: volumeAxis?.unit ?? '',
        efficiencyPct: efficiencyAxis?.percentile ?? null,
        efficiencyLabel: efficiencyAxis?.label ?? null,
        efficiencyRaw: efficiencyAxis?.raw ?? null,
        efficiencyUnit: efficiencyAxis?.unit ?? '',
        trendSignal: trendHeadline?.signal ?? null,
        trendDirection: trendHeadline?.direction ?? null,
        trendFeature: trendHeadline?.feature ?? null,
      };
    }).filter(Boolean);

    function sortArrow(col) { return f.sortBy === col ? (f.sortDir === 'asc' ? '↑' : '↓') : ''; }
    function pctCell(pct, label, raw, unit) {
      if (pct == null) return '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
      return `<span title="${label}: ${raw != null ? raw + unit : 'n/a'}">${ordinal(pct)}<span style="color: var(--text-muted); font-size: 10px;"> pctl</span></span>
              <div style="font-size: 10px; color: var(--text-muted);">${label}</div>`;
    }

    main.innerHTML = tabToggleHtml + `
      <div class="page-header-row">
        <div>
          <div class="page-title">Draft Prep</div>
          <div class="page-subtitle" id="draft-prep-subtitle"></div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <label style="font-size: 12px; color: var(--text-secondary); font-weight: 600;">Season:</label>
          <select class="filter-select" id="draft-prep-season" style="font-size: 12px;">
            ${archivedOptions.map(o => `<option value="${o.season}"${o.season === season ? ' selected' : ''}>${o.season}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="info-banner" style="border-left-color: var(--warning); align-items: flex-start; flex-direction: column; gap: 6px;">
        <div><strong>This is a review of the ${season} season, not a 2026 projection.</strong> The model projects
        one week at a time -- there's no season-long value model in this pipeline. Everything below describes real
        usage and outcomes that already happened, meant to inform a draft, not predict one.</div>
        <div>⚠️ <strong>Rookies aren't shown</strong> -- they have no real ${season} games to describe, so they
        simply aren't in this data.</div>
        <div>⚠️ <strong>Team shown is the real ${season} team.</strong> A player flagged "since moved" is on a
        different team now -- stats that described one offense don't necessarily carry over to another. Even a
        player who stayed put can have a changed role (new QB, new coordinator, new competition for touches) these
        numbers can't detect.</div>
      </div>

      <div class="filters-bar">
        <input type="text" class="search-input" id="draft-prep-search" placeholder="Search players..." value="${f.search}" />
        <select class="filter-select" id="draft-prep-position">
          <option value="ALL"${f.position === 'ALL' ? ' selected' : ''}>All Positions</option>
          ${['QB','RB','WR','TE'].map(p => `<option value="${p}"${f.position === p ? ' selected' : ''}>${p}</option>`).join('')}
        </select>
        <span style="font-size: 11px; color: var(--text-muted); align-self: center;">QB/RB/WR/TE only — K/DST aren't part of this project's model</span>
      </div>

      <div class="panel" style="padding: 0; overflow: hidden;">
        <table class="players-table">
          <thead>
            <tr>
              <th data-sort="name" class="${f.sortBy === 'name' ? 'sorted' : ''}">Player ${sortArrow('name')}</th>
              <th class="right" data-sort="seasonPts" title="Real total fantasy points scored in the ${season} season, and games played -- grounding context for every column here.">Season Pts ${sortArrow('seasonPts')}</th>
              <th class="right" data-sort="fpOverExp" title="${season} points scored above what this player's opportunity (targets/carries/field position for RB/WR/TE, dropbacks/designed rushes for QB) implied. Positive = scored more than their usage predicted — a fade candidate. Negative = scored less — a buy-low candidate. A luck indicator, not a rating. Weaker luck signal for QB than for RB/WR/TE (hover a QB's own value for why).">FP Over Exp ${sortArrow('fpOverExp')}</th>
              <th class="right" data-sort="volatility" title="Week-to-week swing in this player's expected points (xFP) during the ${season} season, in points. Lower = steadier floor player; higher = boom-or-bust ceiling player.">Volatility ${sortArrow('volatility')}</th>
              <th class="right" data-sort="volumePct" title="Percentile rank among startable players at this position for the ${season} season's volume metric (Pass/Touch/Target Volume, by position — see the label under each value). A rank, not a rating.">Volume ${sortArrow('volumePct')}</th>
              <th class="right" data-sort="efficiencyPct" title="Percentile rank among startable players at this position for the ${season} season's efficiency metric (EPA/Dropback, Yards/Carry, or YAC/Reception, by position — see the label under each value). A rank, not a rating.">Efficiency ${sortArrow('efficiencyPct')}</th>
              <th class="right" data-sort="trendSignal" title="This player's single biggest usage-share signal (target/carry/snap share vs. their own baseline) over the final games of the ${season} season -- who was ascending or fading heading into the offseason. A directional read, not a prediction.">End-of-Season Trend ${sortArrow('trendSignal')}</th>
            </tr>
          </thead>
          <tbody id="draft-prep-tbody"></tbody>
        </table>
      </div>
    `;

    // Recomputes the filtered/sorted rows and repaints only the table body
    // + subtitle count -- never the search input or filter controls.
    // Mirrors renderPlayersView's renderTbody(): rebuilding the whole view
    // on every keystroke recreated the <input>, which either lost focus
    // outright or (when focus() was called to compensate) made typing come
    // out reversed, since focus() restores focus but not cursor position.
    function renderPrepRows() {
      let rows = baseRows;
      if (f.search) rows = rows.filter(r => r.name.toLowerCase().includes(f.search.toLowerCase()));
      if (f.position !== 'ALL') rows = rows.filter(r => r.position === f.position);

      rows.sort((a, b) => {
        let valA = a[f.sortBy], valB = b[f.sortBy];
        // Nulls sort to the bottom regardless of direction (same convention
        // as the Players table). FP Over Exp/Volatility now populate for
        // QB too (see PROJECT_CONTEXT.md's QB xFP findings) -- a null here
        // just means thin bucket/game history, not a QB-shaped gap.
        if (valA == null && valB == null) return 0;
        if (valA == null) return 1;
        if (valB == null) return -1;
        if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = valB.toLowerCase(); }
        if (f.sortDir === 'desc') return valA > valB ? -1 : valA < valB ? 1 : 0;
        return valA < valB ? -1 : valA > valB ? 1 : 0;
      });

      document.getElementById('draft-prep-subtitle').textContent =
        `${rows.length} of ${totalCandidates} players${rows.length > 100 ? ' · showing top 100 by current sort' : ''}`;

      document.getElementById('draft-prep-tbody').innerHTML = rows.slice(0, 100).map(r => {
        // Same QB caveat as the Players table's identical cell -- QB's
        // fp_over_expected strips out meaningfully less luck (0.37 vs.
        // 0.19 residual correlation, see PROJECT_CONTEXT.md's QB xFP
        // findings), so it gets its own title rather than sharing the
        // column header's single tooltip.
        const fpCellTitle = r.position === 'QB'
          ? 'For QB, this reflects real accuracy/decision-making more than luck -- a large number here is less certainly luck than the same number for RB/WR/TE.'
          : '';
        const fpCell = r.fpOverExp != null
          ? `<span style="font-weight: 700; color: ${r.fpOverExp > 0 ? 'var(--success)' : 'var(--danger)'};"${fpCellTitle ? ` title="${fpCellTitle}"` : ''}>${r.fpOverExp > 0 ? '+' : ''}${r.fpOverExp.toFixed(1)}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
        const volCell = r.volatility != null
          ? `<span style="font-weight: 700;">${r.volatility.toFixed(1)}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
        const trendCell = r.trendDirection
          ? `<span style="color: ${r.trendDirection === 'rising' ? 'var(--success)' : 'var(--danger)'}; font-weight: 600; font-size: 12px; white-space: nowrap;">${r.trendDirection === 'rising' ? '↑' : '↓'} ${TREND_FEATURE_LABELS[r.trendFeature]}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
        return `
          <tr data-player-id="${r.playerId}">
            <td>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="pos-badge ${r.position}" style="font-size: 9px; padding: 1px 4px;">${r.position}</span>
                <div>
                  <div style="font-weight: 600;">${r.name}</div>
                  <div style="font-size: 11px; color: var(--text-muted);">
                    ${r.team}${r.teamChanged
                      ? ` <span style="color: var(--warning); font-weight: 600;" title="Now on ${r.currentTeam}">⚠ since moved to ${r.currentTeam}</span>`
                      : ''}
                  </div>
                </div>
              </div>
            </td>
            <td class="right">
              <div style="font-weight: 700;">${r.seasonPts != null ? r.seasonPts.toFixed(1) : '—'}</div>
              <div style="font-size: 10px; color: var(--text-muted);">${r.gamesPlayed != null ? r.gamesPlayed + ' gm' : ''}</div>
            </td>
            <td class="right">${fpCell}</td>
            <td class="right">${volCell}</td>
            <td class="right">${pctCell(r.volumePct, r.volumeLabel, r.volumeRaw, r.volumeUnit)}</td>
            <td class="right">${pctCell(r.efficiencyPct, r.efficiencyLabel, r.efficiencyRaw, r.efficiencyUnit)}</td>
            <td class="right">${trendCell}</td>
          </tr>
        `;
      }).join('');

      // Row click drills into the full Player Detail page. Switches the
      // WHOLE dashboard to this archived season first when it isn't already
      // showing it -- the same "no mixed-season pages" rule Phase 9 applies
      // everywhere else, so a buy-low candidate never opens into a Player
      // Detail page still showing a different season's radar/heatmap/KPIs.
      main.querySelectorAll('table.players-table tr[data-player-id]').forEach(el => {
        el.addEventListener('click', async () => {
          if (state.selectedSeason !== season) {
            await switchSeason(season);
          }
          state.activePlayerId = el.dataset.playerId;
          renderView();
        });
      });
    }

    renderPrepRows();

    document.getElementById('draft-prep-season')?.addEventListener('change', (e) => {
      state.draftPrepSeason = Number(e.target.value);
      renderView();
    });
    let draftPrepSearchDebounce = null;
    document.getElementById('draft-prep-search')?.addEventListener('input', (e) => {
      state.draftPrepFilters.search = e.target.value;
      clearTimeout(draftPrepSearchDebounce);
      draftPrepSearchDebounce = setTimeout(renderPrepRows, 150);
    });
    document.getElementById('draft-prep-position')?.addEventListener('change', (e) => {
      state.draftPrepFilters.position = e.target.value;
      renderPrepRows();
    });
    main.querySelectorAll('table.players-table th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.sort;
        if (f.sortBy === col) f.sortDir = f.sortDir === 'asc' ? 'desc' : 'asc';
        else { f.sortBy = col; f.sortDir = 'desc'; }
        renderView();
      });
    });
  }

  // ----- DRAFT VIEW -----
  function renderDraftView(main) {
    try {
    // ---- Pull the real Sleeper draft data from state ----
    const draft = state.draft;
    const rawPicks = state.draftPicks || [];
    const hasDraftBoard = !!draft && rawPicks.length > 0;

    // Draft Board (this league's own completed draft, retrospective) and
    // Draft Prep (last season's real usage/luck, prospective -- see
    // renderDraftPrepSection) are two different things that both live
    // under "Draft" rather than splitting into a separate top-level tab:
    // they're used at opposite ends of the same event (prep before, board
    // after) and this tab is otherwise idle most of the year, so Draft
    // Prep naturally fills exactly the dead time Draft Board can't cover.
    // Defaults to whichever one actually has something to show -- a
    // league with no published draft yet (like this one, pre-draft 2026)
    // would otherwise land on a dead "no draft data" placeholder.
    if (state.draftTab == null) state.draftTab = hasDraftBoard ? 'board' : 'prep';
    const draftTabToggleHtml = `
      <div class="view-toggle" style="margin-bottom: 16px;">
        <button class="view-toggle-btn ${state.draftTab === 'board' ? 'active' : ''}" data-draft-tab="board">Draft Board</button>
        <button class="view-toggle-btn ${state.draftTab === 'prep' ? 'active' : ''}" data-draft-tab="prep">Draft Prep</button>
      </div>
    `;
    function wireDraftTabToggle() {
      main.querySelectorAll('[data-draft-tab]').forEach(btn => {
        btn.addEventListener('click', () => { state.draftTab = btn.dataset.draftTab; renderView(); });
      });
    }

    if (state.draftTab === 'prep') {
      renderDraftPrepSection(main, draftTabToggleHtml);
      wireDraftTabToggle();
      return;
    }

    if (!hasDraftBoard) {
      main.innerHTML = draftTabToggleHtml + `
        <div class="page-header-row"><div><div class="page-title">Draft Board</div></div></div>
        <div class="panel"><div class="placeholder-content">
          <h3>📋 No draft data available</h3>
          <p>This league doesn't have a published draft, or the draft hasn't completed yet.</p>
        </div></div>
      `;
      wireDraftTabToggle();
      return;
    }

    const ROUNDS = draft.settings?.rounds || Math.max(...rawPicks.map(p => p.round));
    const TEAMS  = draft.settings?.teams  || state.rosters.length;
    const draftType = draft.type || 'snake'; // 'snake' | 'linear' | 'auction'

    // Build the master pick list. Each pick has player metadata embedded in
    // Sleeper's response, so we don't need to look up state.playersById for
    // most fields — but we cross-reference for headshots/etc.
    const draftPicks = rawPicks.map(p => {
      const meta = p.metadata || {};
      const playerName = meta.first_name && meta.last_name
        ? `${meta.first_name} ${meta.last_name}`
        : (meta.player_name || meta.last_name || `Player ${p.player_id}`);
      const cachedPlayer = state.playersById?.[p.player_id] || null;
      return {
        pickNum: p.pick_no,
        round: p.round,
        roundPick: p.draft_slot,
        rosterId: p.roster_id,          // who currently rosters this player
        originalRosterId: p.draft_slot, // the draft slot (1..TEAMS) for grid layout
        playerId: p.player_id,
        playerName,
        position: meta.position || cachedPlayer?.position || '',
        team: meta.team || cachedPlayer?.team || '',
        isKeeper: !!p.is_keeper,
        // Sleeper exposes `traded_picks` separately; we'll cross-reference below
        tradeId: null,
        tradedFromRosterId: null
      };
    });

    // ---- Per-pick traded badges ----
    // We don't decorate individual picks with a "traded" flag — it produced
    // too many false positives. Instead, the Pick Trades panel below shows
    // the real traded picks from Sleeper's /traded_picks endpoint.

    const filter = state.draftFilter || { team: 'ALL', round: 'ALL', position: 'ALL' };
    let picks = [...draftPicks];
    if (filter.team !== 'ALL') picks = picks.filter(p => p.rosterId === parseInt(filter.team));
    if (filter.round !== 'ALL') picks = picks.filter(p => p.round === parseInt(filter.round));
    if (filter.position !== 'ALL') picks = picks.filter(p => p.position === filter.position);

    // ---- Position distribution by round ----
    const roundDistribution = [];
    for (let r = 1; r <= ROUNDS; r++) {
      const roundPicks = draftPicks.filter(p => p.round === r);
      const counts = { QB: 0, RB: 0, WR: 0, TE: 0, K: 0, DEF: 0 };
      roundPicks.forEach(p => {
        if (counts[p.position] !== undefined) counts[p.position]++;
      });
      roundDistribution.push({ round: r, counts, total: roundPicks.length });
    }

    // ---- Position milestones: first off the board ----
    function findFirst(pos) {
      const found = draftPicks
        .slice()
        .sort((a, b) => a.pickNum - b.pickNum)
        .find(p => p.position === pos);
      return found || null;
    }
    const milestones = [
      { label: 'First QB Off Board', pick: findFirst('QB') },
      { label: 'First RB Off Board', pick: findFirst('RB') },
      { label: 'First WR Off Board', pick: findFirst('WR') },
      { label: 'First TE Off Board', pick: findFirst('TE') },
      { label: 'First K Off Board',  pick: findFirst('K') },
      { label: 'First DEF Off Board',pick: findFirst('DEF') }
    ].filter(m => m.pick);

    // ---- Position runs (3+ consecutive picks at same position) ----
    const runs = [];
    let currentRun = null;
    draftPicks
      .slice()
      .sort((a, b) => a.pickNum - b.pickNum)
      .forEach(p => {
        if (!p.position) return;
        if (currentRun && currentRun.position === p.position) {
          currentRun.picks.push(p);
        } else {
          if (currentRun && currentRun.picks.length >= 3) runs.push(currentRun);
          currentRun = { position: p.position, picks: [p] };
        }
      });
    if (currentRun && currentRun.picks.length >= 3) runs.push(currentRun);

    // ---- Draft order: slot → roster mapping ----
    // Sleeper provides slot_to_roster_id, but it occasionally has keys
    // that don't line up (string vs numeric, or missing entirely for
    // older/migrated drafts). We derive the canonical map from the picks
    // themselves: each round-1 pick has both `draft_slot` and `roster_id`,
    // and those should be the same team across every round of the draft.
    const slotToRoster = {};
    // Prefer Sleeper's map when present
    const rawSlotMap = draft.slot_to_roster_id || {};
    Object.keys(rawSlotMap).forEach(k => {
      slotToRoster[Number(k)] = rawSlotMap[k];
    });
    // Fill in any gaps from the picks themselves
    draftPicks.forEach(p => {
      if (slotToRoster[p.roundPick] == null && p.rosterId != null) {
        slotToRoster[p.roundPick] = p.rosterId;
      }
    });
    // Diagnostic for debugging draft display issues
    console.debug('[Draft] slot_to_roster_id (resolved):', slotToRoster,
      '· reversal_round:', draft.settings?.reversal_round,
      '· type:', draftType,
      '· sample picks:', state.draftPicks.slice(0, 3));

    const draftOrder = [];
    for (let s = 1; s <= TEAMS; s++) {
      draftOrder.push(slotToRoster[s] ?? s);
    }
    const filteredPickIds = new Set(picks.map(p => p.pickNum));

    // GRID VIEW: rows = rounds, cols = draft slot. Snake drafts reverse
    // even-numbered rounds — but if the league has 3rd round reversal
    // (`reversal_round: 3`), the reversal direction is shifted: round R
    // reverses if it comes BEFORE the reversal round OR if (R - reversalRound)
    // is even. Equivalent to: rounds [2..reversalRound] are all reversed,
    // then rounds reversalRound+1, reversalRound+3, … snake back normally.
    const reversalRound = draft.settings?.reversal_round || 0;
    const isReverseRound = (r) => {
      if (draftType !== 'snake') return false;
      if (reversalRound && reversalRound >= 2) {
        // Rounds 2 through reversalRound all reverse (same direction).
        // After that, alternate as a normal snake based on parity from
        // the reversal round.
        if (r <= 1) return false;
        if (r <= reversalRound) return true;
        // Past reversal round: snake parity flips relative to reversalRound
        // (R+1 of reversal round goes 1→N, like an odd round).
        return ((r - reversalRound) % 2) === 0;
      }
      // Standard snake: odd rounds 1→N, even rounds N→1
      return r % 2 === 0;
    };
    const gridStyle = `grid-template-columns: 50px repeat(${TEAMS}, minmax(120px, 1fr));`;
    let gridHtml = `<div class="draft-grid" style="${gridStyle}">`;
    gridHtml += `<div class="draft-grid-header round-label">RD</div>`;
    for (let slot = 1; slot <= TEAMS; slot++) {
      const rid = slotToRoster[slot] ?? slot;
      const fullName = getTeamName(rid) || `Team ${rid}`;
      const shortName = fullName.split(' ')[0];
      gridHtml += `<div class="draft-grid-header" title="${fullName}">${shortName}</div>`;
    }
    for (let r = 1; r <= ROUNDS; r++) {
      gridHtml += `<div class="draft-grid-header round-label">${r}</div>`;
      // Each column always shows the team that owns that draft slot.
      // The snake flow is visible through the pick numbers (ascending in
      // odd-rounds, descending in even rounds for 3RR), NOT through
      // column shuffling — column 0 is always slot 1, column N-1 is
      // always slot N.
      for (let col = 0; col < TEAMS; col++) {
        const slot = col + 1;
        const pick = draftPicks.find(p => p.round === r && p.roundPick === slot);
        if (!pick) {
          gridHtml += `<div class="draft-grid-header"></div>`;
          continue;
        }
        const matchesFilter = filteredPickIds.has(pick.pickNum);
        const lastName = pick.playerName.split(' ').slice(-1)[0] || pick.playerName;
        const isTraded = !!pick.tradeId;
        const drafterShort = isTraded ? (getTeamName(pick.rosterId)?.split(' ')[0] || '') : '';
        const pos = pick.position || '';
        gridHtml += `
          <div class="draft-pick ${pos} ${isTraded ? 'traded' : ''}" data-player-id="${pick.playerId}" style="${matchesFilter ? '' : 'opacity: 0.3;'}">
            <div class="draft-pick-num">${pick.pickNum}</div>
            ${pick.isKeeper ? '<div class="traded-badge" title="Keeper pick" style="background: var(--gold);">K</div>' : ''}
            ${isTraded ? `<div class="traded-badge" title="Pick was traded to ${getTeamName(pick.rosterId)}">🔄</div>` : ''}
            <div class="draft-pick-name">${lastName}</div>
            <div class="draft-pick-meta">
              <span class="pos-badge ${pos}" style="font-size: 9px; padding: 1px 4px;">${pos}</span>
              <span>${pick.team}</span>
            </div>
            ${isTraded ? `<div class="pick-team-line via">→ ${drafterShort}</div>` : ''}
          </div>
        `;
      }
    }
    gridHtml += '</div>';

    // LIST VIEW
    let listRows = '';
    picks
      .slice()
      .sort((a, b) => a.pickNum - b.pickNum)
      .forEach(p => {
        const isTraded = !!p.tradeId;
        const teamCell = isTraded
          ? `<span style="color: var(--text-muted); text-decoration: line-through;">${getTeamName(p.originalRosterId)}</span> → <strong>${getTeamName(p.rosterId)}</strong> <span title="Pick was traded" style="color: var(--accent);">🔄</span>`
          : getTeamName(p.rosterId);
        listRows += `
          <tr data-player-id="${p.playerId}">
            <td style="font-weight: 700;">${p.pickNum}</td>
            <td>${p.round}.${p.roundPick}</td>
            <td style="font-size: 12px;">${teamCell}</td>
            <td><span style="font-weight: 600;">${p.playerName}</span>${p.isKeeper ? ' <span style="color: var(--gold); font-size: 10px; font-weight: 700;">KEEPER</span>' : ''}</td>
            <td><span class="pos-badge ${p.position}">${p.position}</span></td>
            <td>${p.team}</td>
          </tr>
        `;
      });
    const listHtml = `
      <table class="players-table">
        <thead>
          <tr><th>Pick</th><th>Round</th><th>Drafted By</th><th>Player</th><th>Pos</th><th>NFL</th></tr>
        </thead>
        <tbody>${listRows}</tbody>
      </table>
    `;

    // ---- Position distribution panel ----
    let posDistHtml = '';
    roundDistribution.forEach(r => {
      const total = r.total || 1;
      let segments = '';
      ['QB','RB','WR','TE','K','DEF'].forEach(pos => {
        const c = r.counts[pos];
        if (c === 0) return;
        const pct = (c / total) * 100;
        segments += `<div class="pos-dist-segment ${pos}" style="width: ${pct}%;" title="${pos}: ${c}">${c >= 2 ? c : ''}</div>`;
      });
      posDistHtml += `
        <div class="pos-dist-row">
          <div class="pos-dist-label">RD ${r.round}</div>
          <div class="pos-dist-bar">${segments}</div>
        </div>
      `;
    });

    // ---- Milestones panel ----
    let milestonesHtml = '';
    milestones.forEach(m => {
      milestonesHtml += `
        <div class="draft-milestone" data-player-id="${m.pick.playerId}" style="cursor: pointer;">
          <div class="milestone-pick">#${m.pick.pickNum}</div>
          <div class="milestone-content">
            <div class="milestone-label">${m.label}</div>
            <div class="milestone-value">${m.pick.playerName}</div>
            <div class="milestone-meta">${m.pick.team} · drafted by ${getTeamName(m.pick.rosterId)}</div>
          </div>
        </div>
      `;
    });

    // ---- Position runs panel ----
    let runsHtml = '';
    if (runs.length > 0) {
      const colorMap = { QB: '#dc2626', RB: '#059669', WR: '#2563eb', TE: '#d97706', K: '#7c3aed', DEF: '#0891b2' };
      let runCards = '';
      runs.forEach(run => {
        const playerNames = run.picks.map(p => p.playerName.split(' ').slice(-1)[0]).join(', ');
        runCards += `
          <div class="position-run">
            <div class="run-header">
              <span class="run-title"><span class="pos-badge ${run.position}">${run.position}</span> Run</span>
              <span class="run-pick-count" style="background: ${colorMap[run.position] || '#666'};">${run.picks.length} picks</span>
            </div>
            <div class="run-picks">
              Picks ${run.picks[0].pickNum}-${run.picks[run.picks.length - 1].pickNum} · ${playerNames}
            </div>
          </div>
        `;
      });
      runsHtml = `
        <div class="panel" style="margin-top: 16px;">
          <div class="panel-header">
            <div class="panel-title">Position Runs</div>
            <div class="panel-note">3+ consecutive picks at the same position</div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px;">${runCards}</div>
        </div>
      `;
    }

    const keeperCount = draftPicks.filter(p => p.isKeeper).length;
    const ordinalRound = (n) => {
      const j = n % 10, k = n % 100;
      if (j === 1 && k !== 11) return `${n}st`;
      if (j === 2 && k !== 12) return `${n}nd`;
      if (j === 3 && k !== 13) return `${n}rd`;
      return `${n}th`;
    };

    main.innerHTML = draftTabToggleHtml + `
      <div class="page-header-row">
        <div>
          <div class="page-title">Draft Board</div>
          <div class="page-subtitle">${draft.season || ''} ${draftType === 'snake' ? (reversalRound >= 2 ? `Snake (${ordinalRound(reversalRound)} round reversal)` : 'Snake') : draftType === 'auction' ? 'Auction' : 'Linear'} Draft · ${draftPicks.length} picks${keeperCount ? ` · ${keeperCount} keepers` : ''}</div>
        </div>
        <div class="view-toggle">
          <button class="view-toggle-btn ${state.draftView === 'grid' ? 'active' : ''}" data-view="grid">Grid</button>
          <button class="view-toggle-btn ${state.draftView === 'list' ? 'active' : ''}" data-view="list">List</button>
        </div>
      </div>

      <div class="draft-controls">
        <select class="filter-select" id="draft-filter-team">
          <option value="ALL">All Teams</option>
          ${state.rosters.map(r => `<option value="${r.roster_id}"${filter.team === String(r.roster_id) ? ' selected' : ''}>${getTeamName(r.roster_id)}</option>`).join('')}
        </select>
        <select class="filter-select" id="draft-filter-round">
          <option value="ALL">All Rounds</option>
          ${Array.from({ length: ROUNDS }, (_, i) => i + 1).map(r => `<option value="${r}"${filter.round === String(r) ? ' selected' : ''}>Round ${r}</option>`).join('')}
        </select>
        <select class="filter-select" id="draft-filter-position">
          <option value="ALL">All Positions</option>
          ${['QB','RB','WR','TE','K','DEF'].map(p => `<option value="${p}"${filter.position === p ? ' selected' : ''}>${p}</option>`).join('')}
        </select>
      </div>

      ${state.draftView === 'grid'
        ? `<div class="draft-grid-wrapper">${gridHtml}</div>`
        : `<div class="panel" style="padding: 0; overflow: hidden;">${listHtml}</div>`}

      <div class="dashboard-grid" style="margin-top: 16px;">
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Position Distribution by Round</div>
            <div class="panel-note">When teams went heavy at each position</div>
          </div>
          ${posDistHtml}
          <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 11px;">
            ${['QB','RB','WR','TE','K','DEF'].map(pos => `
              <div style="display: flex; align-items: center; gap: 5px;">
                <span class="pos-dist-segment ${pos}" style="width: 14px; height: 14px; border-radius: 3px;"></span>
                <span style="color: var(--text-secondary); font-weight: 600;">${pos}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Position Milestones</div>
            <div class="panel-note">First off the board</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">${milestonesHtml}</div>
        </div>
      </div>

      ${runsHtml}
    `;

    wireDraftTabToggle();
    main.querySelectorAll('.view-toggle-btn[data-view]').forEach(btn => {
      btn.addEventListener('click', () => { state.draftView = btn.dataset.view; renderView(); });
    });
    document.getElementById('draft-filter-team')?.addEventListener('change', (e) => { state.draftFilter.team = e.target.value; renderView(); });
    document.getElementById('draft-filter-round')?.addEventListener('change', (e) => { state.draftFilter.round = e.target.value; renderView(); });
    document.getElementById('draft-filter-position')?.addEventListener('change', (e) => { state.draftFilter.position = e.target.value; renderView(); });
    main.querySelectorAll('[data-player-id]').forEach(el => {
      el.addEventListener('click', () => {
        state.activePlayerId = el.dataset.playerId;
        renderView();
      });
    });
    } catch (err) {
      console.error('Draft view error:', err);
      main.innerHTML = `
        <div class="view-toggle" style="margin-bottom: 16px;">
          <button class="view-toggle-btn ${state.draftTab === 'board' ? 'active' : ''}" data-draft-tab="board">Draft Board</button>
          <button class="view-toggle-btn ${state.draftTab === 'prep' ? 'active' : ''}" data-draft-tab="prep">Draft Prep</button>
        </div>
        <div class="page-header-row"><div><div class="page-title">${state.draftTab === 'prep' ? 'Draft Prep' : 'Draft Board'}</div></div></div>
        <div class="panel">
          <div class="placeholder-content">
            <h3 style="color: var(--danger);">⚠️ Draft view error</h3>
            <p style="margin-bottom: 12px;">${err.message}</p>
            <p style="font-size: 12px; font-family: monospace; background: var(--bg-tertiary); padding: 10px; border-radius: 6px; text-align: left; white-space: pre-wrap;">${err.stack}</p>
          </div>
        </div>
      `;
      main.querySelectorAll('[data-draft-tab]').forEach(btn => {
        btn.addEventListener('click', () => { state.draftTab = btn.dataset.draftTab; renderView(); });
      });
    }
  }

  // ----- TEAM TENDENCIES VIEW -----
  // The honest version of an earlier "coaching scheme" idea -- nflverse has
  // no coordinator table (it would need permanent hand-maintenance, and a
  // per-coordinator sample is tiny), so this measures what a TEAM actually
  // does, from real play-by-play (src/team_tendencies.py), not who calls
  // the plays. Every number here describes the OFFENSE, not a player --
  // teamTendencyCaveatText() says so plainly, inline, not just in a tooltip.
  function getAllTeamTendencies() {
    return state.advancedStats?.team_tendencies || {};
  }
  function getTeamTendency(team) {
    return getAllTeamTendencies()[team] || null;
  }
  function teamTendencyCaveatText() {
    return state.advancedStats?.meta?.team_tendency_caveat
      || "These describe the offense a team runs, not any one player's usage within it -- a player who joins this team inherits the environment, not the incumbent's role.";
  }
  function tendencyLeagueValues(pick) {
    return Object.values(getAllTeamTendencies()).map(pick).filter(v => v != null);
  }
  function tendencySparseBadge(block) {
    return block && block.sparse
      ? `<span class="tendency-sparse-mark" title="Thin real sample this season -- shown, not hidden, but too few plays to read with confidence yet.">~</span>`
      : '';
  }
  function teamLogoUrl(team) {
    return `https://a.espncdn.com/i/teamlogos/nfl/500/${(team || '').toLowerCase()}.png`;
  }

  // Plain-language definitions for every Team Tendencies metric -- none of
  // these are self-explanatory on sight, and hover is the same place every
  // other caveat on this dashboard already lives (see tendencySparseBadge's
  // own tooltip just above). PACE and PLAYS_PER_GAME each note the other by
  // name since they're related but answer different questions -- see
  // tendencyQuadrant's own comment for the full reasoning.
  const TENDENCY_METRIC_TOOLTIPS = {
    proe: "Pass rate over expected: how much more (or less) this team passes than a league-average offense would in the same situations (score, down, distance, time remaining). Positive = more pass-heavy than expected; negative = more run-heavy.",
    pace: "Average real time between snaps in neutral game situations -- lower means a faster tempo. Related to Plays Per Game but not the same thing: a fast team that stalls and punts can still run FEWER total plays than a slower team that sustains long drives.",
    plays: "Real offensive plays run per game -- the pool of opportunities (targets + carries) every player on this offense splits. This is what actually drives fantasy volume, more directly than tempo (Pace) alone.",
    rz20: "Share of real plays inside the opponent's 20-yard line called as a pass rather than a run. Higher means this offense keeps throwing even in scoring range, where many teams shift run-heavy.",
    rz10: "Same idea as RZ Pass% (≤20), restricted to inside the 10 -- the closest, most goal-line-specific plays, where an offense's real identity often shows up most clearly.",
    targetDist: "Share of this team's real targets going to running backs, wide receivers, and tight ends -- shows which position group this offense actually funnels its passing volume to.",
    airAllowed: "Share of this defense's real fantasy points allowed to RB/WR/TE that came through the air (receptions) rather than on the ground (carries). More useful than one blended points-allowed number -- two defenses can allow the same total while favoring completely different fantasy players.",
  };

  const TENDENCY_SORT_ACCESSORS = {
    proe: t => t.proe.s2d,
    pace: t => t.pace_seconds_per_play.s2d,
    plays: t => t.plays_per_game.s2d,
    rz20: t => t.red_zone.inside_20_pass_rate.s2d,
    rz10: t => t.red_zone.inside_10_pass_rate.s2d,
    airAllowed: t => tendencyAirShare(t.points_allowed),
  };

  // Air share of real fantasy points allowed to RB/WR/TE -- air / (air +
  // ground). Shared by the sortable table column and its cell renderer so
  // "sorted by X" and "the number shown in X's column" can never disagree.
  function tendencyAirShare(pointsAllowed) {
    const air = pointsAllowed?.air?.s2d, ground = pointsAllowed?.ground?.s2d;
    if (air == null || ground == null || (air + ground) <= 0) return null;
    return air / (air + ground);
  }

  function sortedTendencyEntries(all) {
    const accessor = TENDENCY_SORT_ACCESSORS[state.tendenciesSortMetric] || TENDENCY_SORT_ACCESSORS.proe;
    return Object.entries(all)
      .filter(([, t]) => accessor(t) != null)
      .sort((a, b) => accessor(b[1]) - accessor(a[1]));
  }

  // Quadrant split: PROE against 0 (the league's own natural center by
  // construction -- nflfastR's xpass model is fit so the league-wide mean
  // of pass_oe sits near zero), volume against the league's OWN median
  // plays/game this season (there's no natural "zero" for a play count the
  // way there is for a rate-over-expected).
  //
  // Plays per game, not seconds per play: plays/game IS the pool of
  // opportunities (targets + carries) the whole offense divides, which is
  // what actually matters for fantasy volume. Pace (tempo) drives that pool
  // but isn't the same thing -- a fast team that goes three-and-out often
  // can run FEWER real plays than a slower team that sustains long drives.
  // Pace stays on the Team Detail page (see tendencyRangeCardHtml's own
  // "Pace" card) since it still explains WHY a team's volume is what it is,
  // just isn't the right axis for "which offense gives my player the most
  // opportunities" at a glance.
  function tendencyQuadrant(proe, playsPerGame, playsMedian) {
    const highVolume = playsPerGame > playsMedian;
    const passHeavy = proe > 0;
    if (highVolume && passHeavy) return { color: '#0891b2', label: 'High-volume & pass-heavy' };
    if (highVolume && !passHeavy) return { color: '#f59e0b', label: 'High-volume & run-heavy' };
    if (!highVolume && passHeavy) return { color: '#8b5cf6', label: 'Low-volume & pass-heavy' };
    return { color: '#ef4444', label: 'Low-volume & run-heavy' };
  }

  function renderTendenciesScatterChart(all) {
    const canvas = document.getElementById('tendencies-scatter');
    if (!canvas) return;
    const entries = Object.entries(all).filter(
      ([, t]) => t.proe.s2d != null && t.plays_per_game.s2d != null
    );
    if (entries.length === 0) return;

    const playsValues = entries.map(([, t]) => t.plays_per_game.s2d).sort((a, b) => a - b);
    const playsMedian = playsValues[Math.floor(playsValues.length / 2)];

    const points = entries.map(([team, t]) => {
      const q = tendencyQuadrant(t.proe.s2d, t.plays_per_game.s2d, playsMedian);
      return { x: t.proe.s2d, y: t.plays_per_game.s2d, team, color: q.color };
    });

    chartInstances.tendenciesScatter = new Chart(canvas.getContext('2d'), {
      type: 'scatter',
      data: {
        datasets: [{
          data: points,
          backgroundColor: points.map(p => p.color),
          borderColor: 'rgba(255,255,255,0.7)',
          borderWidth: 1.5,
          pointRadius: 7,
          pointHoverRadius: 9,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            title: { display: true, text: 'Pass rate over expected (PROE, pts) -- run-heavy ← → pass-heavy' },
            grid: { color: 'rgba(128,128,128,0.15)' },
          },
          y: {
            title: { display: true, text: 'Plays per game -- fewer ↓   ↑ more' },
            grid: { color: 'rgba(128,128,128,0.15)' },
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const p = ctx.raw;
                return `${p.team}: PROE ${p.x >= 0 ? '+' : ''}${p.x.toFixed(1)}, ${p.y.toFixed(1)} plays/gm`;
              },
            },
          },
        },
        onClick: (evt, elements) => {
          if (!elements.length) return;
          state.tendenciesSelectedTeam = points[elements[0].index].team;
          renderView();
        },
        onHover: (evt, elements) => {
          evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
        },
      },
    });
  }

  function tendencyMetricCellHtml(block, decimals, suffix, scale) {
    scale = scale || 1;
    if (!block || block.s2d == null) return '<td class="right" style="color: var(--text-muted);">—</td>';
    return `<td class="right">${(block.s2d * scale).toFixed(decimals)}${suffix || ''}${tendencySparseBadge(block)}</td>`;
  }

  function targetDistBarHtml(td) {
    const rb = Math.round((td.rb.s2d || 0) * 100);
    const wr = Math.round((td.wr.s2d || 0) * 100);
    const te = Math.round((td.te.s2d || 0) * 100);
    return `
      <div class="target-dist-bar" title="RB ${rb}% · WR ${wr}% · TE ${te}%${td.sparse ? ' (thin sample)' : ''}">
        <div class="target-dist-seg rb" style="width:${rb}%"></div>
        <div class="target-dist-seg wr" style="width:${wr}%"></div>
        <div class="target-dist-seg te" style="width:${te}%"></div>
      </div>
    `;
  }

  function tendencyAirShareCellHtml(pointsAllowed) {
    const share = tendencyAirShare(pointsAllowed);
    if (share == null) return '<td class="right" style="color: var(--text-muted);">—</td>';
    return `<td class="right">${(share * 100).toFixed(0)}%</td>`;
  }

  function tendencyTableRowHtml(team, t) {
    return `
      <tr data-team="${team}">
        <td><div class="tendencies-team-cell"><img src="${teamLogoUrl(team)}" alt="" onerror="this.style.display='none'"/>${team}</div></td>
        ${tendencyMetricCellHtml(t.proe, 1)}
        ${tendencyMetricCellHtml(t.pace_seconds_per_play, 1)}
        ${tendencyMetricCellHtml(t.plays_per_game, 1)}
        ${tendencyMetricCellHtml(t.red_zone.inside_20_pass_rate, 0, '%', 100)}
        ${tendencyMetricCellHtml(t.red_zone.inside_10_pass_rate, 0, '%', 100)}
        <td>${targetDistBarHtml(t.target_distribution)}</td>
        ${tendencyAirShareCellHtml(t.points_allowed)}
      </tr>
    `;
  }

  function tendenciesEmptyStateHtml() {
    // Distinguishes "this export predates the team_tendencies key
    // entirely" (an old export, or advancedStats hasn't loaded yet) from
    // "the key exists but no team has enough real plays yet" (genuinely
    // early season) -- same distinction renderFieldHeatmapPanel's
    // !heatmap vs. !heatmap.eligible check already makes, just at the
    // top-level-key granularity instead of per-player.
    const keyExists = state.advancedStats?.team_tendencies != null;
    const title = keyExists ? 'Not enough plays yet' : 'Awaiting model output';
    const text = keyExists
      ? 'No team has enough real offensive plays this season yet for an honest read -- this populates as the season’s early weeks are played.'
      : 'Once <code>player_advanced_stats.json</code> covers Team Tendencies, this tab will show real offensive tendencies -- pass rate over expected, pace, red-zone play-calling, target distribution -- for every team, from play-by-play.';
    return `
      <div class="panel">
        <div class="pd-placeholder">
          <div class="pd-placeholder-icon">🏈</div>
          <div class="pd-placeholder-title">${title}</div>
          <div class="pd-placeholder-text">${text}</div>
        </div>
      </div>
    `;
  }

  function wireTendenciesTable(main) {
    main.querySelectorAll('.tendencies-table th[data-tendency-sort]').forEach((th) => {
      th.addEventListener('click', () => {
        state.tendenciesSortMetric = th.dataset.tendencySort;
        renderView();
      });
    });
    main.querySelectorAll('.tendencies-table tbody tr[data-team]').forEach((tr) => {
      tr.addEventListener('click', () => {
        state.tendenciesSelectedTeam = tr.dataset.team;
        renderView();
      });
    });
  }

  function renderTendenciesView(main) {
    if (state.tendenciesSelectedTeam) return renderTendencyTeamDetail(main, state.tendenciesSelectedTeam);

    const all = getAllTeamTendencies();
    const teams = Object.keys(all);
    const sortLabel = { proe: 'PROE', pace: 'Pace', plays: 'Plays/Gm', rz20: 'RZ Pass% (≤20)', rz10: 'RZ Pass% (≤10)', airAllowed: 'Air Allowed %' };

    main.innerHTML = `
      <div class="page-header-row">
        <div>
          <div class="page-title">Team Tendencies</div>
          <div class="page-subtitle">Real offense identity from play-by-play -- not a player's usage, the environment they play in</div>
        </div>
      </div>
      ${teams.length === 0 ? tendenciesEmptyStateHtml() : `
        <div class="panel" style="margin-bottom: 16px;">
          <div class="panel-header">
            <div class="panel-title">League Landscape</div>

  function tendencyRangeCardHtml(label, block, decimals, suffix, allValues, tooltip) {
    if (!block || block.s2d == null || allValues.length === 0) {
      return `
        <div class="tendency-metric-card">
          <div class="tendency-metric-label"${tooltip ? ` title="${tooltip}"` : ''}>${label}</div>
          <div class="tendency-metric-values"><span class="tmv-main" style="color: var(--text-muted);">—</span></div>
        </div>
      `;
    }
    const val = block.s2d;
    const min = Math.min(...allValues), max = Math.max(...allValues);
    const pct = max > min ? ((val - min) / (max - min)) * 100 : 50;
    const recent = block.ewm3;
    return `
      <div class="tendency-metric-card">
        <div class="tendency-metric-label"${tooltip ? ` title="${tooltip}"` : ''}>${label}${tendencySparseBadge(block)}</div>
        <div class="tendency-metric-values">
          <span class="tmv-main">${val.toFixed(decimals)}${suffix || ''}</span>
          ${recent != null ? `<span class="tmv-sub">recent (3wk): ${recent.toFixed(decimals)}${suffix || ''}</span>` : ''}
        </div>
        <div class="tendency-range-track">
          <div class="tendency-range-marker" style="left: calc(${pct}% - 1px);"></div>
        </div>
        <div class="tendency-range-labels"><span>${min.toFixed(decimals)}${suffix || ''} low</span><span>${max.toFixed(decimals)}${suffix || ''} high</span></div>
      </div>
    `;
  }
