  // carry share/red-zone share only mean something for a position that
  // splits offensive touches with teammates (RB/WR/TE). This function's
  // own name stayed put since renderPlayerDetail's call site shouldn't
  // need to know that dispatch happens at all.
  function renderOpportunitySharesPanel(p, season, week) {
    if (p.position === 'QB') return renderQBContextPanel(p);
    if (p.position === 'K') return renderKickerStatsPanel(p);
    if (p.position === 'DEF') return renderDefenseStatsPanel(p);
    const advanced = getAdvancedPlayer(p.player_id);
    if (!advanced) {
      return `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Opportunity Shares</div>
            <div class="panel-note">Trailing usage, most recent games</div>
          </div>
          <div class="pd-placeholder">
            <div class="pd-placeholder-icon">📋</div>
            <div class="pd-placeholder-title">Awaiting model output</div>
            <div class="pd-placeholder-text">
              Once <code>player_advanced_stats.json</code> covers this player, snap %, target share, carry share,
              and red-zone share will appear here.
            </div>
          </div>
        </div>
      `;
    }
    const usage = advanced.usage || {};
    const trend = advanced.trend || {};
    const shareCard = (icon, iconClass, label, value, sub) => `
      <div class="injury-stat-card">
        <div class="injury-stat-icon ${iconClass}">${icon}</div>
        <div class="injury-stat-content">
          <div class="injury-stat-label">${label}</div>
          ${value != null
            ? `<div class="injury-stat-value">${(value * 100).toFixed(1)}%</div><div class="injury-stat-sub">${sub}</div>`
            : `<div class="injury-stat-value" style="color: var(--text-muted);">—</div><div class="injury-stat-sub">No games yet</div>`}
        </div>
      </div>
    `;

    // Compact trend indicator (Phase 8 round 3) -- direction + which
    // feature drove it, reusing the SAME per-player "biggest signal"
    // selection the Dashboard's Usage Trending panel (Round 1) uses, so
    // the two can never disagree about which feature is "the" trend for
    // this player. Deliberately not its own panel -- one line here.
    const trendHeadline = getPlayerTrendHeadline(trend);
    const trendLineHtml = trendHeadline
      ? `<div style="font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
           <span style="color: ${trendHeadline.direction === 'rising' ? 'var(--success)' : 'var(--danger)'}; font-weight: 700;">${trendHeadline.direction === 'rising' ? '↑' : '↓'}</span>
           <span>${TREND_FEATURE_LABELS[trendHeadline.feature]} ${trendHeadline.direction}</span>
         </div>`
      : `<div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">No usage trend yet this season</div>`;

    // Family 5B matchup line -- how this week's real opponent rates
    // against this player's own position, opponent-adjusted. Gated on
    // season/week the same way getMyProj/getMonteCarlo are (see
    // getMatchup's own comment) so a stale week's opponent is never shown
    // as if it described the week on screen.
    const matchup = getMatchup(p.player_id, season, week);
    const matchupFav = matchup ? matchupFavorability(matchup.rank, matchup.pool_size) : null;
    const matchupLineHtml = !matchup || !matchup.opponent
      ? `<div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">No real matchup for this week yet</div>`
      : matchupFav
        ? `<div style="font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
             <span>${matchupFav.icon}</span>
             <span>vs ${matchup.opponent} — <span style="color: ${matchupFav.color}; font-weight: 700;">${matchupFav.label}</span> matchup (#${matchup.rank} of ${matchup.pool_size} defenses, opponent-adjusted)</span>
           </div>`
        : `<div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">vs ${matchup.opponent} — no matchup rating for this position</div>`;

    return `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Opportunity Shares</div>
          <div class="panel-note">Trailing 3-week usage, as of last update</div>
        </div>
        ${trendLineHtml}
        ${matchupLineHtml}
        <div class="injury-stat-grid">
          ${shareCard('🏃', 'blue', 'Snap %', usage.offense_pct_ewm3, 'Of offensive snaps')}
          ${shareCard('🎯', 'purple', 'Target Share', usage.target_share_ewm3, 'Of team targets')}
          ${shareCard('🔄', 'orange', 'Carry Share', trend.carry_share?.current, 'Of team carries')}
          ${shareCard('🔴', 'red', 'Red-Zone Share', trend.red_zone_share?.current, 'Of team RZ plays')}
        </div>
      </div>
    `;
  }

  // Boom/Bust: per-player point-in-time Monte Carlo metrics
  // (src/export.py's `monte_carlo` block) -- boom_prob/bust_prob plus a
  // POSITION-SPECIFIC "P(exceeds X)" breakdown (see
  // src/simulate.py::POSITION_THRESHOLDS -- 20 points is a big week for a
  // TE and a middling one for a QB, so the threshold list itself differs
  // by position, not just the labels). Stated in real points, not a
  // standard-deviation-based volatility number -- more directly answers
  // "how often does this player actually blow up or lay an egg" than the
  // existing Volatility (xfp_vol) card above does.
  //
  // Same three-state honesty pattern as renderPositionProfilePanel: no
  // `monte_carlo` key at all (export predates this feature, or this is an
  // archived season -- archives never carry it, see getMonteCarlo's own
  // comment) reads as "awaiting model output"; a real block renders the
  // numbers plus the CQR calibration caveat inline, right where the
  // numbers appear, not buried in a general caveats list.
  function renderMonteCarloPanel(p, season, week) {
    const mc = getMonteCarlo(p.player_id, season, week);
    if (!mc) {
      return `
        <div class="panel" style="margin-top: 16px;">
          <div class="panel-header">
            <div class="panel-title">Boom / Bust</div>
            <div class="panel-note">Monte Carlo, this week's projection</div>
          </div>
          <div class="pd-placeholder">
            <div class="pd-placeholder-icon">🎲</div>
            <div class="pd-placeholder-title">Awaiting model output</div>
            <div class="pd-placeholder-text">
              Once <code>player_advanced_stats.json</code> covers this week for this player, boom/bust
              probabilities and a threshold breakdown will appear here.
            </div>
          </div>
        </div>
      `;
    }
    const thresholdRows = Object.entries(mc.thresholds)
      .sort((a, b) => Number(a[0]) - Number(b[0]))
      .map(([t, prob]) => `
        <div class="radar-axis-row">
          <span class="radar-axis-label">${t}+ points</span>
          <span class="radar-axis-pct">${(prob * 100).toFixed(0)}%</span>
        </div>
      `).join('');
    return `
      <div class="panel" style="margin-top: 16px;">
        <div class="panel-header">
          <div class="panel-title">Boom / Bust</div>
          <div class="panel-note">Monte Carlo, ${state.advancedStats?.meta?.monte_carlo_n_sims?.toLocaleString() || '10,000'} draws</div>
        </div>
        <div class="injury-stat-grid" style="grid-template-columns: repeat(2, 1fr);">
          <div class="injury-stat-card">
            <div class="injury-stat-icon orange">🚀</div>
            <div class="injury-stat-content">
              <div class="injury-stat-label">Boom Rate</div>
              <div class="injury-stat-value">${(mc.boom_prob * 100).toFixed(0)}%</div>
              <div class="injury-stat-sub">Chance of a big week</div>
            </div>
          </div>
          <div class="injury-stat-card">
            <div class="injury-stat-icon red">💥</div>
            <div class="injury-stat-content">
              <div class="injury-stat-label">Bust Rate</div>
              <div class="injury-stat-value">${(mc.bust_prob * 100).toFixed(0)}%</div>
              <div class="injury-stat-sub">Chance of a dud</div>
            </div>
          </div>
        </div>
        <div class="radar-axis-list" style="margin-top: 4px;">
          ${thresholdRows}
        </div>
        <div class="pd-placeholder-text" style="text-align: left; max-width: none; margin-top: 10px;">
          ${monteCarloCaveatText()}
        </div>
      </div>
    `;
  }

  // 1st/2nd/3rd/4th... English ordinal suffix, used for radar percentile
  // labels ("62nd pctl") -- the 11th/12th/13th special case (not "11st"
  // etc.) is why this needs the two-digit check before the last-digit one.
  function ordinal(n) {
    const rem100 = n % 100;
    if (rem100 >= 11 && rem100 <= 13) return `${n}th`;
    return `${n}${['th', 'st', 'nd', 'rd'][n % 10] || 'th'}`;
  }

  // Phase 4: Position Profile radar. Three states, same honesty pattern
  // as every other new-field rollout in this export -- an entirely
  // missing `radar` key (an old export predating this feature) reads the
  // same as `state.advancedStats` itself being absent; `radar.eligible ===
  // false` (real, but too few games this season) gets a SPECIFIC reason
  // rather than a generic placeholder, reusing the same games_played/
  // min_games the export itself used to make that call so the copy can
  // never drift from the actual gate; `radar.eligible === true` renders
  // the real chart. Chart.js instantiation happens after this string is
  // inserted into the DOM -- see renderPlayerDetail's post-innerHTML block.
  function renderPositionProfilePanel(p) {
    // Phases 4/5 only ever built radar/heatmap axes for QB/RB/WR/TE --
    // K and DEF will NEVER get a `radar` key, not "not yet." An "Awaiting
    // model output" placeholder that can never resolve promises something
    // that isn't coming, so this drops the panel entirely for those two
    // positions instead of showing a permanent dead end.
    if (p.position === 'K' || p.position === 'DEF') return '';
    const advanced = getAdvancedPlayer(p.player_id);
    const radar = advanced?.radar;

    if (!radar) {
      return `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">${p.position} Profile</div>
            <div class="panel-note">Percentile rank vs. startable ${p.position}s</div>
          </div>
          <div class="pd-placeholder">
            <div class="pd-placeholder-icon">📈</div>
            <div class="pd-placeholder-title">Awaiting model output</div>
            <div class="pd-placeholder-text">
              Once <code>player_advanced_stats.json</code> covers this player, this panel will show a 6-axis
              percentile profile for ${p.position}s -- volume, share, efficiency, and situational usage.
            </div>
          </div>
        </div>
      `;
    }

    if (!radar.eligible) {
      return `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">${p.position} Profile</div>
            <div class="panel-note">Percentile rank vs. startable ${p.position}s</div>
          </div>
          <div class="pd-placeholder">
            <div class="pd-placeholder-icon">📈</div>
            <div class="pd-placeholder-title">Not enough games yet</div>
            <div class="pd-placeholder-text">
              ${radar.games_played} of ${radar.min_games} games played this season. A profile built on this few
              games would rank higher or lower than reality mostly by chance -- check back in a few weeks.
            </div>
          </div>
        </div>
      `;
    }

    return `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">${p.position} Profile</div>
          <div class="panel-note">Percentile vs. ${radar.pool_size} startable ${p.position}s</div>
        </div>
        <div class="radar-wrapper">
          <canvas id="pd-radar-chart"></canvas>
        </div>
        <div class="pd-placeholder-text" style="text-align: left; max-width: none; margin-top: 6px;">
          Each axis is a RANK, not a rating: the N here means this player is ahead of N% of this league's
          startable ${p.position}s in that stat this season -- not that he's "good" at it. A high percentile in
          Pass Volume just means more attempts than most starters, nothing about efficiency.
        </div>
        <div class="radar-axis-list">
          ${radar.axes.map(ax => `
            <div class="radar-axis-row">
              <span class="radar-axis-label">${ax.label}</span>
              <span class="radar-axis-raw">${ax.raw != null ? ax.raw + ax.unit : '—'}</span>
              <span class="radar-axis-pct">${ax.percentile != null ? ordinal(ax.percentile) + ' pctl' : '—'}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // Phase 5 (redesigned): Field Heatmap, as an actual football field
  // instead of a labeled grid. The grid was accurate but abstract -- this
  // is spatial data (depth, direction, field position), and a diagram
  // reads it the way a real usage map should: a deep threat's heat sits
  // visibly far from the line of scrimmage, a possession receiver's sits
  // right on top of it, no percentages need reading to see the difference.
  //
  // The design problem the grid didn't solve: depth and direction map
  // naturally onto a field graphic (they're both "where on the field, and
  // which way"), but FIELD POSITION doesn't -- a 15-yard target looks
  // identical whether the drive started at midfield or the opponent's 25.
  // So depth/direction become the heat drawn ON one field diagram, and
  // field position becomes SMALL MULTIPLES: two or three same-shape field
  // diagrams side by side (one per field-position bin), each just showing
  // where that situation actually happens on a real field. Passing has no
  // field-position axis at all (its two axes are location and depth, both
  // spatial), so it gets one full diagram with both plotted directly.
  //
  // Every diagram shares ONE coordinate system (FIELD_VB_W/H) regardless
  // of how many sit in a row -- this is what keeps two players' charts
  // (and, within one player, the red zone/midfield/backed up panels)
  // pixel-for-pixel comparable, the same guarantee the old fixed grid made.
  // Portrait, not landscape: depth (where a target/carry happens relative
  // to the LOS) is the data's long axis, so it gets the long axis of the
  // diagram. The old landscape field spanned the full 100-yard length of
  // a real field, but every band this data actually covers (-6 to 34 yd
  // off the LOS) lived inside one ~40-yard slice of it -- the rest was
  // green nobody's usage ever touched. This window crops to that slice
  // (with a little padding) instead of the whole field, and the LOS sits
  // at a FIXED spot near the bottom of every panel -- it's not placed at
  // yardline100's real position on a 100-yard field anymore, since that's
  // exactly the placement that wasted the space. yardline100 still does
  // one job: if the opponent's goal line falls inside this window (i.e.
  // the red-zone panel), it's drawn, because "you can't target 20 yards
  // downfield from your own 10" is a real constraint worth showing.
  const FIELD_DEPTH_MIN_YD = -10, FIELD_DEPTH_MAX_YD = 36;
  const FIELD_DEPTH_SPAN_YD = FIELD_DEPTH_MAX_YD - FIELD_DEPTH_MIN_YD;
  const FIELD_VB_W = 170, FIELD_VB_H = 300;
  const FIELD_LABEL_GUTTER = 24;                       // left strip for yard-marker numbers, "up the side"
  const FIELD_PLAY_W = FIELD_VB_W - FIELD_LABEL_GUTTER; // sideline-to-sideline width of the green
  const FIELD_TOP_MARGIN = 8, FIELD_BOTTOM_MARGIN = 8;
  const FIELD_PLAY_H = FIELD_VB_H - FIELD_TOP_MARGIN - FIELD_BOTTOM_MARGIN;
  const FIELD_PX_PER_YARD = FIELD_PLAY_H / FIELD_DEPTH_SPAN_YD;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // Yards-relative-to-LOS -> SVG y. LOS sits near the bottom; positive
  // (downfield) runs up, matching how depth actually reads.
  function depthYdToY(yd) {
    return (FIELD_VB_H - FIELD_BOTTOM_MARGIN) - (yd - FIELD_DEPTH_MIN_YD) * FIELD_PX_PER_YARD;
  }
  const LOS_Y = depthYdToY(0);

  // Representative yardline_100 (distance from the OPPONENT's end zone) for
  // each field-position small multiple -- a single fixed, recognizable
  // point inside that bin's real range (src/usage.py's HEATMAP_FIELD_POS_
  // BINS: red_zone <=20, midfield 20-50, backfield >50), NOT a computed
  // average. It exists only to place the line of scrimmage somewhere a
  // viewer immediately reads as "this is the red zone one" -- the real
  // data is the heat shading drawn around it, same as every other display
  // anchor in this pipeline (e.g. RADAR_METRICS's axis choices).
  const HEATMAP_FIELD_POS_PANELS = [
    { key: 'red_zone', label: 'Red Zone', yardline100: 10 },
    { key: 'midfield', label: 'Midfield', yardline100: 50 },
    { key: 'backfield', label: 'Backed Up', yardline100: 80 },
  ];

  // Depth bands in yards relative to the LOS (negative = behind it) --
  // boundaries mirror src/usage.py's HEATMAP_DEPTH_BINS exactly (0/10/20).
  // behind_los has no real lower bound in the data (it's "anything behind
  // the LOS"); deep has no real upper bound ("20+") -- both are capped
  // here purely for a sane band width to draw, not a claim about the data.
  const HEATMAP_DEPTH_BANDS = [
    { key: 'behind_los', label: 'Behind LOS', fromYd: -6, toYd: 0 },
    { key: 'short', label: 'Short', fromYd: 0, toYd: 10 },
    { key: 'intermediate', label: 'Intermediate', fromYd: 10, toYd: 20 },
    { key: 'deep', label: 'Deep', fromYd: 20, toYd: 34 },
  ];

  // Direction lanes, mapped to horizontal thirds of the field's width (top
  // = the offense's own left, since run_location/pass_location in the raw
  // pbp data are recorded from the OFFENSE's own perspective facing the
  // defense -- an arbitrary but fixed, documented convention, the same
  // kind of choice PROJECT_CONTEXT.md's spread_line sign note already is.
  const HEATMAP_DIRECTION_LANES = [
    { key: 'left', label: 'Left' },
    { key: 'middle', label: 'Middle' },
    { key: 'right', label: 'Right' },
  ];

  // 3-stop lerp matching the .legend-bar gradient (rgba(255,255,255,0.1)
  // -> #fbbf24 -> #ef4444) exactly, so the legend swatch and the zones it
  // describes always mean the same thing. t is a zone's share relative to
  // its group's OWN highest share (not an absolute scale) -- the most-used
  // zone for THIS player is always the hottest one, the same way a real
  // usage map should read regardless of whether this player is high- or
  // low-volume overall.
  function heatCellColor(t) {
    const stops = [[255, 255, 255, 0.12], [251, 191, 36, 0.55], [239, 68, 68, 0.85]];
    const seg = t < 0.5 ? 0 : 1;
    const localT = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5;
    const a = stops[seg], b = stops[seg + 1];
    const lerp = i => a[i] + (b[i] - a[i]) * localT;
    return `rgba(${Math.round(lerp(0))}, ${Math.round(lerp(1))}, ${Math.round(lerp(2))}, ${lerp(3).toFixed(2)})`;
  }

  function heatZoneTooltip(zone, kind) {
    return `${zone.label}: ${zone.count} play${zone.count === 1 ? '' : 's'} (${(zone.share * 100).toFixed(0)}% of this player's ${kind})${zone.sparse ? ' -- thin sample' : ''}`;
  }

  // Draws the field ITSELF -- green playing surface, yard-marker ticks up
  // the left side every 10 yards off the LOS, and the line of scrimmage as
  // a bold dashed marker fixed near the bottom. The opponent's end zone is
  // only drawn when yardline100 puts it inside this cropped window (i.e.
  // the red-zone small multiple) -- for midfield/backfield panels the real
  // goal line is 30+ yards outside anything this window shows, so nothing
  // is lost by leaving it off.
  function fieldBackgroundSvg(yardline100) {
    const left = FIELD_LABEL_GUTTER, top = FIELD_TOP_MARGIN;
    let svg = `<rect x="${left}" y="${top}" width="${FIELD_PLAY_W}" height="${FIELD_PLAY_H}" fill="#0d4f1c"/>`;

    if (yardline100 <= FIELD_DEPTH_MAX_YD) {
      const ezY = depthYdToY(yardline100);
      svg += `<rect x="${left}" y="${top}" width="${FIELD_PLAY_W}" height="${Math.max(ezY - top, 0)}" fill="#0a3814"/>`;
      svg += `<line x1="${left}" y1="${ezY}" x2="${left + FIELD_PLAY_W}" y2="${ezY}" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>`;
    }

    for (let yd = Math.ceil(FIELD_DEPTH_MIN_YD / 10) * 10; yd <= FIELD_DEPTH_MAX_YD; yd += 10) {
      if (yd === 0) continue; // the LOS line itself already marks zero
      const y = depthYdToY(yd);
      svg += `<line x1="${left}" y1="${y}" x2="${left + FIELD_PLAY_W}" y2="${y}" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>`;
      svg += `<text x="${left - 4}" y="${y + 3}" fill="rgba(255,255,255,0.55)" font-size="8" font-weight="700" text-anchor="end">${Math.abs(yd)}</text>`;
    }

    svg += `<rect x="${left + 0.5}" y="${top + 0.5}" width="${FIELD_PLAY_W - 1}" height="${FIELD_PLAY_H - 1}" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>`;

    svg += `<line x1="${left}" y1="${LOS_Y}" x2="${left + FIELD_PLAY_W}" y2="${LOS_Y}" stroke="#facc15" stroke-width="3" stroke-dasharray="6,3"/>`;
    // "LOS" lives in the gutter, not on the field -- the passing grid's
    // cells run edge to edge right up to the LOS line, so a label drawn
    // over the playing surface itself (as the old landscape design did,
    // safely, in a top margin no heat ever reached) could land on top of
    // a zone's own percentage. The gutter is never occupied by heat.
    svg += `<text x="${left - 4}" y="${LOS_Y + 3}" fill="#facc15" font-size="9" font-weight="800" text-anchor="end">LOS</text>`;
    return svg;
  }

  // Every overlay below double-encodes frequency -- SIZE as well as shade
  // (the design brief's "heat sized or shaded" taken as both, not an
  // either/or) -- because color alone doesn't survive being rendered at
  // small-multiple size: three panels side by side are each a third the
  // width the old single grid had, and a color-only difference between a
  // 6% cell and a 25% cell gets hard to see fast at that size. A SIZE
  // difference doesn't have that problem -- a band or bar that's visibly
  // bigger reads as "more" even in a thumbnail, which is the whole point
  // (see this section's own verification: Shakir's short/behind-LOS bands
  // should visibly loom over his sliver of a deep band, and vice versa for
  // a real deep threat, without reading a single percentage).
  const HEAT_MIN_SIZE_FRAC = 0.14; // a real-but-small zone still shows as a visible sliver, never truly invisible

  // Single-axis heat (depth only), for one field-position small multiple --
  // receivers have no direction data, so each depth band gets its own row
  // (fixed by the band's real yard boundaries), and how much of this
  // player's usage sits there is the bar's WIDTH, centered in that row. A
  // faint full-width track behind it marks where that depth range sits
  // even when unused. `maxShare` is passed in from the whole group (every
  // field-position panel combined) so size/color both mean the same thing
  // across all three panels, not just within one.
  //
  // Rows stack vertically now (one per depth band), so there's no more
  // "adjacent zones fighting for the same horizontal strip" -- that's what
  // caused labels to run together in the old landscape layout. A bar wide
  // enough gets its % centered inside it; a thin one (small share) gets its
  // label placed just outside it, still inside the same row, so it's never
  // ambiguous which zone it belongs to and it's never dropped.
  function depthHeatOverlaySvg(zoneByDepth, maxShare, kind) {
    const trackX = FIELD_LABEL_GUTTER + 3, fullW = FIELD_PLAY_W - 6;
    const midX = FIELD_LABEL_GUTTER + FIELD_PLAY_W / 2;
    const bottomEdge = FIELD_VB_H - FIELD_BOTTOM_MARGIN;
    let svg = '';
    HEATMAP_DEPTH_BANDS.forEach(band => {
      const yTop = clamp(depthYdToY(band.toYd), FIELD_TOP_MARGIN, bottomEdge);
      const yBot = clamp(depthYdToY(band.fromYd), FIELD_TOP_MARGIN, bottomEdge);
      const rowH = Math.max(yBot - yTop, 1);
      const rowMidY = (yTop + yBot) / 2;
      const zone = zoneByDepth[band.key];
      svg += `<rect x="${trackX}" y="${yTop}" width="${fullW}" height="${rowH}" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>`;
      if (!zone) return;
      const t = zone.share / maxShare;
      const w = fullW * (HEAT_MIN_SIZE_FRAC + (1 - HEAT_MIN_SIZE_FRAC) * t);
      const x = midX - w / 2;
      const fill = heatCellColor(t);
      const dash = zone.sparse ? ' stroke-dasharray="4,3"' : '';
      svg += `<rect x="${x}" y="${yTop + 2}" width="${w}" height="${Math.max(rowH - 4, 1)}" fill="${fill}" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"${dash}><title>${heatZoneTooltip(zone, kind)}</title></rect>`;
      const label = `${Math.round(zone.share * 100)}%`;
      if (w >= 30) {
        svg += `<text x="${midX}" y="${rowMidY + 5}" fill="white" font-size="13" font-weight="800" text-anchor="middle" pointer-events="none">${label}</text>`;
      } else {
        svg += `<text x="${x + w + 5}" y="${rowMidY + 4}" fill="rgba(255,255,255,0.95)" font-size="11" font-weight="800" text-anchor="start" pointer-events="none">${label}</text>`;
      }
      if (zone.sparse) {
        svg += `<text x="${trackX + 4}" y="${yTop + 10}" fill="rgba(255,255,255,0.9)" font-size="9" font-weight="800" text-anchor="start" pointer-events="none">~</text>`;
      }
    });
    return svg;
  }

  // Direction-only heat (left/middle/right lanes) for one field-position
  // small multiple -- rushing zones carry no depth data, so each lane is
  // drawn as a bar extending UPWARD from the LOS, LENGTH proportional to
  // share (not a fixed chunk shaded by color) -- an unused lane shows
  // almost no colored bar at all next to a heavily-used lane's long one,
  // the literal "gaps visible" this was built for. Lane POSITION (left =
  // left column, right = right column) stays fixed regardless of share --
  // direction is lateral, so it still maps to left-to-right, just now as
  // columns instead of stacked rows. Bar length is a display device (not a
  // real yardage), so its max is tuned to use a good chunk of this
  // portrait window's vertical room rather than the couple-yard cap that
  // made sense on the old landscape field.
  const RUSH_BAR_MIN_YARDS = 3, RUSH_BAR_MAX_YARDS = 24;
  function directionHeatOverlaySvg(zoneByDir, maxShare, kind) {
    const gutterInset = 3;
    const laneW = (FIELD_PLAY_W - gutterInset * 2) / HEATMAP_DIRECTION_LANES.length;
    const trackTop = clamp(depthYdToY(RUSH_BAR_MAX_YARDS), FIELD_TOP_MARGIN, LOS_Y);
    let svg = '';
    HEATMAP_DIRECTION_LANES.forEach((lane, i) => {
      const laneX = FIELD_LABEL_GUTTER + gutterInset + i * laneW;
      const barX = laneX + 3, barW = laneW - 6;
      const zone = zoneByDir[lane.key];
      svg += `<rect x="${barX}" y="${trackTop}" width="${barW}" height="${LOS_Y - trackTop}" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>`;
      if (!zone) return;
      const t = zone.share / maxShare;
      const barYd = RUSH_BAR_MIN_YARDS + (RUSH_BAR_MAX_YARDS - RUSH_BAR_MIN_YARDS) * t;
      const y1 = clamp(depthYdToY(barYd), FIELD_TOP_MARGIN, LOS_Y);
      const h = Math.max(LOS_Y - y1, 2);
      const fill = heatCellColor(t);
      const dash = zone.sparse ? ' stroke-dasharray="4,3"' : '';
      svg += `<rect x="${barX}" y="${y1}" width="${barW}" height="${h}" fill="${fill}" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"${dash}><title>${heatZoneTooltip(zone, kind)}</title></rect>`;
      const label = `${Math.round(zone.share * 100)}%`;
      const cx = barX + barW / 2;
      if (h >= 20) {
        svg += `<text x="${cx}" y="${y1 + h / 2 + 4}" fill="white" font-size="12" font-weight="800" text-anchor="middle" pointer-events="none">${label}</text>`;
      } else {
        svg += `<text x="${cx}" y="${y1 - 4}" fill="rgba(255,255,255,0.9)" font-size="11" font-weight="800" text-anchor="middle" pointer-events="none">${label}</text>`;
      }
      if (zone.sparse) {
        svg += `<text x="${cx}" y="${LOS_Y - 4}" fill="rgba(255,255,255,0.9)" font-size="10" font-weight="800" text-anchor="middle" pointer-events="none">~</text>`;
      }
    });
    return svg;
  }

  // Full 2-D heat (location x depth) on ONE diagram -- passing is the one
  // kind whose two real axes (direction AND depth) are both spatial, so it
  // never needed the field-position small-multiple treatment at all: one
  // field, one grid drawn directly on it -- now columns (left/middle/right)
  // by rows (depth bands, deepest at top). Position is fixed by the grid
  // (12 real cells, each a real location x depth combination), so size
  // here means each cell SHRINKS toward its center as share drops -- a
  // heavily-thrown zone fills its whole cell, a rarely-thrown one draws as
  // a small, faint square inside the same footprint.
  //
  // This is the one grid dense enough that a shrunk cell can genuinely run
  // out of room for inline text in BOTH dimensions at once (unlike the
  // depth/direction bars, which only ever shrink in one). When that
  // happens the label doesn't get centered in the shrunk swatch -- it gets
  // a fixed slot in the cell's own (unshrinking) corner instead, so a
  // small zone still gets a legible number rather than being dropped.
  function passingHeatOverlaySvg(zones, maxShare) {
    const zoneByKey = {};
    zones.forEach(z => { zoneByKey[z.id] = z; });
    const gutterInset = 3;
    const laneW = (FIELD_PLAY_W - gutterInset * 2) / HEATMAP_DIRECTION_LANES.length;
    const bottomEdge = FIELD_VB_H - FIELD_BOTTOM_MARGIN;
    let svg = '';
    HEATMAP_DIRECTION_LANES.forEach((lane, i) => {
      const cellX = FIELD_LABEL_GUTTER + gutterInset + i * laneW;
      HEATMAP_DEPTH_BANDS.forEach(band => {
        const yTop = clamp(depthYdToY(band.toYd), FIELD_TOP_MARGIN, bottomEdge);
        const yBot = clamp(depthYdToY(band.fromYd), FIELD_TOP_MARGIN, bottomEdge);
        const cw = laneW - 2, ch = Math.max(yBot - yTop - 2, 1);
        const cx = cellX + 1, cy = yTop + 1;
        const zone = zoneByKey[`${lane.key}|${band.key}`];
        svg += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>`;
        if (!zone) return;
        const t = zone.share / maxShare;
        const sizeFrac = HEAT_MIN_SIZE_FRAC + (1 - HEAT_MIN_SIZE_FRAC) * t;
        const rw = cw * sizeFrac, rh = ch * sizeFrac;
        const rx = cx + (cw - rw) / 2, ry = cy + (ch - rh) / 2;
        const fill = heatCellColor(t);
        const dash = zone.sparse ? ' stroke-dasharray="3,3"' : '';
        svg += `<rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="${fill}" stroke="rgba(255,255,255,0.6)" stroke-width="1"${dash}><title>${heatZoneTooltip(zone, 'passing')}</title></rect>`;
        const label = `${Math.round(zone.share * 100)}%`;
        if (rw >= 22 && rh >= 14) {
          svg += `<text x="${rx + rw / 2}" y="${ry + rh / 2 + 3.5}" fill="white" font-size="9.5" font-weight="800" text-anchor="middle" pointer-events="none">${label}</text>`;
        } else {
          svg += `<text x="${cx + cw - 2}" y="${cy + 8}" fill="rgba(255,255,255,0.95)" font-size="7.5" font-weight="800" text-anchor="end" pointer-events="none">${label}</text>`;
        }
        if (zone.sparse) {
          svg += `<text x="${cx + 2}" y="${cy + 8}" fill="rgba(255,255,255,0.9)" font-size="7.5" font-weight="800" text-anchor="start" pointer-events="none">~</text>`;
        }
      });
    });
    return svg;
  }

  // One <div class="field-container"><svg>...field diagram, wrapped with
  // an optional caption -- shared by both the small-multiple panels and
  // the single full-width passing diagram so they're built from the same
  // markup shape.
  function fieldPanelHtml(yardline100, overlaySvg, caption) {
    const bg = fieldBackgroundSvg(yardline100);
    return `
      <div class="field-multiple">
        ${caption ? `<div class="field-multiple-caption">${caption}</div>` : ''}
        <div class="field-container">
          <svg class="field-svg" viewBox="0 0 ${FIELD_VB_W} ${FIELD_VB_H}" xmlns="http://www.w3.org/2000/svg">${bg}${overlaySvg()}</svg>
        </div>
      </div>
    `;
  }

  // Builds one group's full field display -- 3 small multiples (by field
  // position) for receiving/rushing, or 1 full diagram for passing.
  function heatmapGroupFieldsHtml(group) {
    const maxShare = Math.max(...group.zones.map(z => z.share), 0.0001);

    if (group.kind === 'passing') {
      // One diagram, not a row of small multiples -- passing's two real
      // axes (location, depth) are both spatial already, so there's no
      // field-position dimension left to split into panels. field-multiples-
      // single caps its width instead of letting one portrait field stretch
      // to fill a whole row (which would make it absurdly tall).
      return `<div class="field-multiples field-multiples-single">${fieldPanelHtml(50, () => passingHeatOverlaySvg(group.zones, maxShare), null)}</div>`;
    }

    const zonesByFieldPos = {};
    group.zones.forEach(z => {
      const [axisA, fieldPos] = z.id.split('|');
      (zonesByFieldPos[fieldPos] ??= {})[axisA] = z;
    });

    return `
      <div class="field-multiples">
        ${HEATMAP_FIELD_POS_PANELS.map(panel => {
          const zoneByAxis = zonesByFieldPos[panel.key] || {};
          const panelPlays = Object.values(zoneByAxis).reduce((sum, z) => sum + z.count, 0);
          const overlay = group.kind === 'rushing'
            ? (() => directionHeatOverlaySvg(zoneByAxis, maxShare, group.kind))
            : (() => depthHeatOverlaySvg(zoneByAxis, maxShare, group.kind));
          const caption = `${panel.label}${panelPlays ? ` · ${panelPlays} play${panelPlays === 1 ? '' : 's'}` : ''}`;
          return fieldPanelHtml(panel.yardline100, overlay, caption);
        }).join('')}
      </div>
    `;
  }

  // Three states, same honesty pattern as renderPositionProfilePanel: a
  // missing `heatmap` key (an old export predating this feature) reads as
  // a generic placeholder; `heatmap.eligible === false` (too few games
  // this season) states the exact games_played/min_games the export
  // itself used; `heatmap.eligible === true` renders the real thing.
  // getHeatmapTitle() is unchanged -- already live, gives the per-position
  // title ("Route Tree", "Rushing Direction & Receiving", etc.).
  function renderFieldHeatmapPanel(p) {
    // Same reasoning as renderPositionProfilePanel's own K/DEF guard --
    // there is no field-position data for a kicker or a team defense unit,
    // and there never will be, so this drops the panel entirely rather
    // than showing "Awaiting field data" forever.
    if (p.position === 'K' || p.position === 'DEF') return '';
    const advanced = getAdvancedPlayer(p.player_id);
    const heatmap = advanced?.heatmap;

    if (!heatmap) {
      return `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">${getHeatmapTitle(p.position)}</div>
            <div class="panel-note">Real target/carry zones from play-by-play</div>
          </div>
          <div class="pd-placeholder">
            <div class="pd-placeholder-icon">🔥</div>
            <div class="pd-placeholder-title">Awaiting field data</div>
            <div class="pd-placeholder-text">
              Once <code>player_advanced_stats.json</code> covers this player, this panel will show real
              target/carry frequency by field zone, derived from play-by-play.
            </div>
          </div>
        </div>
      `;
    }

    if (!heatmap.eligible) {
      return `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">${getHeatmapTitle(p.position)}</div>
            <div class="panel-note">Real target/carry zones from play-by-play</div>
          </div>
          <div class="pd-placeholder">
            <div class="pd-placeholder-icon">🔥</div>
            <div class="pd-placeholder-title">Not enough games yet</div>
            <div class="pd-placeholder-text">
              ${heatmap.games_played} of ${heatmap.min_games} games played this season -- too few real plays yet
              to show a usage pattern rather than noise. Check back in a few weeks.
            </div>
          </div>
        </div>
      `;
    }

    const GROUP_TITLES = { receiving: 'Receiving', rushing: 'Rushing', passing: 'Passing' };
    const multiGroup = heatmap.groups.length > 1;

    return `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">${getHeatmapTitle(p.position)}</div>
          <div class="panel-note">Real target/carry zones from play-by-play</div>
        </div>
        ${heatmap.groups.map(g => `
          ${multiGroup ? `<div class="heatmap-group-title">${GROUP_TITLES[g.kind] || g.kind} · ${g.total_plays} plays</div>` : ''}
          ${heatmapGroupFieldsHtml(g)}
        `).join('')}
        <div class="field-legend">
          <span>Share of this player's ${multiGroup ? 'plays in each category' : heatmap.groups[0].kind}</span>
          <div class="legend-gradient">
            <span>Fewer</span><div class="legend-bar"></div><span>More</span>
          </div>
        </div>
        <div class="pd-placeholder-text" style="text-align: left; max-width: none; margin-top: 8px;">
          ~ marks a zone with fewer than ${heatmap.sparse_threshold} real plays this season -- shown, not hidden,
          but too thin a sample to read as a real tendency yet. Yellow dashed line is the line of scrimmage;
          each small field shows a different part of the field (red zone / midfield / backed up), same shape
          every time so this player's panels -- and two players' panels side by side -- stay comparable.
        </div>
      </div>
    `;
  }

  // Weekly xFP for one player in one season, keyed by week-as-string to
  // match the export's own {week_str: xfp} shape -- {} (not an error) if
  // the export hasn't loaded, predates this key, or doesn't cover this
  // player/season. Only valid for the CURRENTLY EXPORTED season (same
  // "don't show a stale number under a different week/season" rule
  // getMyProj() already follows) -- weekly_xfp is season-scoped inside
  // the export itself, so a mismatched season would silently mix data
  // from two different years onto one chart if this weren't gated.
  function getWeeklyXfp(playerId, season) {
    const advanced = state.advancedStats;
    if (!advanced || Number(advanced.meta?.season) !== Number(season)) return {};
    return advanced.players?.[playerId]?.weekly_xfp || {};
  }

  // ---- Phase 8 round 2: win probability + playoff odds (src/simulate.py) ----
  // Both numbers are rounded to whole percent by the export itself (see
  // src/export.py's build_matchup_simulation/build_playoff_odds) -- a
  // decimal would imply precision the underlying validation doesn't
  // support. The caveat text is read from the export's own
  // meta.simulation.*_caveat fields (falling back to the same wording if
  // an older export predates them) so this UI can never say something
  // the pipeline itself doesn't also say.
  function simulationCaveatText() {
    const sim = state.advancedStats?.simulation;
    const calibration = sim?.calibration_caveat
      || "Calibration was checked on ~2 independent seasons of historical matchups and playoff snapshots -- enough to catch a broken simulator, not enough to certify these exact numbers.";
    const accuracy = sim?.accuracy_caveat
      || "This does not out-pick a simple 'higher projected total wins' rule -- it agrees with that rule 93.6% of the time by construction. What it adds is the probability itself, not better picks.";
    return `${calibration} ${accuracy}`;
  }

  // True when the export's simulation block was generated for the
  // CURRENTLY DISPLAYED season and week -- shared by the win-probability/
  // playoff-odds getters below and their caveat footers in renderDashboard/
  // renderMatchupsView so all of them can never disagree about whether
  // real simulation numbers are actually showing.
  //
  // The season check closes a real gap found in a full-dashboard audit:
  // fetchAllRealData()'s previous_league_id fallback means the dashboard
  // can be displaying the PRIOR season (hasGames still false -- e.g. right
  // after a new draft, before any of that season's games are played)
  // while weekly-update.yml has already written a `simulation` block for
  // the NEW season's week 1. Before this check, that block's week-1
  // numbers would silently attach to the prior season's already-decided
  // week-1 matchups/standings just because the week numbers happen to
  // collide -- exactly the kind of stale-number-under-a-different-context
  // bug getMyProj() already guards against, just missed here originally.
  function simulationMatchesCurrentView() {
    const advanced = state.advancedStats;
    const sim = advanced?.simulation;
    if (!sim) return false;
    if (Number(advanced.meta?.season) !== Number(state.league?.season)) return false;
    return sim.week === state.selectedWeek;
  }

  // {home: pct, away: pct} for one matchup, or null. Only returns a value
  // when the export's simulation covers the CURRENTLY VIEWED season AND
  // week -- the export only ever holds one week's simulation at a time
  // (whichever week was upcoming when weekly-update.yml last ran), same
  // "never show a stale number under a different week" rule getMyProj()
  // follows. See simulationMatchesCurrentView() above for why the season
  // half of this check matters, not just the week half.
  function getMatchupWinProb(homeRosterId, awayRosterId) {
    if (!simulationMatchesCurrentView()) return null;
    const sim = state.advancedStats.simulation;
    const m = sim.matchups.find(x =>
      (x.roster_a === homeRosterId && x.roster_b === awayRosterId) ||
      (x.roster_a === awayRosterId && x.roster_b === homeRosterId)
    );
    if (!m) return null;
    const homeIsA = m.roster_a === homeRosterId;
    return { home: homeIsA ? m.win_prob_a : m.win_prob_b, away: homeIsA ? m.win_prob_b : m.win_prob_a };
  }

  // Whole-percent playoff-qualification odds for one roster, or null.
  // Gated on the same simulationMatchesCurrentView() check as win
  // probability above -- previously this checked neither season nor
  // week, just whether a playoff_odds entry existed for the roster id.
  // That was the same cross-season attachment risk getMatchupWinProb()
  // had, but worse: roster_id isn't even guaranteed to refer to the same
  // team across two different seasons' leagues, so a season mismatch
  // could silently show one team's odds under a completely different
  // team's row. The week half of the gate closes a second, same-season
  // staleness gap: simulate_season() computes these odds from the
  // standings AS OF simulation.week -- once real games have been played
  // past that week, the standings it simulated from are already out of
  // date, so showing the same number under a later selectedWeek would be
  // a stale number in the same way an out-of-date My Proj would be. This
  // does mean the column reads "--" for any week other than the one the
  // export covers, not just for a season mismatch -- a real behavior
  // change from the previous "always show the latest known odds"
  // version, traded for the same never-show-stale guarantee every other
  // projection on this dashboard already makes.
  function getPlayoffOdds(rosterId) {
    if (!simulationMatchesCurrentView()) return null;
    const pct = state.advancedStats.simulation.playoff_odds?.[String(rosterId)];
    return pct == null ? null : pct;
  }

  // Small always-visible win-probability readout for a matchup card --
  // used by both the Dashboard and Matchups view so the two can't drift.
  function winProbBadgeHtml(pct) {
    if (pct == null) return '';
    return `<span style="font-size: 11px; color: var(--text-muted); font-weight: 700; margin-left: 6px;" title="${simulationCaveatText()}">${pct}% sim</span>`;
  }

  // Cache player database in memory (5MB JSON) — too big for localStorage in some browsers
  let _playerDbCache = null;
  async function fetchPlayerDatabase() {
    if (_playerDbCache) return _playerDbCache;
    _playerDbCache = await fetchJSON(`${API}/players/nfl`);
    return _playerDbCache;
  }

  // Map Sleeper player DB + rosters into our internal player format
  function mapSleeperPlayers(playerDb, rosters) {
    const ownership = {};
    rosters.forEach(r => {
      (r.players || []).forEach(pid => { ownership[pid] = r.roster_id; });
    });

    const result = [];
    Object.values(playerDb).forEach(p => {
      if (!p || !p.player_id) return;
      // Filter to skill positions only
      if (!['QB','RB','WR','TE','K','DEF'].includes(p.position)) return;
      const ownerRosterId = ownership[p.player_id] || null;
      // For free-agent flooding control: only include rostered players +
      // active free agents. Team defenses never carry a `status` (Sleeper
      // has no injury-style status for a team unit -- verified directly:
      // all 32 real DEF entries have status: null, active: true) -- so
      // `active === true` counts as the same "usable free agent" signal
      // `status === 'Active'` is for real players, rather than silently
      // dropping every DEF entry pre-draft when nothing is rostered yet.
      if (!ownerRosterId && p.status !== 'Active' && p.active !== true) return;

      result.push({
        player_id: p.player_id,
        name: p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || 'Unknown',
        position: p.position,
        team: p.team || 'FA',
        seasonAvg: 0,    // computed in Sprint 5 (or post-load enrichment)
        totalPts: 0,
        weeks: [],
        injuryStatus: mapInjuryStatus(p.injury_status),
        injuryStatusRaw: p.injury_status || null, // preserve the original for tooltips
        injuryType: p.injury_body_part || null,
        injuryNews: p.injury_notes || null,
        // Raw ISO date and formatted "Sep 12" version. Raw is used for sorting
        // and time-since calculations; formatted is for display in cards.
        injuryStartDateRaw: p.injury_start_date || null,
        injuryUpdated: p.injury_start_date ? formatInjuryDate(p.injury_start_date) : null,
        isElite: false,
        ownerRosterId
      });
    });
    return result;
  }

  function mapInjuryStatus(status) {
    if (!status) return null;
    const upper = status.toUpperCase();
    if (upper.includes('IR')) return 'IR';
    if (upper === 'OUT') return 'O';
    if (upper === 'DOUBTFUL') return 'D';
    if (upper === 'QUESTIONABLE') return 'Q';
    if (upper === 'PUP') return 'PUP';   // physically-unable-to-perform
    if (upper === 'NA' || upper === 'INACTIVE') return 'NA';
    if (upper.includes('SUSP')) return 'SUSP';
    return null;
  }

  function formatInjuryDate(iso) {
    // Sleeper format: "YYYY-MM-DD"
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    if (!m) return iso;
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[+m[2] - 1]} ${+m[3]}`;
  }

  function mapSleeperTransactions(txns, users, rosters, playerDb) {
    const out = [];
    const getName = (rosterId) => {
      const r = rosters.find(x => x.roster_id === rosterId);
      const u = r ? users.find(x => x.user_id === r.owner_id) : null;
      return u?.metadata?.team_name || u?.display_name || `Team ${rosterId}`;
    };
    const getPlayerName = (pid) => playerDb[pid]?.full_name || playerDb[pid]?.last_name || `Player ${pid}`;
    const formatTime = (ts) => {
      if (!ts) return '';
      const diff = Date.now() - ts;
      const hours = Math.floor(diff / 3600000);
      if (hours < 1) return 'Just now';
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    };

    txns.forEach(t => {
      if (t.status !== 'complete') return;
      const time = formatTime(t.status_updated || t.created);
      if (t.type === 'trade') {
        const teamNames = (t.roster_ids || []).map(getName).join(' ↔ ');
        const adds = Object.entries(t.adds || {});
        const detail = adds.length
          ? adds.map(([pid, rid]) => `${getPlayerName(pid)} → ${getName(rid)}`).join(', ')
          : 'See trade details';
        out.push({ type: 'trade', time, desc: teamNames, detail });
      } else if (t.type === 'waiver' || t.type === 'free_agent') {
        const adds = Object.entries(t.adds || {});
        const drops = Object.entries(t.drops || {});
        if (adds.length > 0) {
          const [addPid, addRid] = adds[0];
          const dropDetail = drops.length ? `Dropped: ${getPlayerName(drops[0][0])}` : 'No drop';
          const faab = t.settings?.waiver_bid ? ` · ${t.settings.waiver_bid} FAAB` : '';
          out.push({
            type: 'waiver',
            time,
            desc: `${getName(addRid)} added ${getPlayerName(addPid)}`,
            detail: `${dropDetail}${faab}`
          });
        } else if (drops.length > 0) {
          const [dropPid, dropRid] = drops[0];
          out.push({
            type: 'drop',
            time,
            desc: `${getName(dropRid)} dropped ${getPlayerName(dropPid)}`,
            detail: 'No replacement claim'
          });
        }
      }
    });
    return out;
  }

  // ESPN NFL scoreboard → our format.
  // Optional `opts` lets the sidebar dropdown explicitly request a specific
  // {seasontype, week, year}. With no opts we auto-detect: try the current
  // scoreboard, fall back to most recent completed-season playoffs/Week 18.
  // Always returns { games, weekInfo } where weekInfo contains
  // { label, year, seasontype, week, isHistorical } for the dropdown to read.
  async function fetchNFLGames(opts) {
    let espn;
    let weekInfo = { label: '', year: null, seasontype: null, week: null, isHistorical: false };

    // ----- Path A: caller supplied explicit (seasontype, week, year) -----
    if (opts && opts.seasontype && opts.week && opts.year) {
      const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=${opts.seasontype}&week=${opts.week}&year=${opts.year}`;
      try {
        espn = await fetchJSON(url);
      } catch (e) {
        console.warn('ESPN explicit scoreboard fetch failed:', e);
        return { games: [], weekInfo };
      }
      weekInfo.year = opts.year;
      weekInfo.seasontype = opts.seasontype;
      weekInfo.week = opts.week;
      // Historical iff explicit year is older than current calendar year, OR the
      // games are flagged final. We mostly use this to skip weather enrichment.
      const nowYear = new Date().getFullYear();
      weekInfo.isHistorical = opts.year < nowYear;
      weekInfo.label = buildNFLWeekLabel(opts.seasontype, opts.week, opts.year);
    } else {
      // ----- Path B: auto-detect (original behavior) -----
      try {
        espn = await fetchJSON('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
      } catch (e) {
        console.warn('ESPN current scoreboard failed:', e);
        return { games: [], weekInfo };
      }

      // Detect deep offseason / preseason-only / far-future. This used to
      // walk back and silently substitute the most recently COMPLETED
      // season's playoffs here -- correct before the season selector
      // existed (there was only ever "today," so showing something was
      // better than nothing). Now that a specific live season can be
      // explicitly selected, silently showing a DIFFERENT year's games
      // under this season's header is exactly the mixed-season
      // incoherence the selector exists to prevent (real bug: with 2026
      // selected pre-draft, this used to show "2025 Super Bowl"). Say so
      // plainly instead -- renderSidebar()'s own noRegularSeasonYet branch
      // shows an honest placeholder, the same pattern already used for an
      // archived season. Preseason games are real (verified live: real
      // NFL preseason games are actually being played the week this was
      // fixed) but deliberately excluded, not just unavailable -- unsettled
      // rosters and backups playing significant snaps make preseason
      // results not fantasy-relevant, the same reasoning this project
      // already applies to K/DST.
      const isPreseasonOnly = espn.season?.type === 1;
      const hasEvents = espn.events && espn.events.length > 0;
      const firstEvent = hasEvents ? new Date(espn.events[0].date) : null;
      const daysUntilFirst = firstEvent ? (firstEvent.getTime() - Date.now()) / (1000 * 60 * 60 * 24) : 0;
      const isFarFuture = daysUntilFirst > 30;

      if (!hasEvents || isPreseasonOnly || isFarFuture) {
        weekInfo.year = espn.season?.year || null;
        weekInfo.seasontype = espn.season?.type || null;
        weekInfo.week = espn.week?.number || null;
        weekInfo.label = "Regular season hasn't started";
        weekInfo.noRegularSeasonYet = true;
        return { games: [], weekInfo };
      } else {
        // Live current scoreboard — pull info from ESPN's metadata
        weekInfo.year = espn.season?.year || null;
        weekInfo.seasontype = espn.season?.type || null;
        weekInfo.week = espn.week?.number || null;
      }

      if (!weekInfo.label) {
        const typeLabels = { 1: 'Preseason', 2: 'Wk', 3: 'Playoffs' };
        const t = typeLabels[espn.season?.type] || 'Wk';
        const w = espn.week?.number || '—';
        weekInfo.label = `${t} ${w}`;
      }
    }

    const games = (espn.events || []).map(e => {
      const comp = e.competitions?.[0];
      if (!comp) return null;
      const home = comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors.find(c => c.homeAway === 'away');
      const status = e.status?.type?.state || 'pre';
      const statusKey = status === 'in' ? 'live' : status === 'post' ? 'final' : 'pre';
      const venue = comp.venue?.fullName || '';
      const date = new Date(e.date);
      const time = date.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' }) + ' ET';
      return {
        id: e.id,
        away: {
          abbr: away.team.abbreviation,
          name: away.team.shortDisplayName,
          record: away.records?.[0]?.summary || '',
          logo: away.team.logo || '',
          color: away.team.color ? `#${away.team.color}` : '',
          altColor: away.team.alternateColor ? `#${away.team.alternateColor}` : ''
        },
        home: {
          abbr: home.team.abbreviation,
          name: home.team.shortDisplayName,
          record: home.records?.[0]?.summary || '',
          logo: home.team.logo || '',
          color: home.team.color ? `#${home.team.color}` : '',
          altColor: home.team.alternateColor ? `#${home.team.alternateColor}` : ''
        },
        awayScore: parseInt(away.score) || 0,
        homeScore: parseInt(home.score) || 0,
        status: statusKey,
        clock: statusKey === 'final' ? 'FINAL' : statusKey === 'live' ? `Q${e.status.period} ${e.status.displayClock}` : time,
        time, venue,
        gameDate: date,
        homeTeamAbbr: home.team.abbreviation,
        weather: null,
        stats: null,
        scoring: []
      };
    }).filter(Boolean);

    // Enrich each game with weather + box stats + scoring summary, all in
    // parallel. Past-season games use the Open-Meteo archive API for real
    // historical weather; current/upcoming games use the forecast API.
    // ESPN's summary endpoint gives us team box stats and scoring plays.
    await Promise.all(games.map(async g => {
      const [weather, detail] = await Promise.all([
        weekInfo.isHistorical
          ? fetchHistoricalWeather(g.homeTeamAbbr, g.gameDate)
          : fetchStadiumWeather(g.homeTeamAbbr, g.gameDate),
        fetchGameDetail(g.id, g.away.abbr, g.home.abbr)
      ]);
      g.weather = weather;
      g.stats = detail.stats;
      g.scoring = detail.scoring;
      g.boxScore = detail.boxScore;
      g.playerStats = detail.playerStats;
    }));

    return { games, weekInfo };
  }

  // Build a human-readable label for an arbitrary (seasontype, week, year).
  // seasontype: 1=Preseason, 2=Regular, 3=Postseason. Postseason week labels:
  // 1=Wild Card, 2=Divisional, 3=Conference, 5=Super Bowl (ESPN skips week 4).
  function buildNFLWeekLabel(seasontype, week, year) {
    if (seasontype === 3) {
      const playoffNames = { 1: 'Wild Card', 2: 'Divisional', 3: 'Conf Champ', 5: 'Super Bowl' };
      const name = playoffNames[week] || `Playoff Wk ${week}`;
      return `${year} ${name}`;
    }
    if (seasontype === 1) return `${year} Preseason Wk ${week}`;
    return `${year} Week ${week}`;
  }

  // ============================================
  // OPEN-METEO WEATHER INTEGRATION
  // No API key required, no registration, CORS-enabled, free up to 10K/day
  // Docs: https://open-meteo.com/en/docs
  // ============================================
  // NFL stadium coordinates + dome status (lat, lon, isDome)
  const NFL_STADIUMS = {
    ARI: { lat: 33.5276, lon: -112.2626, dome: true,  name: 'State Farm Stadium' },
    ATL: { lat: 33.7553, lon: -84.4006,  dome: true,  name: 'Mercedes-Benz Stadium' },
    BAL: { lat: 39.2780, lon: -76.6227,  dome: false, name: 'M&T Bank Stadium' },
    BUF: { lat: 42.7738, lon: -78.7867,  dome: false, name: 'Highmark Stadium' },
    CAR: { lat: 35.2258, lon: -80.8528,  dome: false, name: 'Bank of America Stadium' },
    CHI: { lat: 41.8623, lon: -87.6167,  dome: false, name: 'Soldier Field' },
    CIN: { lat: 39.0954, lon: -84.5160,  dome: false, name: 'Paycor Stadium' },
    CLE: { lat: 41.5061, lon: -81.6995,  dome: false, name: 'Cleveland Browns Stadium' },
    DAL: { lat: 32.7473, lon: -97.0945,  dome: true,  name: 'AT&T Stadium' },
    DEN: { lat: 39.7439, lon: -105.0201, dome: false, name: 'Empower Field at Mile High' },
