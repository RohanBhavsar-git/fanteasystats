  // ----- INJURY REPORT VIEW -----
  function renderInjuryView(main) {
    const f = state.injuryFilter;

    // Pull every player with an active injury status from the league's
    // shared player DB (state.players).
    let injured = state.players.filter(p => p.injuryStatus);

    // ---- Filters ----
    if (f.status !== 'ALL') injured = injured.filter(p => p.injuryStatus === f.status);
    if (f.position !== 'ALL') injured = injured.filter(p => p.position === f.position);
    if (f.owner === 'FA') injured = injured.filter(p => p.ownerRosterId === null);
    else if (f.owner === 'ROSTERED') injured = injured.filter(p => p.ownerRosterId !== null);
    else if (f.owner !== 'ALL') injured = injured.filter(p => p.ownerRosterId === parseInt(f.owner));

    // Status group order — most severe first
    const STATUS_LABELS = {
      IR:   'Injured Reserve',
      O:    'Out',
      D:    'Doubtful',
      Q:    'Questionable',
      PUP:  'PUP List',
      NA:   'Inactive',
      SUSP: 'Suspended'
    };
    const STATUS_ORDER = ['IR','O','D','Q','PUP','NA','SUSP'];

    const grouped = {};
    STATUS_ORDER.forEach(s => { grouped[s] = []; });
    injured.forEach(p => { if (grouped[p.injuryStatus]) grouped[p.injuryStatus].push(p); });

    // ---- High-level stats (unfiltered population) ----
    const allInjured = state.players.filter(p => p.injuryStatus);
    const totalCount = allInjured.length;
    const irOutCount = allInjured.filter(p => p.injuryStatus === 'IR' || p.injuryStatus === 'O').length;
    const rosteredCount = allInjured.filter(p => p.ownerRosterId).length;

    const positionCounts = {};
    allInjured.forEach(p => {
      if (p.position) positionCounts[p.position] = (positionCounts[p.position] || 0) + 1;
    });
    const mostAffectedPos = Object.entries(positionCounts).sort((a, b) => b[1] - a[1])[0];

    // ---- Estimated absence based on injury_status ----
    // Sleeper's public data has NO official return date — even Sleeper's app
    // shows status badges, not return dates. NFL conventions: IR has a
    // 4-game minimum, PUP also 4+ weeks, "Out" is this-game only, "D" is
    // likely-out-this-game, "Q" is game-time-decision. These are league
    // norms — the actual return depends on injury severity which Sleeper
    // doesn't expose, so we present these as ranges, not certainties.
    function estimateAbsence(status) {
      switch (status) {
        case 'IR':   return { short: '4+ wks',  long: 'Minimum 4 weeks (IR rule)', tone: 'critical' };
        case 'O':    return { short: 'This wk', long: 'Out this week',             tone: 'severe'   };
        case 'D':    return { short: 'Doubtful',long: 'Likely out this week',      tone: 'severe'   };
        case 'Q':    return { short: 'GTD',     long: 'Game-time decision',        tone: 'caution'  };
        case 'PUP':  return { short: '4+ wks',  long: 'Minimum 4 weeks (PUP rule)',tone: 'critical' };
        case 'NA':   return { short: 'Inactive',long: 'Currently inactive',        tone: 'severe'   };
        case 'SUSP': return { short: 'Susp.',   long: 'Suspended',                 tone: 'severe'   };
        default:     return { short: '—',       long: '',                          tone: '' };
      }
    }

    // Time-since helper — formats e.g. "Today", "2 days ago", "1 month ago"
    function timeSince(isoDate) {
      if (!isoDate) return '';
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(isoDate);
      if (!m) return '';
      const then = new Date(`${m[1]}-${m[2]}-${m[3]}T12:00:00Z`);
      const diffMs = Date.now() - then.getTime();
      const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      if (days < 0) return '';
      if (days === 0) return 'Today';
      if (days === 1) return '1 day ago';
      if (days < 7) return `${days} days ago`;
      const weeks = Math.floor(days / 7);
      if (weeks === 1) return '1 week ago';
      if (weeks < 5) return `${weeks} weeks ago`;
      const months = Math.floor(days / 30);
      if (months === 1) return '1 month ago';
      return `${months} months ago`;
    }

    // ---- Avatar helper (used by both table rows and news items) ----
    function avatarSrc(p, fallback = false) {
      if (p.position === 'DEF') {
        return `https://a.espncdn.com/i/teamlogos/nfl/500/${(p.team || '').toLowerCase()}.png`;
      }
      return fallback
        ? `https://a.espncdn.com/i/teamlogos/nfl/500/${(p.team || '').toLowerCase()}.png`
        : `https://sleepercdn.com/content/nfl/players/thumb/${p.player_id}.jpg`;
    }
    function avatarHtml(p, size = 32) {
      const headshot = avatarSrc(p, false);
      const fallback = avatarSrc(p, true);
      const initials = getInitials(p.name);
      return `<img src="${headshot}"
        onerror="this.onerror=null; this.src='${fallback}'; this.onerror=function(){this.style.display='none'; this.parentElement.textContent='${initials}';}"
        alt="${p.name}">`;
    }

    // ---- Render one row in the main injury table ----
    function renderRow(p) {
      const ownerName = p.ownerRosterId ? getTeamName(p.ownerRosterId) : 'Free Agent';
      const ownerCls = p.ownerRosterId ? '' : 'fa';
      const injuryDetail = p.injuryType || 'Undisclosed';
      const updated = p.injuryUpdated ? ` · <span title="Injury start date">${p.injuryUpdated}</span>` : '';
      const est = estimateAbsence(p.injuryStatus);
      return `
        <tr data-player-id="${p.player_id}">
          <td>
            <div class="ij-player-cell">
              <div class="ij-avatar">${avatarHtml(p)}</div>
              <div>
                <div class="ij-name">${p.name}</div>
                <div class="ij-meta">${p.team || 'FA'} · ${p.position}</div>
              </div>
            </div>
          </td>
          <td><span class="ij-status ${p.injuryStatus}">${p.injuryStatus}</span></td>
          <td class="ij-detail"><strong>${injuryDetail}</strong>${updated}</td>
          <td><span class="ij-return ${est.tone}" title="${est.long}">${est.short}</span></td>
          <td class="ij-owner ${ownerCls}">${ownerName}</td>
        </tr>
      `;
    }

    // ---- Build the table body, grouped by status with divider rows ----
    let tableBodyHtml = '';
    if (injured.length === 0) {
      tableBodyHtml = `
        <tr><td colspan="5" style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
          <div style="font-size: 32px; margin-bottom: 8px;">💪</div>
          <strong style="color: var(--text-secondary);">No injuries match your filters</strong>
          <div style="font-size: 12px; margin-top: 4px;">Try adjusting the filters above.</div>
        </td></tr>
      `;
    } else {
      STATUS_ORDER.forEach(status => {
        const list = grouped[status];
        if (!list.length) return;
        // Group divider row
        tableBodyHtml += `
          <tr><td colspan="5" style="padding: 0;">
            <div class="injury-group-divider">
              <span>${STATUS_LABELS[status]}</span>
              <span class="group-count">${list.length} player${list.length === 1 ? '' : 's'}</span>
            </div>
          </td></tr>
        `;
        // Sort: rostered first, then alphabetical
        list
          .slice()
          .sort((a, b) => {
            if ((a.ownerRosterId == null) !== (b.ownerRosterId == null)) {
              return a.ownerRosterId == null ? 1 : -1;
            }
            return a.name.localeCompare(b.name);
          })
          .forEach(p => { tableBodyHtml += renderRow(p); });
      });
    }

    // ---- This Week's Lineup Risks ----
    // For every roster, walk its projected starters for the chosen week and
    // flag any with an active injury status. Severity scoring:
    //   IR/O      = 3 (definite zero — needs to be benched)
    //   D         = 2 (likely zero — strongly consider benching)
    //   Q/PUP/NA  = 1 (game-time decision — monitor)
    //   SUSP      = 3 (won't play)
    const RISK_SEVERITY = { IR: 3, O: 3, D: 2, Q: 1, PUP: 1, NA: 1, SUSP: 3 };

    // Play-probability by injury designation.
    //
    // Q/D/O are now MEASURED, not guessed: real play rate (a real
    // weekly-stats row that week, vs. none) for every real QB/RB/WR/TE/K
    // report_status entry, nflreadpy's load_injuries() REG season
    // 2009-2025 (27,778 real report rows; see PROJECT_CONTEXT.md's
    // Practice Report findings and notebooks/08_practice_report.ipynb for
    // the full methodology). These replace an earlier hand-picked
    // heuristic (~75%/~25%/0%) that predated this data existing — the
    // Questionable number in particular moved a lot (75% -> 57%), and it's
    // still a LEAGUE-WIDE AVERAGE, not this specific player's odds (real
    // probability still depends on body part, practice participation, and
    // time of week, none of which this alone captures) — every tooltip
    // below says so explicitly, plus the real sample size behind it.
    //
    // IR/PUP/NA/SUSP are deliberately NOT touched — nflverse's weekly
    // report has no equivalent concept at all (report_status is only ever
    // Questionable/Doubtful/Out/Probable; IR/PUP/suspension are roster-
    // level designations the weekly practice report never carries), so
    // there's no real rate to measure here the way there was for Q/D/O.
    // Their 0% reflects an actual NFL rule/mechanism (IR's 4-game minimum,
    // PUP's practice/play restriction, a suspension's formal
    // ineligibility) rather than an estimate — more data wouldn't refine a
    // rule, so these stay exactly as they were.
    function playProbability(status) {
      switch (status) {
        case 'Q':    return { pct: 57, label: '~57%', tone: 'caution',  tip: 'Questionable: measured play rate is ~57% (7,180 real player-weeks, 2009-2025) — a league-wide average, not this player\'s own odds. Watch inactives ~90 min pre-kickoff.' };
        case 'D':    return { pct: 1,  label: '~1%',  tone: 'severe',   tip: 'Doubtful: measured play rate is ~1% (1,057 real player-weeks, 2009-2025) — historically almost never plays. Bench.' };
        case 'O':    return { pct: 0,  label: '0%',   tone: 'severe',   tip: 'Out: measured play rate is ~0.1% (5,161 real player-weeks, 2009-2025) — ruled out for this game, essentially never plays anyway.' };
        case 'IR':   return { pct: 0,  label: '0%',   tone: 'critical', tip: 'Injured Reserve: out at least 4 games by NFL rule. Cannot play.' };
        case 'PUP':  return { pct: 0,  label: '0%',   tone: 'critical', tip: 'PUP list: cannot practice or play until activated.' };
        case 'NA':   return { pct: 0,  label: '0%',   tone: 'severe',   tip: 'Inactive: declared inactive for this game.' };
        case 'SUSP': return { pct: 0,  label: '0%',   tone: 'severe',   tip: 'Suspended: ineligible to play by league rule.' };
        default:     return { pct: 100,label: '100%', tone: '',         tip: '' };
      }
    }

    const riskWeek = state.injuryRiskWeek || state.currentWeek || 0;
    const riskWeekMatchups = state.weeklyMatchups[riskWeek] || [];
    const availableWeeks = getAvailableWeeks();

    const riskByTeam = state.rosters.map(roster => {
      const matchup = riskWeekMatchups.find(m =>
        m.home === roster.roster_id || m.away === roster.roster_id
      );
      // buildLineupForRoster gives us {starters: [{slot, player, weekPts}], bench: [...]}
      const lineup = buildLineupForRoster(roster.roster_id, matchup);
      const atRiskStarters = lineup.starters
        .map(s => s.player)
        .filter(p => p && p.injuryStatus)
        .map(p => ({
          ...p,
          severity: RISK_SEVERITY[p.injuryStatus] || 0,
          playProb: playProbability(p.injuryStatus)
        }))
        .sort((a, b) => b.severity - a.severity);

      // Total severity score for the team
      const totalSeverity = atRiskStarters.reduce((s, p) => s + p.severity, 0);

      return {
        rosterId: roster.roster_id,
        teamName: getTeamName(roster.roster_id),
        ownerHandle: getOwnerHandle(roster.roster_id),
        atRiskStarters,
        totalSeverity
      };
    })
      // Only show teams with at least one at-risk starter
      .filter(t => t.atRiskStarters.length > 0)
      // Highest-severity teams first (most at-risk lineups bubble up)
      .sort((a, b) => b.totalSeverity - a.totalSeverity);

    // League-wide tallies for the panel header
    const totalRiskCount = riskByTeam.reduce((s, t) => s + t.atRiskStarters.length, 0);
    const totalHighRiskCount = riskByTeam.reduce(
      (s, t) => s + t.atRiskStarters.filter(p => p.severity >= 2).length, 0
    );

    let riskHtml = '';
    if (riskByTeam.length === 0) {
      riskHtml = `
        <div class="lineup-risk-empty">
          <div style="font-size: 28px; margin-bottom: 6px;">✅</div>
          <strong style="color: var(--text-secondary);">All starters healthy</strong>
          <div style="font-size: 12px; margin-top: 4px;">No injury concerns in any team's projected starting lineup for week ${riskWeek}.</div>
        </div>
      `;
    } else {
      riskHtml = riskByTeam.map(team => {
        const playersHtml = team.atRiskStarters.map(p => `
          <div class="lineup-risk-player" data-player-id="${p.player_id}">
            <div class="lineup-risk-avatar">${avatarHtml(p)}</div>
            <div class="lineup-risk-info">
              <div class="lineup-risk-name">${p.name}</div>
              <div class="lineup-risk-meta">
                <span class="pos-pill pos-${p.position}">${p.position}</span>
                ${p.team || 'FA'} · ${p.injuryType || 'Undisclosed'}
              </div>
            </div>
            <div class="lineup-risk-right">
              <span class="ij-status ${p.injuryStatus}">${p.injuryStatus}</span>
              <span class="play-prob ${p.playProb.tone}" title="${p.playProb.tip}">${p.playProb.label}</span>
            </div>
          </div>
        `).join('');
        return `
          <div class="lineup-risk-team">
            <div class="lineup-risk-team-header">
              <div class="lineup-risk-team-name">${team.teamName}</div>
              <div class="lineup-risk-team-count">${team.atRiskStarters.length} starter${team.atRiskStarters.length === 1 ? '' : 's'}</div>
            </div>
            <div class="lineup-risk-players">${playersHtml}</div>
          </div>
        `;
      }).join('');
    }

    main.innerHTML = `
      <div class="page-header-row">
        <div>
          <div class="page-title">Injury Report</div>
          <div class="page-subtitle">${totalCount} players league-wide · Live from Sleeper's injury feed</div>
        </div>
      </div>

      <div class="injury-stat-grid">
        <div class="injury-stat-card">
          <div class="injury-stat-icon orange">🚑</div>
          <div class="injury-stat-content">
            <div class="injury-stat-label">Total Injured</div>
            <div class="injury-stat-value">${totalCount}</div>
            <div class="injury-stat-sub">Across the league</div>
          </div>
        </div>
        <div class="injury-stat-card">
          <div class="injury-stat-icon red">⛔</div>
          <div class="injury-stat-content">
            <div class="injury-stat-label">Out / IR</div>
            <div class="injury-stat-value" style="color: var(--danger);">${irOutCount}</div>
            <div class="injury-stat-sub">Won't play this week</div>
          </div>
        </div>
        <div class="injury-stat-card">
          <div class="injury-stat-icon blue">👥</div>
          <div class="injury-stat-content">
            <div class="injury-stat-label">On Rosters</div>
            <div class="injury-stat-value">${rosteredCount}</div>
            <div class="injury-stat-sub">vs ${totalCount - rosteredCount} free agents</div>
          </div>
        </div>
        <div class="injury-stat-card">
          <div class="injury-stat-icon purple">🎯</div>
          <div class="injury-stat-content">
            <div class="injury-stat-label">Most Affected</div>
            <div class="injury-stat-value">${mostAffectedPos ? mostAffectedPos[0] : '—'}</div>
            <div class="injury-stat-sub">${mostAffectedPos ? mostAffectedPos[1] + ' players' : ''}</div>
          </div>
        </div>
      </div>

      <div class="filters-bar">
        <select class="filter-select" id="inj-filter-status">
          <option value="ALL"${f.status === 'ALL' ? ' selected' : ''}>All Statuses</option>
          ${STATUS_ORDER.filter(s => allInjured.some(p => p.injuryStatus === s))
            .map(s => `<option value="${s}"${f.status === s ? ' selected' : ''}>${STATUS_LABELS[s]}</option>`)
            .join('')}
        </select>
        <select class="filter-select" id="inj-filter-position">
          <option value="ALL"${f.position === 'ALL' ? ' selected' : ''}>All Positions</option>
          ${['QB','RB','WR','TE','K','DEF'].map(p => `<option value="${p}"${f.position === p ? ' selected' : ''}>${p}</option>`).join('')}
        </select>
        <select class="filter-select" id="inj-filter-owner">
          <option value="ALL"${f.owner === 'ALL' ? ' selected' : ''}>All Owners</option>
          <option value="ROSTERED"${f.owner === 'ROSTERED' ? ' selected' : ''}>On Rosters</option>
          <option value="FA"${f.owner === 'FA' ? ' selected' : ''}>Free Agents</option>
          ${state.rosters.map(r => `<option value="${r.roster_id}"${f.owner === String(r.roster_id) ? ' selected' : ''}>${getTeamName(r.roster_id)}</option>`).join('')}
        </select>
      </div>

      <div class="injury-layout">
        <div class="injury-table-wrap">
          <table class="injury-table">
            <thead>
              <tr><th>Player</th><th>Status</th><th>Injury</th><th>Expected Return</th><th>Owner</th></tr>
            </thead>
            <tbody>${tableBodyHtml}</tbody>
          </table>
        </div>

        <div class="lineup-risk-panel">
          <div class="lineup-risk-header">
            <div>
              <div class="lineup-risk-title">⚠️ Lineup Risks</div>
              <div class="lineup-risk-summary">${totalRiskCount} starter${totalRiskCount === 1 ? '' : 's'}${totalHighRiskCount ? ` · <strong style="color: var(--danger);">${totalHighRiskCount} severe</strong>` : ''}<br/><span style="font-size: 10px; color: var(--text-muted);">% = play rate, league-wide average (hover for details)</span></div>
            </div>
            <select class="filter-select" id="risk-week-select" style="font-size: 12px; padding: 4px 24px 4px 8px;">
              ${availableWeeks.map(w => `<option value="${w}"${w === riskWeek ? ' selected' : ''}>Wk ${w}${w === state.currentWeek ? ' · Current' : ''}</option>`).join('')}
            </select>
          </div>
          <div class="lineup-risk-list">${riskHtml}</div>
        </div>
      </div>
    `;

    document.getElementById('inj-filter-status').addEventListener('change', (e) => { state.injuryFilter.status = e.target.value; renderView(); });
    document.getElementById('inj-filter-position').addEventListener('change', (e) => { state.injuryFilter.position = e.target.value; renderView(); });
    document.getElementById('inj-filter-owner').addEventListener('change', (e) => { state.injuryFilter.owner = e.target.value; renderView(); });
    document.getElementById('risk-week-select')?.addEventListener('change', (e) => {
      state.injuryRiskWeek = parseInt(e.target.value);
      renderView();
    });
    main.querySelectorAll('[data-player-id]').forEach(el => {
      el.addEventListener('click', () => {
        state.activePlayerId = el.dataset.playerId;
        renderView();
      });
    });
  }

  // ----- PRACTICE REPORT -----
  // Real nflverse weekly injury/practice data (src/injury_report.py's
  // `practice_report` export block) -- a DIFFERENT source than the Injury
  // tab / Lineup Risks panel above, which read Sleeper's own injury_status.
  // Checked directly against real rostered players in this league before
  // building this (see notebooks/08_practice_report.ipynb): the two
  // disagree often and in both directions -- nflverse's official
  // report_status already showing Questionable/Doubtful/Out while
  // Sleeper's injury_status still reads healthy (Sleeper hasn't caught up
  // to this week's report), and the reverse (Sleeper flags Questionable
  // with no current nflverse report_status). A player Sleeper marks PUP
  // can still show up here with a real practice_status as they work back.
  // These are complementary, not redundant, so both columns are shown
  // side by side rather than collapsed into one "status."
  //
  // Also real, not assumed (same notebook): practice participation is
  // measurably predictive. Across 2018-2025, a "Did Not Participate" week
  // preceded the player actually playing only ~16% of the time (vs ~84%
  // for Full Participation); conditional on playing anyway, a Limited week
  // produced real production/snap-share discounts vs. that player's own
  // healthy-week baseline. That finding is reported here and in
  // PROJECT_CONTEXT.md -- it is NOT wired into the projection model.
  function renderPracticeReportView(main) {
    const f = state.practiceReportFilters;
    const pr = state.advancedStats?.practice_report;
    const weekKeys = pr ? Object.keys(pr.weeks).map(Number).sort((a, b) => a - b) : [];

    if (!pr || weekKeys.length === 0) {
      main.innerHTML = `
        <div class="page-header-row"><div><div class="page-title">Practice Report</div></div></div>
        <div class="panel"><div class="placeholder-content">
          <h3>📋 Awaiting model output</h3>
          <p>No real nflverse practice-report data in this export yet.</p>
        </div></div>
      `;
      return;
    }

    // Default to the most recent real week this export has a report for --
    // NOT necessarily state.currentWeek, which can be one week AHEAD of the
    // last week nflverse has actually published a report for.
    if (state.practiceReportWeek == null || !weekKeys.includes(state.practiceReportWeek)) {
      state.practiceReportWeek = weekKeys[weekKeys.length - 1];
    }
    const week = state.practiceReportWeek;
    const rawRows = pr.weeks[String(week)] || [];

    const teamOptions = ['ALL', ...NFL_TEAMS].sort();

    // practice_status/report_status are real free-text values, not a fixed
    // enum this codebase controls (nflverse's own vocabulary) -- these
    // three helpers are the ONE place that vocabulary gets interpreted,
    // for severity ranking, a short label, and a CSS-safe class.
    function practiceRank(status) {
      if (!status) return 0;
      if (status.startsWith('Did Not Participate') || status.startsWith('Out')) return 3;
      if (status.startsWith('Limited')) return 2;
      if (status.startsWith('Full')) return 1;
      return 0;
    }
    function practiceCode(status) {
      if (!status) return null;
      if (status.startsWith('Did Not Participate') || status.startsWith('Out')) return 'dnp';
      if (status.startsWith('Limited')) return 'limited';
      if (status.startsWith('Full')) return 'full';
      return null;
    }
    function practiceLabel(status) {
      if (!status) return null;
      if (status.startsWith('Did Not Participate')) return 'DNP';
      if (status.startsWith('Out')) return 'Out';
      if (status.startsWith('Limited')) return 'Limited';
      if (status.startsWith('Full')) return 'Full';
      return status;
    }
    const REPORT_RANK = { Out: 4, Doubtful: 3, Questionable: 2, Probable: 1 };
    function reportRank(status) { return REPORT_RANK[status] || 0; }

    function formatFreshness(iso) {
      if (!iso) return 'unknown (nflverse metadata fetch failed at export time)';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return 'unknown';
      return d.toLocaleString('en-US', {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short',
      });
    }

    // Inline 32px avatar -- same pattern as every other table's own
    // `rowAvatar`, keyed by sleeper_id (nullable here -- not every reported
    // player has a crosswalk match) rather than state.players, since a
    // deep-bench/practice-squad player can be real in this report without
    // ever appearing in the dashboard's own trimmed player list.
    function rowAvatar(p) {
      const teamLogo = `https://a.espncdn.com/i/teamlogos/nfl/500/${(p.team || '').toLowerCase()}.png`;
      if (!p.sleeper_id) {
        return `<div class="player-row-avatar">${getInitials(p.name)}</div>`;
      }
      const headshot = `https://sleepercdn.com/content/nfl/players/thumb/${p.sleeper_id}.jpg`;
      return `<div class="player-row-avatar">
        <img src="${headshot}"
          onerror="this.onerror=null; this.src='${teamLogo}'; this.onerror=function(){this.style.display='none'; this.parentElement.textContent='${getInitials(p.name)}';}"
          alt="${p.name}">
      </div>`;
    }

    // ---- Enrich once per week-load: rostered/owner/Sleeper cross-reference,
    // independent of search/filter/sort so it doesn't need recomputing on
    // every keystroke. Rostered status is checked against state.rosters'
    // OWN player lists (every player_id on a roster, active or not), not
    // state.playersById (which drops inactive/unrostered non-fantasy-
    // relevant entries) -- see this function's own rowAvatar comment for
    // why that trimmed list isn't the right membership test here either.
    const enriched = rawRows.map(r => {
      const ownerRoster = r.sleeper_id ? state.rosters.find(ro => (ro.players || []).includes(r.sleeper_id)) : null;
      const sleeperPlayer = r.sleeper_id ? state.playersById[r.sleeper_id] : null;
      return {
        ...r,
        isRostered: !!ownerRoster,
        ownerRosterId: ownerRoster ? ownerRoster.roster_id : null,
        sleeperInjuryStatus: sleeperPlayer ? sleeperPlayer.injuryStatus : null,
        relevance: (ownerRoster ? 1000 : 0) + reportRank(r.report_status) * 10 + practiceRank(r.practice_status),
      };
    });

    main.innerHTML = `
      <div class="page-header-row">
        <div>
          <div class="page-title">Practice Report</div>
          <div class="page-subtitle" id="practice-subtitle"></div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <label style="font-size: 12px; color: var(--text-secondary); font-weight: 600;">Week:</label>
          <select class="filter-select" id="practice-week-select" style="font-size: 12px;">
            ${weekKeys.map(w => `<option value="${w}"${w === week ? ' selected' : ''}>Week ${w}${w === state.currentWeek ? ' · Current' : ''}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="info-banner" style="border-left-color: var(--warning); align-items: flex-start; flex-direction: column; gap: 6px;">
        <div>📋 <strong>This is nflverse's official weekly practice report, not a day-by-day breakdown.</strong>
        There's no Wednesday/Thursday/Friday split anywhere in this source -- <strong>Practice</strong> is that whole
        week's participation, and <strong>Report</strong> is the official game designation. Both describe the
        WEEK, not one specific practice.</div>
        <div>🕒 <strong>nflverse data as of ${formatFreshness(pr.source_updated_at)}.</strong> nflverse regenerates
        this file on its own schedule and can lag the real, live report -- most riskily on a Friday afternoon right
        before games. Don't treat this as more current than that timestamp; check a live source before a
        time-sensitive lineup call.</div>
        <div>🔀 <strong>Different source than the Injury tab</strong> (which reads Sleeper's own status). They can
        disagree in either direction -- shown side by side below so a mismatch is visible, not hidden.</div>
      </div>

      <div class="filters-bar">
        <input type="text" class="search-input" id="practice-search" placeholder="Search players..." value="${f.search}" />
        <select class="filter-select" id="practice-filter-position">
          <option value="ALL"${f.position === 'ALL' ? ' selected' : ''}>All Positions</option>
          ${['QB','RB','WR','TE','K'].map(p => `<option value="${p}"${f.position === p ? ' selected' : ''}>${p}</option>`).join('')}
        </select>
        <select class="filter-select" id="practice-filter-team">
          ${teamOptions.map(t => `<option value="${t}"${f.team === t ? ' selected' : ''}>${t === 'ALL' ? 'All NFL Teams' : t}</option>`).join('')}
        </select>
        <select class="filter-select" id="practice-filter-rostered">
          <option value="ALL"${f.rostered === 'ALL' ? ' selected' : ''}>All Players</option>
          <option value="ROSTERED"${f.rostered === 'ROSTERED' ? ' selected' : ''}>On Rosters</option>
          <option value="FA"${f.rostered === 'FA' ? ' selected' : ''}>Free Agents</option>
        </select>
      </div>

      <div class="panel" style="padding: 0; overflow: hidden;">
        <table class="players-table">
          <thead>
            <tr>
              <th data-sort="name" class="${f.sortBy === 'name' ? 'sorted' : ''}">Player ${f.sortBy === 'name' ? (f.sortDir === 'asc' ? '↑' : '↓') : ''}</th>
              <th data-sort="position" class="${f.sortBy === 'position' ? 'sorted' : ''}">Pos ${f.sortBy === 'position' ? (f.sortDir === 'asc' ? '↑' : '↓') : ''}</th>
              <th data-sort="team" class="${f.sortBy === 'team' ? 'sorted' : ''}">NFL ${f.sortBy === 'team' ? (f.sortDir === 'asc' ? '↑' : '↓') : ''}</th>
              <th data-sort="practice_status" class="${f.sortBy === 'practice_status' ? 'sorted' : ''}" title="This week's overall practice participation">Practice ${f.sortBy === 'practice_status' ? (f.sortDir === 'asc' ? '↑' : '↓') : ''}</th>
              <th data-sort="report_status" class="${f.sortBy === 'report_status' ? 'sorted' : ''}" title="Official game designation for this week">Report ${f.sortBy === 'report_status' ? (f.sortDir === 'asc' ? '↑' : '↓') : ''}</th>
              <th title="practice_primary_injury, with the official report's injury noted below only when it names a different issue">Injury</th>
              <th title="Sleeper's own injury_status -- the same field driving the Injury tab. Can disagree with nflverse's Report column above.">Sleeper Status</th>
              <th>Owner</th>
            </tr>
          </thead>
          <tbody id="practice-tbody"></tbody>
        </table>
      </div>
    `;

    function renderTable() {
      let filtered = enriched;
      if (f.search) filtered = filtered.filter(p => p.name.toLowerCase().includes(f.search.toLowerCase()));
      if (f.position !== 'ALL') filtered = filtered.filter(p => p.position === f.position);
      if (f.team !== 'ALL') filtered = filtered.filter(p => p.team === f.team);
      if (f.rostered === 'ROSTERED') filtered = filtered.filter(p => p.isRostered);
      else if (f.rostered === 'FA') filtered = filtered.filter(p => !p.isRostered);

      filtered = filtered.slice().sort((a, b) => {
        let valA, valB;
        if (f.sortBy === 'relevance') { valA = a.relevance; valB = b.relevance; }
        else if (f.sortBy === 'practice_status') { valA = practiceRank(a.practice_status); valB = practiceRank(b.practice_status); }
        else if (f.sortBy === 'report_status') { valA = reportRank(a.report_status); valB = reportRank(b.report_status); }
        else { valA = a[f.sortBy]; valB = b[f.sortBy]; }
        if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = (valB || '').toLowerCase(); }
        if (valA == null) valA = -Infinity;
        if (valB == null) valB = -Infinity;
        if (valA === valB) return a.name.localeCompare(b.name);
        const cmp = valA < valB ? -1 : 1;
        return f.sortDir === 'desc' ? -cmp : cmp;
      });

      document.getElementById('practice-subtitle').textContent =
        `${filtered.length} of ${enriched.length} players · Week ${week} · sorted by ${f.sortBy === 'relevance' ? 'relevance (rostered + severity)' : f.sortBy.replace('_', ' ')}`;

      document.getElementById('practice-tbody').innerHTML = filtered.map(p => {
        const practiceCell = p.practice_status
          ? `<span class="practice-badge ${practiceCode(p.practice_status)}" title="${p.practice_status}">${practiceLabel(p.practice_status)}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">—</span>';
        const reportCell = p.report_status
          ? `<span class="practice-badge ${p.report_status.toLowerCase()}">${p.report_status}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">No designation</span>';
        const practiceInjury = p.practice_primary_injury || null;
        const reportInjury = p.report_primary_injury || null;
        const injuryDiffers = !!(practiceInjury && reportInjury && practiceInjury.toLowerCase() !== reportInjury.toLowerCase());
        const injuryCell = practiceInjury
          ? `${practiceInjury}${injuryDiffers ? `<div style="font-size: 10px; color: var(--warning);" title="The official game designation names a different issue than this week's practice report -- worth a second look.">Official report: ${reportInjury}</div>` : ''}`
          : (reportInjury || '<span style="color: var(--text-muted); font-size: 11px;">—</span>');
        const sleeperCell = p.sleeperInjuryStatus
          ? `<span class="injury-badge ${p.sleeperInjuryStatus}">${p.sleeperInjuryStatus}</span>`
          : '<span style="color: var(--text-muted); font-size: 11px;">Healthy / not tracked</span>';
        const ownerCell = p.isRostered
          ? `<span style="font-size: 12px;">${getTeamName(p.ownerRosterId)}</span>`
          : '<span class="free-agent-pill">Free Agent</span>';
        return `
          <tr data-sleeper-id="${p.sleeper_id || ''}">
            <td><div class="player-row-name">${rowAvatar(p)}<span>${p.name}</span></div></td>
            <td><span class="pos-badge ${p.position}">${p.position}</span></td>
            <td>${p.team || '—'}</td>
            <td>${practiceCell}</td>
            <td>${reportCell}</td>
            <td style="font-size: 12px;">${injuryCell}</td>
            <td>${sleeperCell}</td>
            <td>${ownerCell}</td>
          </tr>
        `;
      }).join('');

      // Only rows resolving to a real state.playersById entry get a Player
      // Detail link -- a practice-squad body with no crosswalk/roster
      // match has nothing to drill into, so it's shown, just not clickable.
      document.querySelectorAll('#practice-tbody tr[data-sleeper-id]').forEach(el => {
        const sid = el.dataset.sleeperId;
        if (sid && state.playersById[sid]) {
          el.style.cursor = 'pointer';
          el.addEventListener('click', () => {
            state.activePlayerId = sid;
            renderView();
          });
        }
      });
    }

    renderTable();

    let searchDebounce = null;
    document.getElementById('practice-search').addEventListener('input', (e) => {
      f.search = e.target.value;
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(renderTable, 150);
    });
    document.getElementById('practice-week-select').addEventListener('change', (e) => {
      state.practiceReportWeek = parseInt(e.target.value);
      renderView();
    });
    document.getElementById('practice-filter-position').addEventListener('change', (e) => { f.position = e.target.value; renderTable(); });
    document.getElementById('practice-filter-team').addEventListener('change', (e) => { f.team = e.target.value; renderTable(); });
    document.getElementById('practice-filter-rostered').addEventListener('change', (e) => { f.rostered = e.target.value; renderTable(); });
    main.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.sort;
        if (f.sortBy === col) f.sortDir = f.sortDir === 'asc' ? 'desc' : 'asc';
        else { f.sortBy = col; f.sortDir = col === 'name' || col === 'position' || col === 'team' ? 'asc' : 'desc'; }
        renderView();
      });
    });
  }

  // ----- GAMECAST -----
  function renderGamecast(main) {
    const g = state.nflGames.find(x => x.id === state.activeNflGameId);
    if (!g) { state.activeNflGameId = null; return renderView(); }
    const awayWinning = g.awayScore > g.homeScore;
    const homeWinning = g.homeScore > g.awayScore;
    const isPre = g.status === 'pre';
    const w = g.weather;

    // ----- Team colors with curated overrides + similarity check -----
    // ESPN's team.color isn't always great for visualization: Colts come back
    // white (invisible on white panels), Steelers come back black instead of
    // their iconic yellow, Browns come back dark brown that blends with other
    // dark colors. This map picks the most recognizable, high-contrast
    // primary for each franchise, plus an alternate that activates when two
    // teams' primaries are too close in RGB space (e.g. Falcons red vs
    // Cardinals red). Falls back to ESPN values if a team isn't in the map.
    const NFL_TEAM_COLORS = {
      ARI: { primary: '#97233F', alternate: '#000000' },
      ATL: { primary: '#A71930', alternate: '#000000' },
      BAL: { primary: '#241773', alternate: '#9E7C0C' },
      BUF: { primary: '#00338D', alternate: '#C60C30' },
      CAR: { primary: '#0085CA', alternate: '#101820' },
      CHI: { primary: '#0B162A', alternate: '#C83803' },
      CIN: { primary: '#FB4F14', alternate: '#101820' },
      CLE: { primary: '#FF3C00', alternate: '#311D00' }, // orange, not brown
      DAL: { primary: '#003594', alternate: '#869397' },
      DEN: { primary: '#FB4F14', alternate: '#002244' },
      DET: { primary: '#0076B6', alternate: '#B0B7BC' },
      GB:  { primary: '#203731', alternate: '#FFB612' },
      HOU: { primary: '#03202F', alternate: '#A71930' },
      IND: { primary: '#002C5F', alternate: '#A2AAAD' }, // navy, not white
      JAX: { primary: '#006778', alternate: '#D7A22A' },
      KC:  { primary: '#E31837', alternate: '#FFB81C' },
      LV:  { primary: '#000000', alternate: '#A5ACAF' },
      LAC: { primary: '#0080C6', alternate: '#FFC20E' },
      LAR: { primary: '#003594', alternate: '#FFA300' },
      MIA: { primary: '#008E97', alternate: '#FC4C02' },
      MIN: { primary: '#4F2683', alternate: '#FFC62F' },
      NE:  { primary: '#002A5C', alternate: '#C60C30' },
      NO:  { primary: '#D3BC8D', alternate: '#101820' },
      NYG: { primary: '#0B2265', alternate: '#A71930' },
      NYJ: { primary: '#125740', alternate: '#000000' },
      PHI: { primary: '#004C54', alternate: '#A5ACAF' },
      PIT: { primary: '#FFB612', alternate: '#101820' }, // yellow, not black
      SF:  { primary: '#AA0000', alternate: '#B3995D' },
      SEA: { primary: '#002244', alternate: '#69BE28' },
      TB:  { primary: '#D50A0A', alternate: '#FF7900' },
      TEN: { primary: '#0C2340', alternate: '#4B92DB' },
      WAS: { primary: '#5A1414', alternate: '#FFB612' }
    };

    const hexToRgb = h => {
      const m = String(h || '').replace('#', '').padEnd(6, '0');
      return { r: parseInt(m.substr(0, 2), 16), g: parseInt(m.substr(2, 2), 16), b: parseInt(m.substr(4, 2), 16) };
    };
    const rgbDist = (c1, c2) => {
      const a = hexToRgb(c1), b = hexToRgb(c2);
      return Math.sqrt((a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2);
    };
    const SIMILARITY_THRESHOLD = 90; // RGB distance below which colors "clash"

    // Resolve each team to {primary, alternate}, preferring the curated map
    // but falling back to ESPN values for anything not in it (preseason
    // exhibition teams, etc.).
    const resolveTeamColors = abbr => NFL_TEAM_COLORS[abbr] || {
      primary: (g.away.abbr === abbr ? g.away.color : g.home.color) || '#0891b2',
      alternate: (g.away.abbr === abbr ? g.away.altColor : g.home.altColor) || '#57606a'
    };
    const awayPalette = resolveTeamColors(g.away.abbr);
    const homePalette = resolveTeamColors(g.home.abbr);

    let awayColor = awayPalette.primary;
    let homeColor = homePalette.primary;
    // Two-level clash check: if primaries are too close, away tries its alt.
    // If the alt is STILL too close, home switches to its alt as a last resort.
    if (rgbDist(awayColor, homeColor) < SIMILARITY_THRESHOLD) {
      awayColor = awayPalette.alternate;
      if (rgbDist(awayColor, homeColor) < SIMILARITY_THRESHOLD) {
        homeColor = homePalette.alternate;
      }
    }

    const tabsHtml = `
      <div class="gc-tabs">
        <div class="gc-tab ${state.activeGcTab === 'stats' ? 'active' : ''}" data-tab="stats">Stats</div>
        <div class="gc-tab ${state.activeGcTab === 'scoring' ? 'active' : ''}" data-tab="scoring">Scoring</div>
        <div class="gc-tab ${state.activeGcTab === 'fantasy' ? 'active' : ''}" data-tab="fantasy">Fantasy Impact</div>
      </div>
    `;
    let body = '';
    if (isPre) {
      body = `<div class="panel"><div class="placeholder-content"><h3>🕒 Game hasn't started yet</h3><p>Kickoff: ${g.time}</p></div></div>`;
    } else if (state.activeGcTab === 'stats' && g.stats) {
      const s = g.stats;

      // Helper: one stat row with a proportional split-bar below. awayNum and
      // homeNum drive the bar's width; displayAway/displayHome are what the
      // reader sees (defaults to the numeric inputs). lowerIsBetter inverts
      // which side is the "dominant" color (e.g. for turnovers, sacks).
      const statRow = (label, awayNum, homeNum, opts = {}) => {
        const { displayAway, displayHome, lowerIsBetter = false } = opts;
        const aNum = typeof awayNum === 'number' ? awayNum : (parseFloat(awayNum) || 0);
        const hNum = typeof homeNum === 'number' ? homeNum : (parseFloat(homeNum) || 0);
        const dispA = displayAway != null ? displayAway : awayNum;
        const dispH = displayHome != null ? displayHome : homeNum;
        const total = aNum + hNum;
        const awayPct = total > 0 ? (aNum / total) * 100 : 50;
        const homePct = 100 - awayPct;
        const tied = aNum === hNum;
        const awayBetter = lowerIsBetter ? aNum < hNum : aNum > hNum;
        const homeBetter = lowerIsBetter ? hNum < aNum : hNum > aNum;
        // Each segment gets its team color at full opacity — the bar's width
        // and the colored value text already convey which side is winning.
        const aBarStyle = `width: ${awayPct.toFixed(1)}%; background: ${awayColor}`;
        const hBarStyle = `width: ${homePct.toFixed(1)}%; background: ${homeColor}`;
        const aValStyle = awayBetter ? `color: ${awayColor}` : '';
        const hValStyle = homeBetter ? `color: ${homeColor}` : '';
        const aCls = tied ? '' : (awayBetter ? '' : 'weaker');
        const hCls = tied ? '' : (homeBetter ? '' : 'weaker');
        return `
          <div class="stat-row">
            <div class="stat-value-left ${aCls}" style="${aValStyle}">${dispA}</div>
            <div class="stat-label">${label}</div>
            <div class="stat-value-right ${hCls}" style="${hValStyle}">${dispH}</div>
            <div class="stat-bar">
              <div class="stat-bar-segment" style="${aBarStyle}"></div>
              <div class="stat-bar-segment" style="${hBarStyle}"></div>
            </div>
          </div>
        `;
      };

      // Helper: ratio stat ("X-Y" or "X/Y" format). Percentage drives the bar,
      // raw "X/Y" is shown to the reader.
      const ratioRow = (label, awayRatio, homeRatio, opts = {}) => {
        const parse = str => {
          const m = String(str).match(/(\d+)[-/](\d+)/);
          if (!m) return { num: 0, den: 0, pct: 0, display: '0/0' };
          const num = parseInt(m[1]);
          const den = parseInt(m[2]);
          return { num, den, pct: den > 0 ? (num / den) * 100 : 0, display: `${num}/${den}` };
        };
        const a = parse(awayRatio);
        const h = parse(homeRatio);
        return statRow(label, a.pct, h.pct, {
          displayAway: a.display,
          displayHome: h.display,
          ...opts
        });
      };

      // Helper: possession time "MM:SS". Total seconds drive the bar.
      const timeRow = (label, awayTime, homeTime) => {
        const toSec = str => {
          const m = String(str).match(/(\d+):(\d+)/);
          return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : 0;
        };
        return statRow(label, toSec(awayTime), toSec(homeTime), {
          displayAway: awayTime,
          displayHome: homeTime
        });
      };

      body = `
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">Team Stats</div>
            <div class="panel-note">${g.away.abbr} vs ${g.home.abbr}</div>
          </div>

          <div class="stats-section">
            <div class="stats-section-title">Match Overview</div>
            ${statRow('Total yards', s.away.totalYards, s.home.totalYards)}
            ${statRow('Yards / play', s.away.yardsPerPlay.toFixed(1), s.home.yardsPerPlay.toFixed(1))}
            ${timeRow('Time of possession', s.away.possession, s.home.possession)}
            ${statRow('First downs', s.away.firstDowns, s.home.firstDowns)}
            ${statRow('Turnovers', s.away.turnovers, s.home.turnovers, { lowerIsBetter: true })}
          </div>

          <div class="stats-section">
            <div class="stats-section-title">Passing</div>
            ${statRow('Passing yards', s.away.passYards, s.home.passYards)}
            ${ratioRow('Comp / att', s.away.completionAttempts, s.home.completionAttempts)}
            ${statRow('Yards / pass', s.away.yardsPerPass.toFixed(1), s.home.yardsPerPass.toFixed(1))}
            ${statRow('INTs thrown', s.away.intsThrown, s.home.intsThrown, { lowerIsBetter: true })}
            ${ratioRow('Sacks (#-yds)', s.away.sacksYardsLost, s.home.sacksYardsLost, { lowerIsBetter: true })}
          </div>

          <div class="stats-section">
            <div class="stats-section-title">Rushing</div>
            ${statRow('Rushing yards', s.away.rushYards, s.home.rushYards)}
            ${statRow('Carries', s.away.rushAttempts, s.home.rushAttempts)}
            ${statRow('Yards / carry', s.away.yardsPerRushAttempt.toFixed(1), s.home.yardsPerRushAttempt.toFixed(1))}
          </div>

          <div class="stats-section">
            <div class="stats-section-title">Efficiency</div>
            ${ratioRow('3rd down', s.away.thirdDownEff, s.home.thirdDownEff)}
            ${ratioRow('4th down', s.away.fourthDownEff, s.home.fourthDownEff)}
            ${ratioRow('Red zone TDs', s.away.redZoneAttempts, s.home.redZoneAttempts)}
          </div>

          <div class="stats-section">
            <div class="stats-section-title">Discipline</div>
            ${ratioRow('Penalties (#-yds)', s.away.totalPenaltiesYards, s.home.totalPenaltiesYards, { lowerIsBetter: true })}
            ${statRow('Fumbles lost', s.away.fumblesLost, s.home.fumblesLost, { lowerIsBetter: true })}
          </div>
        </div>
      `;
    } else if (state.activeGcTab === 'stats') {
      body = `<div class="panel"><div class="placeholder-content"><h3>📊 Stats unavailable</h3><p>Team stats couldn't be loaded for this game.</p></div></div>`;
    } else if (state.activeGcTab === 'scoring') {
      // Build the box score table — quarter columns expand to include OT
      // if either team scored in period 5+. Use the same logo+colors flow.
      const bx = g.boxScore;
      let boxScoreHtml = '';
      if (bx) {
        const numQuarters = bx.away.length;
        const headerLabels = [];
        for (let i = 0; i < numQuarters; i++) {
          headerLabels.push(i < 4 ? `Q${i + 1}` : (numQuarters === 5 ? 'OT' : `OT${i - 3}`));
        }
        const awayWon = bx.awayTotal > bx.homeTotal;
        const homeWon = bx.homeTotal > bx.awayTotal;
        const teamRow = (team, scores, total, losing) => `
          <tr>
            <td class="team-col">
              <div class="team-col-inner">
                ${team.logo ? `<img src="${team.logo}" alt="${team.abbr}">` : ''}
                <span>${team.name}</span>
              </div>
            </td>
            ${scores.map(s => `<td class="qtr-col ${s === 0 ? 'zero' : ''}">${s}</td>`).join('')}
            <td class="total-col ${losing ? 'losing' : ''}">${total}</td>
          </tr>
        `;
        boxScoreHtml = `
          <div class="panel" style="margin-bottom: 12px;">
            <div class="panel-header">
              <div class="panel-title">Box Score</div>
              <div class="panel-note">Scoring by quarter</div>
            </div>
            <table class="boxscore-table">
              <thead>
                <tr>
                  <th class="team-col">Team</th>
                  ${headerLabels.map(l => `<th>${l}</th>`).join('')}
                  <th class="total-col">T</th>
                </tr>
              </thead>
              <tbody>
                ${teamRow(g.away, bx.away, bx.awayTotal, homeWon)}
                ${teamRow(g.home, bx.home, bx.homeTotal, awayWon)}
              </tbody>
            </table>
          </div>
        `;
      }

      // ----- Player box stats: offense + defense + special teams per team -----
      // Pick a sensible subset of columns per category. ESPN gives more than
      // we need (AVG, SACKS, QBR, RTG, LONG, TGTS, etc.). Keeps tables narrow
      // enough to read without horizontal scroll.
      const PLAYER_CAT_LABELS = {
        passing:       ['C/ATT', 'YDS', 'TD', 'INT'],
        rushing:       ['CAR', 'YDS', 'AVG', 'TD'],
        receiving:     ['REC', 'YDS', 'AVG', 'TD'],
        defensive:     ['TOT', 'SOLO', 'SACKS', 'TFL', 'PD'],
        interceptions: ['INT', 'YDS', 'TD'],
        fumbles:       ['FUM', 'LOST', 'REC'],
        kicking:       ['FG', 'XP', 'PTS', 'LONG'],
        punting:       ['NO', 'YDS', 'AVG', 'LONG'],
        kickReturns:   ['NO', 'YDS', 'AVG', 'TD'],
        puntReturns:   ['NO', 'YDS', 'AVG', 'TD']
      };
      const CAT_DISPLAY_NAMES = {
        passing: 'Passing', rushing: 'Rushing', receiving: 'Receiving',
        defensive: 'Defense', interceptions: 'Interceptions', fumbles: 'Fumbles',
        kicking: 'Kicking', punting: 'Punting',
        kickReturns: 'Kick Returns', puntReturns: 'Punt Returns'
      };
      // Categories that always render (even when empty — notable absence).
      // Defensive subcategories and the return categories only render when
      // they have entries (most games have no return TDs, no INTs, no fumbles).
      const ALWAYS_SHOW = new Set(['passing', 'rushing', 'receiving', 'kicking', 'punting']);
      // Three-tier hierarchy: team → group → category. Group headers separate
      // Offense / Defense / Special Teams visually. A group is only rendered
      // if at least one of its categories has content to show.
      const CATEGORY_GROUPS = [
        { label: 'Offense', categories: ['passing', 'rushing', 'receiving'] },
        { label: 'Defense', categories: ['defensive', 'interceptions', 'fumbles'] },
        { label: 'Special Teams', categories: ['kicking', 'punting', 'kickReturns', 'puntReturns'] }
      ];

      const ps = g.playerStats;
      let playerStatsHtml = '';
      if (ps && (ps.away || ps.home)) {
        const renderCategoryCard = (catName, players) => {
          const cols = PLAYER_CAT_LABELS[catName];
          if (players.length === 0) {
            return `
              <div class="player-cat">
                <div class="player-cat-title">${CAT_DISPLAY_NAMES[catName]}</div>
                <div class="player-empty">No ${catName} stats recorded.</div>
              </div>
            `;
          }
          return `
            <div class="player-cat">
              <div class="player-cat-title">${CAT_DISPLAY_NAMES[catName]}</div>
              <table class="player-table">
                <thead>
                  <tr>
                    <th class="player-name-col">Player</th>
                    ${cols.map(c => `<th>${c}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${players.map(p => `
                    <tr>
                      <td class="player-name-col">${p.name}${p.position ? `<span class="pos">${p.position}</span>` : ''}</td>
                      ${cols.map(c => `<td>${p[c] != null ? p[c] : '—'}</td>`).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        };

        const renderTeamSection = (team, side) => {
          const teamPlayers = ps[side] || {};
          const groupSections = CATEGORY_GROUPS.map(group => {
            // Decide which cats to actually render inside this group:
            // always-show cats render even if empty; optional cats hide.
            const cards = group.categories
              .filter(c => (teamPlayers[c] || []).length > 0 || ALWAYS_SHOW.has(c))
              .map(c => renderCategoryCard(c, teamPlayers[c] || []))
              .join('');
            if (!cards) return ''; // entire group empty — skip group header too
            return `
              <div class="player-group-header">${group.label}</div>
              ${cards}
            `;
          }).join('');
          return `
            <div class="player-team-section">
              <div class="player-team-header">
                ${team.logo ? `<img src="${team.logo}" alt="${team.abbr}">` : ''}
                <span class="player-team-name">${team.name}</span>
              </div>
              ${groupSections}
            </div>
          `;
        };
        playerStatsHtml = `
          <div class="panel" style="margin-bottom: 12px;">
            <div class="panel-header">
              <div class="panel-title">Player Stats</div>
              <div class="panel-note">Offense · Defense · Special Teams</div>
            </div>
            ${renderTeamSection(g.away, 'away')}
            ${renderTeamSection(g.home, 'home')}
          </div>
        `;
      }

      const summaryHtml = `
        <div class="panel">
          <div class="panel-header"><div class="panel-title">Scoring Summary</div><div class="panel-note">${g.scoring.length} scoring play${g.scoring.length === 1 ? '' : 's'}</div></div>
          ${g.scoring.length === 0
            ? `<div class="placeholder-content" style="padding: 30px 20px;"><p>No scoring plays recorded.</p></div>`
            : `<div class="scoring-list">
                ${g.scoring.map(s => `<div class="scoring-row"><div class="scoring-qtr">${s.qtr}</div><div class="scoring-team">${s.team}</div><div class="scoring-desc">${s.desc}</div><div class="scoring-score">${s.score}</div></div>`).join('')}
              </div>`
          }
        </div>
      `;

      body = boxScoreHtml + playerStatsHtml + summaryHtml;
    } else if (state.activeGcTab === 'fantasy') {
      body = `<div class="panel"><div class="placeholder-content"><h3>📊 Fantasy Impact</h3><p>Not built yet — this will show which players from this game are on which fantasy team rosters, with live fantasy points.</p></div></div>`;
    }
    main.innerHTML = `
      <div class="gamecast-back" id="gc-back">← Back to Dashboard</div>
      <div class="gamecast-hero">
        <div class="gamecast-status-bar">
          ${isPre ? `<span>${g.time} · ${g.venue}</span>` : g.status === 'final' ? `<span style="color: var(--text-muted); font-weight: 700;">FINAL · ${g.venue}</span>` : `<span style="color: var(--live); font-weight: 700;">● LIVE · ${g.clock} · ${g.venue}</span>`}
        </div>
        <div class="gamecast-teams">
          <div class="gamecast-team">
            <div class="team-logo">${g.away.logo ? `<img src="${g.away.logo}" alt="${g.away.abbr}">` : g.away.abbr}</div>
            <div class="gamecast-team-name">${g.away.name}</div>
            <div class="gamecast-team-record">${g.away.record}</div>
          </div>
          <div class="gamecast-score-block">
            ${isPre ? `<div style="font-size: 18px; color: var(--text-muted); font-weight: 600;">VS</div>` : `<div class="gamecast-score-row"><span class="gamecast-score ${homeWinning ? 'losing' : ''}">${g.awayScore}</span><span class="gamecast-score-divider">–</span><span class="gamecast-score ${awayWinning ? 'losing' : ''}">${g.homeScore}</span></div>`}
          </div>
          <div class="gamecast-team">
            <div class="team-logo">${g.home.logo ? `<img src="${g.home.logo}" alt="${g.home.abbr}">` : g.home.abbr}</div>
            <div class="gamecast-team-name">${g.home.name}</div>
            <div class="gamecast-team-record">${g.home.record}</div>
          </div>
        </div>
      </div>
      <div class="weather-panel">
        <div class="weather-icon-block">
          <div class="weather-icon">${w.icon}</div>
          <div class="weather-temp">${w.isDome ? '—' : `${w.temp}°F`}</div>
        </div>
        <div class="weather-stats">
          <div><div class="weather-stat-label">Conditions</div><div class="weather-stat-value ${w.alert ? 'alert' : ''}">${w.condition}</div></div>
          <div><div class="weather-stat-label">Wind</div><div class="weather-stat-value ${w.wind >= 15 ? 'alert' : ''}">${w.isDome ? 'Indoor' : `${w.wind} mph ${w.windDir}`}</div></div>
          <div><div class="weather-stat-label">Humidity</div><div class="weather-stat-value">${w.humidity}%</div></div>
          <div><div class="weather-stat-label">Precip Chance</div><div class="weather-stat-value ${w.precip >= 50 ? 'alert' : ''}">${w.isDome ? '0%' : `${w.precip}%`}</div></div>
        </div>
      </div>
      ${tabsHtml}
      ${body}
    `;
    document.getElementById('gc-back').addEventListener('click', () => { state.activeNflGameId = null; renderView(); });
    document.querySelectorAll('.gc-tab').forEach(t => { t.addEventListener('click', () => { state.activeGcTab = t.dataset.tab; renderView(); }); });
  }

  document.getElementById('nav-links').addEventListener('click', (e) => {
    const link = e.target.closest('.nav-link');
    if (!link) return;
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    link.classList.add('active');
    state.currentView = link.dataset.view;
    state.activeNflGameId = null;
    state.activeMatchupId = null;
    state.activeTeamId = null;
    state.activePlayerId = null;
    state.showBench = false;
    state.tendenciesSelectedTeam = null;
    // Note: state.compareIds is intentionally preserved across nav changes
    renderView();
  });

  init();
})();
</script>
